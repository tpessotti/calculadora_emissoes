[novo_ano]\n        self._invalidar_caches()\n        logger.info(\"Ano ativo alterado de %d para %d\", antigo, novo_ano)\n\n    def set_anos_selecionados(self, anos: List[int]) -> None:\n        \"\"\"Define a lista de anos selecionados para an\u00e1lise comparativa.\"\"\"\n        if not anos:\n            return\n        self.anos_selecionados = sorted(anos)\n        self.ano_ativo = self.anos_selecionados[0]\n        self.modo_comparacao = len(self.anos_selecionados) > 1\n        self._invalidar_caches()\n        logger.info(\n            \"Anos selecionados: %s (compara\u00e7\u00e3o=%s)\",\n            self.anos_selecionados, self.modo_comparacao,\n        )\n\n    def _discover_anos(self) -> None:\n        \"\"\"Descobre anos dispon\u00edveis a partir do JSON DB.\"\"\"\n        anos: set[int] = set()\n        # Verificar diret\u00f3rio json_db por pastas-ano ou arquivo master\n        if os.path.isdir(self.json_db_dir):\n            master = os.path.join(self.json_db_dir, \"database.json\")\n            if os.path.exists(master):\n                try:\n                    import json\n                    with open(master, \"r\", encoding=\"utf-8\") as f:\n                        data = json.load(f)\n                    for yr in data.get(\"anos_disponiveis\", []):\n                        anos.add(int(yr))\n                except Exception as exc:\n                    logger.warning(\"Erro ao ler database.json: %s\", exc)\n\n            # Tamb\u00e9m procurar sub-pastas nomeadas por ano\n            for entry in os.listdir(self.json_db_dir):\n                if entry.isdigit() and len(entry) == 4:\n                    anos.add(int(entry))\n\n        # Fallback: olhar campo Periodo das unidades em session_state\n        for u in st.session_state.get(\"unidades\", []):\n            try:\n                from core.periodos import normalizar_periodo_unidade\n                periodo = getattr(u, \"Periodo\", \"0\")\n                for a in normalizar_periodo_unidade(str(periodo)):\n                    anos.add(a)\n            except (ValueError, TypeError):\n                pass\n\n        if not anos:\n            anos.add(DEFAULT_YEAR)\n\n        self.anos_disponiveis = sorted(anos)\n        if self.ano_ativo not in self.anos_disponiveis:\n            self.ano_ativo = self.anos_disponiveis[0]\n\n    def refresh_anos(self) -> None:\n        \"\"\"Re-descobre anos dispon\u00edveis (chamar ap\u00f3s importa\u00e7\u00e3o).\"\"\"\n        self._discover_anos()\n\n    # ------------------------------------------------------------------\n    # Invalida\u00e7\u00e3o de cache\n    # ------------------------------------------------------------------\n    @staticmethod\n    def _invalidar_caches() -> None:\n        \"\"\"Limpa caches do Streamlit ligados a dados por ano.\"\"\"\n        # Marcar que o canvas precisa re-render\n        st.session_state[\"refresh_canvas\"] = True\n        # Limpar flag de propaga\u00e7\u00e3o\n        st.session_state.pop(\"_pegada_propagada\", None)\n        st.session_state.pop(\"_calc_cache_key\", None)\n        logger.debug(\"Caches invalidados ap\u00f3s troca de ano.\")\n\n    # ------------------------------------------------------------------\n    # Caminhos utilit\u00e1rios\n    # ------------------------------------------------------------------\n    def fatores_path(self) -> str:\n        \"\"\"Caminho do arquivo de fatores de emiss\u00e3o.\"\"\"\n        return os.path.join(self.data_dir, \"fatores_emissao.json\")\n\n    def sessions_path(self) -> str:\n        \"\"\"Caminho do arquivo de sess\u00f5es de usu\u00e1rio.\"\"\"\n        return os.path.join(self.data_dir, \"user_sessions.json\")\n\n    def db_master_path(self) -> str:\n        \"\"\"Caminho do JSON master do banco de dados.\"\"\"\n        return os.path.join(self.json_db_dir, \"database.json\")\n\n\n# ---------------------------------------------------------------------------\n# Helper para renderizar o seletor de ano na sidebar\n# ---------------------------------------------------------------------------\ndef render_year_selector() -> int:\n    \"\"\"Renderiza o seletor de ano na sidebar e retorna o ano ativo.\n\n    Oferece dois modos:\n      1. Ano \u00fanico (selectbox) \u2014 para opera\u00e7\u00e3o normal\n      2. Multi-ano (multiselect + express\u00e3o de per\u00edodo) \u2014 para compara\u00e7\u00f5es\n    \"\"\"\n    ctx = AppContext.get()\n\n    with st.sidebar:\n        st.markdown(\"---\")\n        st.markdown(\"### \ud83d\udcc5 Per\u00edodo de An\u00e1lise\")\n\n        # Toggle compara\u00e7\u00e3o\n        modo_comp = st.toggle(\n            \"Modo comparativo\",\n            value=ctx.modo_comparacao,\n            key=\"_modo_comparacao_toggle\",\n            help=\"Ativa sele\u00e7\u00e3o de m\u00faltiplos anos para an\u00e1lise comparativa.\",\n        )\n\n        if modo_comp:\n            # --- Multi-ano ---\n            # Op\u00e7\u00e3o 1: multiselect\n            sel_anos = st.multiselect(\n                \"Selecione os anos:\",\n                options=ctx.anos_disponiveis,\n                default=ctx.anos_selecionados\n                if all(a in ctx.anos_disponiveis for a in ctx.anos_selecionados)\n                else [ctx.ano_ativo],\n                key=\"_anos_multiselect\",\n                help=\"Selecione um ou mais anos para compara\u00e7\u00e3o.\",\n            )\n\n            # Op\u00e7\u00e3o 2: express\u00e3o textual\n            expr = st.text_input(\n                \"Ou use express\u00e3o de per\u00edodo:\",\n                placeholder=\"Ex: 2020-2025; 2030\",\n                key=\"_periodo_expr\",\n                help='Intervalos: \"2020-2025\". Listas: \"2020, 2022\". Todos: \"*\".',\n            )\n\n            # Resolver express\u00e3o se preenchida\n            anos_resultado = sel_anos\n            if expr and expr.strip():\n                try:\n                    from core.periodos import parse_periodo\n                    anos_parsed = parse_periodo(expr, anos_disponiveis=ctx.anos_disponiveis)\n                    anos_resultado = anos_parsed\n                except Exception as e:\n                    st.error(f\"Express\u00e3o inv\u00e1lida: {e}\")\n\n            # Aplicar sele\u00e7\u00e3o\n            if anos_resultado and sorted(anos_resultado) != sorted(ctx.anos_selecionados):\n                ctx.set_anos_selecionados(anos_resultado)\n                st.rerun()\n\n            # Se toggle mudou para compara\u00e7\u00e3o\n            if not ctx.modo_comparacao and modo_comp:\n                ctx.modo_comparacao = True\n                if len(ctx.anos_selecionados) <= 1:\n                    ctx.anos_selecionados = [ctx.ano_ativo]\n\n            # Status\n            from core.periodos import format_periodo\n            st.caption(\n                f\"\ud83d\udcca Anos: **{format_periodo(ctx.anos_selecionados)}** \u00b7 \"\n                f\"Modo: {'\ud83d\udd00 Comparativo' if ctx.modo_comparacao else '\ud83d\udccc Simples'} \u00b7 \"\n                f\"Base: {'\u2705' if ctx.base_carregada else '\u23f3'}\"\n            )\n\n        else:\n            # --- Ano \u00fanico ---\n            ano = st.selectbox(\n                \"Selecione o ano:\",\n                ctx.anos_disponiveis,\n                index=ctx.anos_disponiveis.index(ctx.ano_ativo)\n                if ctx.ano_ativo in ctx.anos_disponiveis\n                else 0,\n                key=\"_ano_selector\",\n                help=\"Filtra dados e c\u00e1lculos pelo ano selecionado.\",\n            )\n            if ano != ctx.ano_ativo:\n                ctx.set_ano(ano)\n                st.rerun()\n\n            # Se saiu do modo compara\u00e7\u00e3o\n            if ctx.modo_comparacao and not modo_comp:\n                ctx.modo_comparacao = False\n                ctx.anos_selecionados = [ctx.ano_ativo]\n\n            st.caption(\n                f\"\ud83d\udcca Ano: **{ctx.ano_ativo}** \u00b7 \"\n                f\"Base: {'\u2705' if ctx.base_carregada else '\u23f3'}\"\n            )\n\n    return ctx.ano_ativo\n", "core/periodos.py": "\"\"\"\nParser e utilit\u00e1rios para per\u00edodos multi-ano.\n\nSuporta nota\u00e7\u00f5es como:\n  - \"2025\"             \u2192 [2025]\n  - \"2020-2025\"        \u2192 [2020, 2021, 2022, 2023, 2024, 2025]\n  - \"2020-2025; 2030\"  \u2192 [2020, 2021, 2022, 2023, 2024, 2025, 2030]\n  - \"2020, 2022, 2025\" \u2192 [2020, 2022, 2025]\n  - \"*\" ou \"todos\"     \u2192 todos os anos dispon\u00edveis (requer contexto)\n\nRegras:\n  - Anos v\u00e1lidos: 1900\u20132100\n  - Intervalos invertidos s\u00e3o rejeitados (e.g. \"2030-2020\")\n  - Separadores aceitos: \";\" e \",\"\n  - Resultado sempre ordenado, sem duplicatas\n\"\"\"\nfrom __future__ import annotations\n\nimport re\nfrom typing import List, Optional, Tuple\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  Constantes\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\n_MIN_ANO = 1900\n_MAX_ANO = 2100\n\n# Regex para tokens: year-range (\"2020-2025\") ou year isolado (\"2025\")\n_TOKEN_RANGE = re.compile(r\"^\\s*(\\d{4})\\s*-\\s*(\\d{4})\\s*$\")\n_TOKEN_YEAR = re.compile(r\"^\\s*(\\d{4})\\s*$\")\n_WILDCARD = re.compile(r\"^\\s*(\\*|todos)\\s*$\", re.IGNORECASE)\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  Exce\u00e7\u00f5es\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nclass PeriodoError(ValueError):\n    \"\"\"Erro ao parsear uma express\u00e3o de per\u00edodo.\"\"\"\n    pass\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  Parser principal\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef parse_periodo(\n    expr: str,\n    anos_disponiveis: Optional[List[int]] = None,\n) -> List[int]:\n    \"\"\"Converte uma express\u00e3o de per\u00edodo em lista ordenada de anos.\n\n    Args:\n        expr: Express\u00e3o textual (e.g. ``\"2020-2025; 2030\"``).\n        anos_disponiveis: Lista de anos v\u00e1lidos (usado pelo wildcard ``*``).\n\n    Returns:\n        Lista de anos ordenada, sem duplicatas.\n\n    Raises:\n        PeriodoError: Se a express\u00e3o for inv\u00e1lida.\n\n    Examples:\n        >>> parse_periodo(\"2025\")\n        [2025]\n        >>> parse_periodo(\"2020-2023\")\n        [2020, 2021, 2022, 2023]\n        >>> parse_periodo(\"2020-2022; 2025, 2030\")\n        [2020, 2021, 2022, 2025, 2030]\n    \"\"\"\n    if not expr or not expr.strip():\n        raise PeriodoError(\"Express\u00e3o de per\u00edodo vazia.\")\n\n    expr = expr.strip()\n\n    # Wildcard\n    if _WILDCARD.match(expr):\n        if not anos_disponiveis:\n            raise PeriodoError(\n                \"Wildcard '*' requer lista de anos dispon\u00edveis.\"\n            )\n        return sorted(set(anos_disponiveis))\n\n    # Normalizar separadores: \";\" e \",\" s\u00e3o ambos delimitadores de segmentos\n    # Primeiro split por \";\", depois cada parte pode ter \",\"\n    segmentos_raw = expr.replace(\",\", \";\").split(\";\")\n    anos: set[int] = set()\n\n    for seg in segmentos_raw:\n        seg = seg.strip()\n        if not seg:\n            continue  # segmento vazio (e.g. trailing \";\")\n\n        # Tentar range\n        m_range = _TOKEN_RANGE.match(seg)\n        if m_range:\n            inicio = int(m_range.group(1))\n            fim = int(m_range.group(2))\n            _validar_ano(inicio, seg)\n            _validar_ano(fim, seg)\n            if inicio > fim:\n                raise PeriodoError(\n                    f\"Intervalo invertido: {inicio}-{fim}. \"\n                    f\"O ano inicial deve ser \u2264 ao final.\"\n                )\n            anos.update(range(inicio, fim + 1))\n            continue\n\n        # Tentar ano isolado\n        m_year = _TOKEN_YEAR.match(seg)\n        if m_year:\n            ano = int(m_year.group(1))\n            _validar_ano(ano, seg)\n            anos.add(ano)\n            continue\n\n        # Nenhum match\n        raise PeriodoError(\n            f\"Segmento inv\u00e1lido: '{seg}'. \"\n            f\"Use anos (2025), intervalos (2020-2025), ou '*'.\"\n        )\n\n    if not anos:\n        raise PeriodoError(f\"Nenhum ano encontrado na express\u00e3o: '{expr}'.\")\n\n    return sorted(anos)\n\n\ndef _validar_ano(ano: int, contexto: str = \"\") -> None:\n    \"\"\"Valida que um ano est\u00e1 no intervalo permitido.\"\"\"\n    if ano < _MIN_ANO or ano > _MAX_ANO:\n        ctx = f\" (em '{contexto}')\" if contexto else \"\"\n        raise PeriodoError(\n            f\"Ano {ano} fora do intervalo v\u00e1lido \"\n            f\"[{_MIN_ANO}\u2013{_MAX_ANO}]{ctx}.\"\n        )\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  Normaliza\u00e7\u00e3o anual\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef normalizar_periodo_unidade(periodo_str: str) -> List[int]:\n    \"\"\"Normaliza o campo Periodo de uma UnidadeProdutiva.\n\n    Se o campo j\u00e1 for um ano simples (\"2025\"), retorna [2025].\n    Se for um intervalo, expande.\n\n    Args:\n        periodo_str: Valor do campo Periodo.\n\n    Returns:\n        Lista de anos cobertos pelo per\u00edodo.\n    \"\"\"\n    try:\n        return parse_periodo(str(periodo_str))\n    except PeriodoError:\n        # Fallback: tentar interpretar como inteiro direto\n        try:\n            ano = int(periodo_str)\n            if _MIN_ANO <= ano <= _MAX_ANO:\n                return [ano]\n        except (ValueError, TypeError):\n            pass\n        return []\n\n\ndef expandir_registros_por_ano(\n    registros: List[dict],\n    campo_periodo: str = \"Periodo\",\n) -> List[dict]:\n    \"\"\"Expande registros que cobrem m\u00faltiplos anos em 1 registro por ano.\n\n    \u00datil para normalizar registros com Periodo = \"2020-2025\" em 6 registros\n    individuais (um por ano), mantendo todos os outros campos.\n\n    Args:\n        registros: Lista de dicts com campo de per\u00edodo.\n        campo_periodo: Nome do campo que cont\u00e9m a express\u00e3o de per\u00edodo.\n\n    Returns:\n        Lista expandida (pode ser maior que a original).\n    \"\"\"\n    resultado: list[dict] = []\n\n    for reg in registros:\n        periodo_raw = reg.get(campo_periodo, \"\")\n        anos = normalizar_periodo_unidade(str(periodo_raw))\n\n        if len(anos) <= 1:\n            # Sem expans\u00e3o necess\u00e1ria\n            resultado.append(reg)\n        else:\n            # Criar uma c\u00f3pia para cada ano\n            for ano in anos:\n                novo = dict(reg)\n                novo[campo_periodo] = str(ano)\n                resultado.append(novo)\n\n    return resultado\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  Utilit\u00e1rios\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef format_periodo(anos: List[int]) -> str:\n    \"\"\"Formata uma lista de anos de volta para nota\u00e7\u00e3o compacta.\n\n    Args:\n        anos: Lista ordenada de anos.\n\n    Returns:\n        String compacta (e.g. \"2020-2023; 2025; 2030\").\n\n    Examples:\n        >>> format_periodo([2020, 2021, 2022, 2023, 2025, 2030])\n        '2020-2023; 2025; 2030'\n    \"\"\"\n    if not anos:\n        return \"\"\n\n    anos_sorted = sorted(set(anos))\n    grupos: list[Tuple[int, int]] = []\n    inicio = anos_sorted[0]\n    fim = anos_sorted[0]\n\n    for ano in anos_sorted[1:]:\n        if ano == fim + 1:\n            fim = ano\n        else:\n            grupos.append((inicio, fim))\n            inicio = ano\n            fim = ano\n    grupos.append((inicio, fim))\n\n    partes: list[str] = []\n    for ini, f in grupos:\n        if ini == f:\n            partes.append(str(ini))\n        else:\n            partes.append(f\"{ini}-{f}\")\n\n    return \"; \".join(partes)\n\n\ndef periodo_contem_ano(periodo_str: str, ano: int) -> bool:\n    \"\"\"Verifica se uma express\u00e3o de per\u00edodo cont\u00e9m determinado ano.\n\n    Args:\n        periodo_str: Express\u00e3o de per\u00edodo.\n        ano: Ano a verificar.\n\n    Returns:\n        True se o ano est\u00e1 contido no per\u00edodo.\n    \"\"\"\n    try:\n        anos = parse_periodo(str(periodo_str))\n        return ano in anos\n    except PeriodoError:\n        # Fallback\n        try:\n            return int(periodo_str) == ano\n        except (ValueError, TypeError):\n            return False\n", "core/units.py": "from __future__ import annotations\n\nfrom typing import Dict, List, Optional, Union\n\nMASS_UNITS: Dict[str, Dict[str, Union[float, str]]] = {\n    # \u2500\u2500 M\u00e9tricas SI \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    \"g\":       {\"label\": \"Grama (g)\",                   \"to_ton\": 1e-6},\n    \"kg\":      {\"label\": \"Quilograma (kg)\",              \"to_ton\": 0.001},\n    \"t\":       {\"label\": \"Tonelada (t)\",                 \"to_ton\": 1.0},\n    \"kt\":      {\"label\": \"Quilotonelada (kt)\",           \"to_ton\": 1_000.0},\n    \"Mt\":      {\"label\": \"Megatonelada / Mi ton (Mt)\",   \"to_ton\": 1_000_000.0},\n    \"Gt\":      {\"label\": \"Gigatonelada / Bi ton (Gt)\",   \"to_ton\": 1_000_000_000.0},\n    # \u2500\u2500 Imperiais \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    \"lb\":      {\"label\": \"Libra (lb)\",                   \"to_ton\": 0.00045359237},\n    \"short_t\": {\"label\": \"Ton curta / US ton\",           \"to_ton\": 0.90718474},\n    \"long_t\":  {\"label\": \"Ton longa / UK ton\",           \"to_ton\": 1.0160469088},\n}\n\n# Mapa case-insensitive: \"mt\" -> \"Mt\", \"gt\" -> \"Gt\", \"t\" -> \"t\", \u2026\n_UNIT_LOWER_MAP: Dict[str, str] = {k.lower(): k for k in MASS_UNITS}\n\n\ndef unit_keys() -> List[str]:\n    return list(MASS_UNITS.keys())\n\n\ndef normalize_unit(unit: Optional[str], default: str = \"t\") -> str:\n    \"\"\"Normaliza a chave da unidade de massa (case-insensitive).\"\"\"\n    u = str(unit or \"\").strip().lower()\n    return _UNIT_LOWER_MAP.get(u, default)\n\n\ndef unit_label(unit: Optional[str]) -> str:\n    u = normalize_unit(unit)\n    return str(MASS_UNITS[u][\"label\"])\n\n\ndef convert_mass(value: Optional[Union[float, int]], from_unit: Optional[str], to_unit: Optional[str]) -> float:\n    if value is None:\n        return 0.0\n    f = normalize_unit(from_unit)\n    t = normalize_unit(to_unit)\n    val = float(value)\n    val_ton = val * float(MASS_UNITS[f][\"to_ton\"])\n    return val_ton / float(MASS_UNITS[t][\"to_ton\"])\n\n\ndef get_default_mass_unit_from_session(session_state, fallback: str = \"t\") -> str:\n    if session_state is None:\n        return fallback\n    return normalize_unit(session_state.get(\"mass_unit\", fallback), fallback)\n\n\n# \u2500\u2500 Unidades de emiss\u00e3o correlacionadas \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nCO2E_LABELS: Dict[str, str] = {\n    \"g\":       \"gCO\u2082e\",\n    \"kg\":      \"kgCO\u2082e\",\n    \"t\":       \"tCO\u2082e\",\n    \"kt\":      \"ktCO\u2082e\",\n    \"Mt\":      \"MtCO\u2082e\",\n    \"Gt\":      \"GtCO\u2082e\",\n    \"lb\":      \"lbCO\u2082e\",\n    \"short_t\": \"ston CO\u2082e\",\n    \"long_t\":  \"lton CO\u2082e\",\n}\n\n\ndef co2e_label(mass_unit: Optional[str] = None) -> str:\n    \"\"\"R\u00f3tulo da unidade de CO\u2082e equivalente \u00e0 unidade de massa selecionada.\n\n    Exemplos: \"t\" \u2192 \"tCO\u2082e\", \"kg\" \u2192 \"kgCO\u2082e\", \"Mt\" \u2192 \"MtCO\u2082e\".\n    \"\"\"\n    return CO2E_LABELS.get(normalize_unit(mass_unit), \"tCO\u2082e\")\n\n\ndef co2e_intensity_label(mass_unit: Optional[str] = None) -> str:\n    \"\"\"R\u00f3tulo de intensidade de emiss\u00e3o, ex.: \\\"tCO\u2082e/t\\\", \\\"kgCO\u2082e/kg\\\".\"\"\"\n    u = normalize_unit(mass_unit)\n    return f\"{co2e_label(u)}/{u}\"\n\n\ndef convert_co2e(value_kgco2e: Optional[Union[float, int]], target_mass_unit: Optional[str] = None) -> float:\n    \"\"\"Converte um valor em kgCO\u2082e (unidade interna dos c\u00e1lculos) para a unidade de\n    emiss\u00e3o correspondente \u00e0 unidade de massa selecionada pelo usu\u00e1rio.\n\n    Os fatores de emiss\u00e3o s\u00e3o expressos em kgCO\u2082e/unidade, portanto os valores\n    calculados pelo engine ficam armazenados em kgCO\u2082e. Esta fun\u00e7\u00e3o converte:\n      kgCO\u2082e  \u2192  tCO\u2082e     (\u00f7 1000)  quando target = \"t\"\n      kgCO\u2082e  \u2192  kgCO\u2082e    (\u00d7 1)     quando target = \"kg\"\n      kgCO\u2082e  \u2192  ktCO\u2082e    (\u00f7 1e6)   quando target = \"kt\"\n      \u2026 e assim por diante, seguindo a mesma escala de MASS_UNITS.\n    \"\"\"\n    return convert_mass(\n        float(value_kgco2e if value_kgco2e is not None else 0.0),\n        \"kg\",\n        target_mass_unit,\n    )\n", "core/__init__.py": "\"\"\"\nCore package \u2014 contexto, c\u00e1lculo, I/O e valida\u00e7\u00e3o.\n\"\"\"\n", "core/calc/cache.py": "\"\"\"\nWrappers de c\u00e1lculo com memoiza\u00e7\u00e3o.\n\nEncapsula EmissionCalculator com controle de cache\npara evitar rec\u00e1lculos desnecess\u00e1rios.\n\"\"\"\nfrom __future__ import annotations\n\nimport hashlib\nimport json\nimport logging\nfrom typing import Any, Dict, List, Optional, Tuple\n\nimport streamlit as st\n\nlogger = logging.getLogger(__name__)\n\n\ndef _hash_unidades(unidades: list) -> str:\n    \"\"\"Gera hash das unidades para invalida\u00e7\u00e3o de cache.\n\n    Usa hashing incremental (um objeto por vez) para evitar alocar\n    uma string gigante com todos os dados concatenados \u2014 reduz\n    consumo de mem\u00f3ria de pico em ambientes com heap limitada (WASM/Pyodide).\n    \"\"\"\n    try:\n        h = hashlib.md5()\n        for u in unidades:\n            if hasattr(u, \"to_dict\"):\n                chunk = json.dumps(u.to_dict(), sort_keys=True, default=str)\n            elif isinstance(u, dict):\n                chunk = json.dumps(u, sort_keys=True, default=str)\n            else:\n                continue\n            h.update(chunk.encode())\n        return h.hexdigest()\n    except Exception:\n        return \"\"\n\n\ndef _hash_conexoes(conexoes: list) -> str:\n    \"\"\"Gera hash das conex\u00f5es para invalida\u00e7\u00e3o de cache (hashing incremental).\"\"\"\n    try:\n        h = hashlib.md5()\n        for c in conexoes:\n            if hasattr(c, \"to_dict\"):\n                chunk = json.dumps(c.to_dict(), sort_keys=True, default=str)\n            elif isinstance(c, dict):\n                chunk = json.dumps(c, sort_keys=True, default=str)\n            else:\n                continue\n            h.update(chunk.encode())\n        return h.hexdigest()\n    except Exception:\n        return \"\"\n\n\ndef calcular_e_propagar(force: bool = False) -> bool:\n    \"\"\"Calcula emiss\u00f5es e propaga pegada se os dados mudaram.\n\n    Usa hashes para evitar rec\u00e1lculos quando os dados n\u00e3o mudaram.\n\n    Args:\n        force: For\u00e7ar rec\u00e1lculo mesmo sem mudan\u00e7a nos dados.\n\n    Returns:\n        True se os c\u00e1lculos foram executados, False se usou cache.\n    \"\"\"\n    from calculations import EmissionCalculator\n\n    unidades = st.session_state.get(\"unidades\", [])\n    conexoes_raw = st.session_state.get(\"conexoes\", [])\n    conexoes = [\n        {\"source\": c.origem, \"target\": c.destino, \"massa\": c.massa}\n        if hasattr(c, \"origem\") else c\n        for c in conexoes_raw\n    ]\n\n    # Verificar se precisa recalcular\n    h_u = _hash_unidades(unidades)\n    h_c = _hash_conexoes(conexoes)\n    cache_key = f\"{h_u}_{h_c}\"\n    \n    if not force and st.session_state.get(\"_calc_cache_key\") == cache_key:\n        logger.debug(\"Cache hit \u2014 c\u00e1lculos n\u00e3o reexecutados.\")\n        return False\n\n    # Calcular emiss\u00f5es por unidade\n    for u in unidades:\n        EmissionCalculator.calcular_emissoes(u)\n\n    # Propagar pegada\n    if conexoes:\n        EmissionCalculator.propagar_pegada(unidades, conexoes)\n    else:\n        # Sem conex\u00f5es \u2014 pegada = intensidade para cada unidade\n        for u in unidades:\n            u.PegadaEscopo1 = u.IntensidadeEmissaoEscopo1\n            u.PegadaEscopo2 = u.IntensidadeEmissaoEscopo2\n            u.PegadaEscopo3 = u.IntensidadeEmissaoEscopo3\n            u.Pegada = u.IntensidadeEmissao\n\n    # Atualizar cache key\n    st.session_state[\"_calc_cache_key\"] = cache_key\n    st.session_state[\"_pegada_propagada\"] = True\n    logger.info(\"C\u00e1lculos executados (hash=%s)\", cache_key[:8])\n    return True\n\n\ndef get_estatisticas_cached() -> Dict[str, Any]:\n    \"\"\"Retorna estat\u00edsticas calculadas, usando cache se poss\u00edvel.\"\"\"\n    unidades = st.session_state.get(\"unidades\", [])\n    conexoes = st.session_state.get(\"conexoes\", [])\n    \n    return {\n        \"total_unidades\": len(unidades),\n        \"total_conexoes\": len(conexoes),\n        \"emissao_total\": sum(\n            u.IntensidadeEmissao * u.MassaOutput\n            for u in unidades\n            if hasattr(u, \"IntensidadeEmissao\")\n        ),\n        \"pegada_total\": sum(\n            u.Pegada for u in unidades\n            if hasattr(u, \"Pegada\")\n        ),\n    }\n", "core/calc/comparativo.py": "\"\"\"\nMotor de an\u00e1lise comparativa multi-ano.\n\nGera pivot tables, deltas, varia\u00e7\u00f5es percentuais e gr\u00e1ficos\ncomparativos entre anos selecionados.\n\"\"\"\nfrom __future__ import annotations\n\nimport logging\nfrom typing import Any, Dict, List, Optional, Tuple\n\nimport pandas as pd\n\nlogger = logging.getLogger(__name__)\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  Pivot Tables\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef pivot_emissoes_por_ano(\n    unidades: List[Any],\n    anos: List[int],\n) -> pd.DataFrame:\n    \"\"\"Cria pivot table de emiss\u00f5es por unidade \u00d7 ano.\n\n    Linhas: unidades (ID_ELO / Nome)\n    Colunas: anos\n    Valores: Intensidade de Emiss\u00e3o total (tCO\u2082/t)\n\n    Args:\n        unidades: Lista de UnidadeProdutiva ou dicts.\n        anos: Lista de anos para as colunas.\n\n    Returns:\n        DataFrame pivotado.\n    \"\"\"\n    from core.periodos import normalizar_periodo_unidade\n\n    rows = []\n    for u in unidades:\n        id_elo = _get_attr(u, \"ID_ELO\")\n        nome = _get_attr(u, \"Nome\")\n        periodo = str(_get_attr(u, \"Periodo\", \"\"))\n        anos_u = normalizar_periodo_unidade(periodo)\n\n        for ano_u in anos_u:\n            if ano_u in anos:\n                rows.append({\n                    \"ID_ELO\": id_elo,\n                    \"Nome\": nome,\n                    \"Ano\": ano_u,\n                    \"IntensidadeEmissao\": float(_get_attr(u, \"IntensidadeEmissao\", 0.0)),\n                    \"IntensidadeEscopo1\": float(_get_attr(u, \"IntensidadeEmissaoEscopo1\", 0.0)),\n                    \"IntensidadeEscopo2\": float(_get_attr(u, \"IntensidadeEmissaoEscopo2\", 0.0)),\n                    \"IntensidadeEscopo3\": float(_get_attr(u, \"IntensidadeEmissaoEscopo3\", 0.0)),\n                    \"Pegada\": float(_get_attr(u, \"Pegada\", 0.0)),\n                    \"PegadaEscopo1\": float(_get_attr(u, \"PegadaEscopo1\", 0.0)),\n                    \"PegadaEscopo2\": float(_get_attr(u, \"PegadaEscopo2\", 0.0)),\n                    \"PegadaEscopo3\": float(_get_attr(u, \"PegadaEscopo3\", 0.0)),\n                    \"MassaOutput\": float(_get_attr(u, \"MassaOutput\", 0.0)),\n                    \"Localizacao\": _get_attr(u, \"Localizacao\", \"\"),\n                })\n\n    if not rows:\n        return pd.DataFrame()\n\n    df = pd.DataFrame(rows)\n    return df\n\n\ndef pivot_intensidade(\n    unidades: List[Any],\n    anos: List[int],\n    metrica: str = \"IntensidadeEmissao\",\n) -> pd.DataFrame:\n    \"\"\"Pivot table: unidades nas linhas, anos nas colunas, m\u00e9trica como valor.\n\n    Args:\n        unidades: Lista de UnidadeProdutiva ou dicts.\n        anos: Anos a pivotar.\n        metrica: Nome do campo de m\u00e9trica.\n\n    Returns:\n        DataFrame com index=Nome, columns=anos, values=metrica.\n    \"\"\"\n    df = pivot_emissoes_por_ano(unidades, anos)\n    if df.empty:\n        return df\n\n    pivot = df.pivot_table(\n        index=\"Nome\",\n        columns=\"Ano\",\n        values=metrica,\n        aggfunc=\"mean\",  # mean caso haja duplicatas\n    )\n    pivot.columns = [int(c) for c in pivot.columns]\n    return pivot.fillna(0.0)\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  Deltas e Varia\u00e7\u00f5es\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef calcular_deltas(\n    unidades: List[Any],\n    anos: List[int],\n    metrica: str = \"IntensidadeEmissao\",\n) -> pd.DataFrame:\n    \"\"\"Calcula deltas (varia\u00e7\u00e3o absoluta) entre anos consecutivos.\n\n    Args:\n        unidades: Lista de UnidadeProdutiva ou dicts.\n        anos: Anos ordenados.\n        metrica: Campo de m\u00e9trica.\n\n    Returns:\n        DataFrame com colunas \"\u0394 {ano1}\u2192{ano2}\" para cada par consecutivo.\n    \"\"\"\n    pivot = pivot_intensidade(unidades, anos, metrica)\n    if pivot.empty or len(anos) < 2:\n        return pd.DataFrame()\n\n    anos_sorted = sorted(anos)\n    result = pd.DataFrame(index=pivot.index)\n\n    for i in range(len(anos_sorted) - 1):\n        a1, a2 = anos_sorted[i], anos_sorted[i + 1]\n        if a1 in pivot.columns and a2 in pivot.columns:\n            col_name = f\"\u0394 {a1}\u2192{a2}\"\n            result[col_name] = pivot[a2] - pivot[a1]\n\n    return result\n\n\ndef calcular_variacao_pct(\n    unidades: List[Any],\n    anos: List[int],\n    metrica: str = \"IntensidadeEmissao\",\n) -> pd.DataFrame:\n    \"\"\"Calcula varia\u00e7\u00e3o percentual entre anos consecutivos.\n\n    Returns:\n        DataFrame com colunas \"% {ano1}\u2192{ano2}\".\n    \"\"\"\n    pivot = pivot_intensidade(unidades, anos, metrica)\n    if pivot.empty or len(anos) < 2:\n        return pd.DataFrame()\n\n    anos_sorted = sorted(anos)\n    result = pd.DataFrame(index=pivot.index)\n\n    for i in range(len(anos_sorted) - 1):\n        a1, a2 = anos_sorted[i], anos_sorted[i + 1]\n        if a1 in pivot.columns and a2 in pivot.columns:\n            col_name = f\"% {a1}\u2192{a2}\"\n            base = pivot[a1].replace(0, float(\"nan\"))\n            result[col_name] = ((pivot[a2] - pivot[a1]) / base * 100).round(2)\n\n    return result.fillna(0.0)\n\n\ndef resumo_comparativo(\n    unidades: List[Any],\n    anos: List[int],\n) -> Dict[str, Any]:\n    \"\"\"Gera resumo comparativo geral entre anos.\n\n    Returns:\n        Dict com totais por ano, deltas, e varia\u00e7\u00f5es.\n    \"\"\"\n    df = pivot_emissoes_por_ano(unidades, anos)\n    if df.empty:\n        return {\"anos\": anos, \"dados\": {}}\n\n    resultado: Dict[str, Any] = {\"anos\": sorted(anos), \"dados\": {}}\n\n    for ano in sorted(anos):\n        df_ano = df[df[\"Ano\"] == ano]\n        resultado[\"dados\"][ano] = {\n            \"total_unidades\": len(df_ano),\n            \"emissao_total\": df_ano[\"IntensidadeEmissao\"].sum(),\n            \"emissao_media\": df_ano[\"IntensidadeEmissao\"].mean(),\n            \"emissao_escopo1\": df_ano[\"IntensidadeEscopo1\"].sum(),\n            \"emissao_escopo2\": df_ano[\"IntensidadeEscopo2\"].sum(),\n            \"emissao_escopo3\": df_ano[\"IntensidadeEscopo3\"].sum(),\n            \"pegada_total\": df_ano[\"Pegada\"].sum(),\n            \"pegada_media\": df_ano[\"Pegada\"].mean(),\n            \"massa_total\": df_ano[\"MassaOutput\"].sum(),\n        }\n\n    # Deltas entre anos consecutivos\n    anos_sorted = sorted(anos)\n    deltas = []\n    for i in range(len(anos_sorted) - 1):\n        a1, a2 = anos_sorted[i], anos_sorted[i + 1]\n        d1 = resultado[\"dados\"].get(a1, {})\n        d2 = resultado[\"dados\"].get(a2, {})\n        emissao_delta = d2.get(\"emissao_total\", 0) - d1.get(\"emissao_total\", 0)\n        base = d1.get(\"emissao_total\", 0)\n        pct = (emissao_delta / base * 100) if base != 0 else 0.0\n        deltas.append({\n            \"de\": a1,\n            \"para\": a2,\n            \"delta_emissao\": round(emissao_delta, 4),\n            \"variacao_pct\": round(pct, 2),\n        })\n\n    resultado[\"deltas\"] = deltas\n    return resultado\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  Dados para gr\u00e1ficos Plotly\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef dados_grafico_barras_comparativo(\n    unidades: List[Any],\n    anos: List[int],\n    metrica: str = \"IntensidadeEmissao\",\n    por: str = \"unidade\",\n) -> Dict[str, Any]:\n    \"\"\"Prepara dados para gr\u00e1fico de barras comparativo (Plotly).\n\n    Args:\n        unidades: Lista de unidades.\n        anos: Anos a comparar.\n        metrica: Campo de m\u00e9trica.\n        por: \"unidade\" ou \"escopo\".\n\n    Returns:\n        Dict com \"labels\", \"series\" (dict ano\u2192valores), \"titulo\".\n    \"\"\"\n    if por == \"escopo\":\n        return _barras_por_escopo(unidades, anos)\n\n    pivot = pivot_intensidade(unidades, anos, metrica)\n    if pivot.empty:\n        return {\"labels\": [], \"series\": {}, \"titulo\": \"\"}\n\n    labels = list(pivot.index)\n    series = {int(ano): pivot[ano].tolist() for ano in pivot.columns}\n\n    return {\n        \"labels\": labels,\n        \"series\": series,\n        \"titulo\": f\"Comparativo {metrica} por Unidade\",\n    }\n\n\ndef _barras_por_escopo(\n    unidades: List[Any],\n    anos: List[int],\n) -> Dict[str, Any]:\n    \"\"\"Dados para gr\u00e1fico de barras por escopo \u00d7 ano.\"\"\"\n    df = pivot_emissoes_por_ano(unidades, anos)\n    if df.empty:\n        return {\"labels\": [], \"series\": {}, \"titulo\": \"\"}\n\n    escopos = [\"Escopo 1\", \"Escopo 2\", \"Escopo 3\"]\n    campos = [\"IntensidadeEscopo1\", \"IntensidadeEscopo2\", \"IntensidadeEscopo3\"]\n    labels = [str(a) for a in sorted(anos)]\n    series = {}\n\n    for escopo, campo in zip(escopos, campos):\n        valores = []\n        for ano in sorted(anos):\n            df_ano = df[df[\"Ano\"] == ano]\n            valores.append(round(df_ano[campo].sum(), 4))\n        series[escopo] = valores\n\n    return {\n        \"labels\": labels,\n        \"series\": series,\n        \"titulo\": \"Emiss\u00f5es por Escopo \u00d7 Ano\",\n    }\n\n\ndef dados_grafico_linha_evolucao(\n    unidades: List[Any],\n    anos: List[int],\n    metrica: str = \"IntensidadeEmissao\",\n) -> Dict[str, Any]:\n    \"\"\"Prepara dados para gr\u00e1fico de linha (evolu\u00e7\u00e3o temporal).\n\n    Returns:\n        Dict com \"anos\", \"series\" (dict nome\u2192valores).\n    \"\"\"\n    pivot = pivot_intensidade(unidades, anos, metrica)\n    if pivot.empty:\n        return {\"anos\": [], \"series\": {}}\n\n    anos_sorted = sorted([int(c) for c in pivot.columns])\n    series = {}\n\n    for nome in pivot.index:\n        series[nome] = [float(pivot.loc[nome, a]) if a in pivot.columns else 0.0 for a in anos_sorted]\n\n    return {\n        \"anos\": anos_sorted,\n        \"series\": series,\n        \"titulo\": f\"Evolu\u00e7\u00e3o {metrica}\",\n    }\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  Helpers internos\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef _get_attr(obj: Any, attr: str, default: Any = \"\") -> Any:\n    \"\"\"Obt\u00e9m atributo de objeto ou dict.\"\"\"\n    if isinstance(obj, dict):\n        return obj.get(attr, default)\n    return getattr(obj, attr, default)\n", "core/calc/fatores.py": "\"\"\"\nResolu\u00e7\u00e3o de fatores de emiss\u00e3o com suporte a ano.\n\nImplementa busca de fator por (consum\u00edvel, escopo, ano) com fallback\nconfigur\u00e1vel para fator global (sem ano).\n\nEstrat\u00e9gia de resolu\u00e7\u00e3o:\n  1. Buscar fator exato: (consumivel, escopo, ano)\n  2. Fallback: fator sem campo \"ano\" (global)\n  3. Se nenhum encontrado: retorna 0.0\n\nO fallback \u00e9 habilitado por padr\u00e3o \u2014 pode ser desabilitado\nvia ``strict=True`` para for\u00e7ar exig\u00eancia de fatores por ano.\n\"\"\"\nfrom __future__ import annotations\n\nimport logging\nfrom typing import Any, Dict, List, Optional, Tuple\n\nlogger = logging.getLogger(__name__)\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  \u00cdndice de fatores (cache por sess\u00e3o)\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nclass FatorIndex:\n    \"\"\"\u00cdndice para busca r\u00e1pida de fatores de emiss\u00e3o.\n\n    Estrutura interna:\n        _idx[(consumivel, escopo, ano)] \u2192 dict do fator\n        _idx[(consumivel, escopo, None)] \u2192 dict do fator (global)\n    \"\"\"\n\n    def __init__(self, fatores: List[Dict[str, Any]]) -> None:\n        self._fatores = fatores\n        self._idx: Dict[Tuple[str, str, Optional[int]], Dict[str, Any]] = {}\n        self._build_index()\n\n    def _build_index(self) -> None:\n        \"\"\"Constr\u00f3i o \u00edndice a partir da lista de fatores.\"\"\"\n        for f in self._fatores:\n            consumivel = str(f.get(\"consumivel\", \"\")).strip().upper()\n            escopo = _normalizar_escopo(str(f.get(\"escopo\", \"\")))\n            ano_raw = f.get(\"ano\", None)\n            ano: Optional[int] = None\n            if ano_raw is not None:\n                try:\n                    ano = int(ano_raw)\n                except (ValueError, TypeError):\n                    pass\n\n            key = (consumivel, escopo, ano)\n            if key not in self._idx:\n                self._idx[key] = f\n            # N\u00e3o sobrescreve se j\u00e1 existe (primeiro encontrado ganha)\n\n    def get_fator(\n        self,\n        consumivel: str,\n        escopo: str,\n        ano: Optional[int] = None,\n        strict: bool = False,\n    ) -> float:\n        \"\"\"Busca o fator de emiss\u00e3o para um consum\u00edvel/escopo/ano.\n\n        Args:\n            consumivel: Nome do consum\u00edvel (case-insensitive).\n            escopo: Escopo GHG (normalizado para \"1\", \"2\" ou \"3\").\n            ano: Ano espec\u00edfico (None para busca global).\n            strict: Se True, n\u00e3o faz fallback para fator global.\n\n        Returns:\n            Valor do fator de emiss\u00e3o, ou 0.0 se n\u00e3o encontrado.\n        \"\"\"\n        cons_upper = consumivel.strip().upper()\n        esc_norm = _normalizar_escopo(escopo)\n\n        # 1. Busca exata com ano\n        if ano is not None:\n            key_exact = (cons_upper, esc_norm, ano)\n            if key_exact in self._idx:\n                return float(self._idx[key_exact].get(\"fator_emissao\", 0.0))\n\n        # 2. Fallback para fator global (sem ano)\n        if not strict:\n            key_global = (cons_upper, esc_norm, None)\n            if key_global in self._idx:\n                fv = float(self._idx[key_global].get(\"fator_emissao\", 0.0))\n                if ano is not None:\n                    logger.debug(\n                        \"Fallback global para %s/%s ano=%d (fator=%.4f)\",\n                        consumivel, escopo, ano, fv,\n                    )\n                return fv\n\n            # 3. Fallback para o ano mais pr\u00f3ximo dispon\u00edvel\n            if ano is not None:\n                best = self._closest_year(cons_upper, esc_norm, ano)\n                if best is not None:\n                    fv = float(best.get(\"fator_emissao\", 0.0))\n                    logger.debug(\n                        \"Fallback ano mais pr\u00f3ximo para %s/%s ano=%d (fator=%.4f)\",\n                        consumivel, escopo, ano, fv,\n                    )\n                    return fv\n\n        return 0.0\n\n    def get_fator_dict(\n        self,\n        consumivel: str,\n        escopo: str,\n        ano: Optional[int] = None,\n        strict: bool = False,\n    ) -> Optional[Dict[str, Any]]:\n        \"\"\"Similar a get_fator mas retorna o dict completo do fator.\"\"\"\n        cons_upper = consumivel.strip().upper()\n        esc_norm = _normalizar_escopo(escopo)\n\n        if ano is not None:\n            key_exact = (cons_upper, esc_norm, ano)\n            if key_exact in self._idx:\n                return self._idx[key_exact]\n\n        if not strict:\n            key_global = (cons_upper, esc_norm, None)\n            if key_global in self._idx:\n                return self._idx[key_global]\n\n            # 3. Fallback para o ano mais pr\u00f3ximo dispon\u00edvel\n            if ano is not None:\n                best = self._closest_year(cons_upper, esc_norm, ano)\n                if best is not None:\n                    return best\n\n        return None\n\n    def _closest_year(\n        self, cons_upper: str, esc_norm: str, ano: int\n    ) -> Optional[Dict[str, Any]]:\n        \"\"\"Retorna o fator do ano mais pr\u00f3ximo (\u2264 ano, sen\u00e3o o menor > ano).\"\"\"\n        candidates: List[Tuple[int, Dict[str, Any]]] = []\n        for (c, e, a), fdict in self._idx.items():\n            if c == cons_upper and e == esc_norm and a is not None:\n                candidates.append((a, fdict))\n        if not candidates:\n            return None\n        # Prefere anos <= alvo (mais recente primeiro); sen\u00e3o o menor > alvo\n        before = [(a, d) for a, d in candidates if a <= ano]\n        if before:\n            before.sort(key=lambda x: x[0], reverse=True)\n            return before[0][1]\n        candidates.sort(key=lambda x: x[0])\n        return candidates[0][1]\n\n    def listar_anos_disponiveis(self, consumivel: str, escopo: str) -> List[int]:\n        \"\"\"Lista anos com fatores espec\u00edficos para um consum\u00edvel/escopo.\"\"\"\n        cons_upper = consumivel.strip().upper()\n        esc_norm = _normalizar_escopo(escopo)\n        anos = []\n        for (c, e, a), _ in self._idx.items():\n            if c == cons_upper and e == esc_norm and a is not None:\n                anos.append(a)\n        return sorted(anos)\n\n    def __len__(self) -> int:\n        return len(self._idx)\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  Fun\u00e7\u00f5es auxiliares\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef _normalizar_escopo(escopo: str) -> str:\n    \"\"\"Normaliza strings de escopo para '1', '2' ou '3'.\n\n    Aceita: \"1\", \"SCOPE 1\", \"Escopo 1\", \"scope1\" etc.\n    \"\"\"\n    s = escopo.strip().upper().replace(\"SCOPE\", \"\").replace(\"ESCOPO\", \"\").strip()\n    if \"1\" in s:\n        return \"1\"\n    elif \"2\" in s:\n        return \"2\"\n    elif \"3\" in s:\n        return \"3\"\n    return s\n\n\ndef resolver_fator_consumivel(\n    consumivel_nome: str,\n    escopo: str,\n    ano: Optional[int],\n    fatores: List[Dict[str, Any]],\n    strict: bool = False,\n) -> float:\n    \"\"\"Fun\u00e7\u00e3o de conveni\u00eancia para resolver fator sem instanciar FatorIndex.\n\n    Para chamadas \u00fanicas. Para m\u00faltiplas resolu\u00e7\u00f5es, use FatorIndex diretamente.\n\n    Args:\n        consumivel_nome: Nome do consum\u00edvel.\n        escopo: Escopo GHG.\n        ano: Ano (ou None para global).\n        fatores: Lista de fatores de emiss\u00e3o.\n        strict: N\u00e3o usar fallback global.\n\n    Returns:\n        Valor do fator.\n    \"\"\"\n    idx = FatorIndex(fatores)\n    return idx.get_fator(consumivel_nome, escopo, ano, strict=strict)\n\n\ndef fatores_para_ano(\n    fatores: List[Dict[str, Any]],\n    ano: int,\n) -> List[Dict[str, Any]]:\n    \"\"\"Filtra/resolve fatores para um ano espec\u00edfico.\n\n    Para cada combina\u00e7\u00e3o (consumivel, escopo):\n      - Se existe fator com ano=<ano>, usa esse.\n      - Sen\u00e3o, usa o fator global (sem ano).\n\n    Args:\n        fatores: Lista completa de fatores.\n        ano: Ano alvo.\n\n    Returns:\n        Lista de fatores resolvidos para o ano (sem duplicatas).\n    \"\"\"\n    idx = FatorIndex(fatores)\n    vistos: set[Tuple[str, str]] = set()\n    resultado: list[Dict[str, Any]] = []\n\n    for f in fatores:\n        cons = str(f.get(\"consumivel\", \"\")).strip().upper()\n        esc = _normalizar_escopo(str(f.get(\"escopo\", \"\")))\n        key = (cons, esc)\n\n        if key in vistos:\n            continue\n        vistos.add(key)\n\n        # Buscar melhor fator para o ano\n        fator_dict = idx.get_fator_dict(cons, esc, ano=ano)\n        if fator_dict is not None:\n            resultado.append(fator_dict)\n\n    return resultado\n", "core/calc/__init__.py": "\"\"\"Motor de c\u00e1lculo de emiss\u00f5es.\"\"\"\n", "core/io/excel_io.py": "\"\"\"\nLeitura/escrita de arquivos Excel \u2014 migra\u00e7\u00e3o e template.\n\nRespons\u00e1vel por:\n- Converter Excel \u2192 JSON DB (migra\u00e7\u00e3o)\n- Gerar template Excel de input\n\"\"\"\nfrom __future__ import annotations\n\nimport logging\nfrom datetime import datetime\nfrom io import BytesIO\nfrom typing import Any, Dict, List, Optional\nfrom core.units import convert_mass, normalize_unit\n\nlogger = logging.getLogger(__name__)\n\ntry:\n    from openpyxl import Workbook\n    from openpyxl.styles import (\n        Alignment, Border, Font, PatternFill, Side,\n    )\n    from openpyxl.utils import get_column_letter\n    from openpyxl.worksheet.datavalidation import DataValidation\n    OPENPYXL_AVAILABLE = True\nexcept ImportError:\n    OPENPYXL_AVAILABLE = False\n\ntry:\n    import pandas as pd\n    PANDAS_AVAILABLE = True\nexcept ImportError:\n    PANDAS_AVAILABLE = False\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  ESTILOS COMUNS\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nif OPENPYXL_AVAILABLE:\n    _HDR_FONT = Font(name=\"Calibri\", bold=True, color=\"FFFFFF\", size=11)\n    _HDR_FILL = PatternFill(start_color=\"4c8061\", end_color=\"4c8061\", fill_type=\"solid\")\n    _OPT_FILL = PatternFill(start_color=\"E8F5E9\", end_color=\"E8F5E9\", fill_type=\"solid\")\n    _REQ_FILL = PatternFill(start_color=\"FFF3E0\", end_color=\"FFF3E0\", fill_type=\"solid\")\n    _THIN_BORDER = Border(\n        left=Side(style=\"thin\", color=\"D0D0D0\"),\n        right=Side(style=\"thin\", color=\"D0D0D0\"),\n        top=Side(style=\"thin\", color=\"D0D0D0\"),\n        bottom=Side(style=\"thin\", color=\"D0D0D0\"),\n    )\n    _CENTER = Alignment(horizontal=\"center\", vertical=\"center\", wrap_text=True)\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  GERA\u00c7\u00c3O DE TEMPLATE EXCEL\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef gerar_template_excel(\n    ano: Optional[int] = None,\n    fatores_emissao: Optional[List[Dict]] = None,\n    massa_unidade: str = \"t\",\n) -> bytes:\n    \"\"\"Gera template Excel em mem\u00f3ria para input de dados.\n\n    Args:\n        ano: Ano padr\u00e3o a incluir.\n        fatores_emissao: Lista de fatores para preencher dropdown.\n\n    Returns:\n        Conte\u00fado do arquivo .xlsx como bytes.\n\n    Raises:\n        ImportError: Se openpyxl n\u00e3o estiver instalado.\n    \"\"\"\n    if not OPENPYXL_AVAILABLE:\n        raise ImportError(\"openpyxl \u00e9 necess\u00e1rio para gerar templates Excel.\")\n\n    wb = Workbook()\n    ano = ano or datetime.now().year\n    massa_unidade = normalize_unit(massa_unidade)\n\n    # \u2500\u2500\u2500 ABA README \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    ws_readme = wb.active\n    ws_readme.title = \"README\"\n    ws_readme.sheet_properties.tabColor = \"4c8061\"\n\n    readme_content = [\n        [\"TEMPLATE DE IMPORTA\u00c7\u00c3O \u2014 Calculadora de Emiss\u00f5es CMP\"],\n        [\"\"],\n        [\"Este arquivo cont\u00e9m as abas necess\u00e1rias para importar dados\"],\n        [\"na Calculadora de Emiss\u00f5es de Carbono - CMP.\"],\n        [\"\"],\n        [\"INSTRU\u00c7\u00d5ES:\"],\n        [\"1. Preencha a aba 'Unidades' com as unidades produtivas da cadeia.\"],\n        [\"2. Preencha a aba 'Conexoes' com os fluxos entre unidades.\"],\n        [\"3. Preencha a aba 'Tecnologias' com tecnologias alternativas (opcional).\"],\n        [\"4. A aba 'Fatores_Emissao' \u00e9 refer\u00eancia; importe-a separadamente se necess\u00e1rio.\"],\n        [\"\"],\n        [\"CAMPOS OBRIGAT\u00d3RIOS est\u00e3o marcados com (*) na linha de cabe\u00e7alho.\"],\n        [\"Campos com fundo laranja claro s\u00e3o obrigat\u00f3rios.\"],\n        [\"Campos com fundo verde claro s\u00e3o opcionais.\"],\n        [\"\"],\n        [\"REGRAS:\"],\n        [\"- ID_ELO deve ser \u00fanico por unidade produtiva.\"],\n        [\"- Periodo deve ser um ano (ex: 2025).\"],\n        [f\"- Massas na unidade: {massa_unidade}.\"],\n        [\"- Consum\u00edveis e ConsumoEspecifico s\u00e3o listas separadas por ';'.\"],\n        [\"  Exemplo Consum\u00edveis: DIESEL S10 (BRASIL);ELETRICIDADE\"],\n        [\"  Exemplo ConsumoEspecifico: 0.5;1.2\"],\n        [\"- Origem e Destino em Conexoes devem corresponder a ID_ELO existentes.\"],\n        [\"\"],\n        [f\"Ano padr\u00e3o: {ano}\"],\n        [f\"Gerado em: {datetime.now().strftime('%d/%m/%Y %H:%M')}\"],\n        [\"Vers\u00e3o do template: 1.0\"],\n    ]\n\n    for i, row in enumerate(readme_content):\n        cell = ws_readme.cell(row=i + 1, column=1, value=row[0] if row else \"\")\n        if i == 0:\n            cell.font = Font(name=\"Calibri\", bold=True, size=14, color=\"4c8061\")\n        elif row and row[0].startswith(\"INSTRU\u00c7\u00d5ES\") or (row and row[0].startswith(\"REGRAS\")):\n            cell.font = Font(name=\"Calibri\", bold=True, size=12, color=\"333333\")\n\n    ws_readme.column_dimensions[\"A\"].width = 80\n\n    # \u2500\u2500\u2500 ABA UNIDADES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    ws_u = wb.create_sheet(\"Unidades\")\n    ws_u.sheet_properties.tabColor = \"0066CC\"\n\n    unidades_headers = [\n        (\"ID_ELO *\", True),\n        (\"Nome *\", True),\n        (\"Localizacao *\", True),\n        (\"Periodo *\", True),\n        (\"Input\", False),\n        (f\"MassaInput ({massa_unidade}) *\", True),\n        (\"Output\", False),\n        (f\"MassaOutput ({massa_unidade}) *\", True),\n        (\"Unidade_Massa\", False),\n        (\"Consumiveis\", False),\n        (\"ConsumoEspecifico\", False),\n        (\"TaxacaoFronteira\", False),\n        (\"TaxacaoLocal\", False),\n        (\"Tecnologia\", False),\n    ]\n    _write_headers(ws_u, unidades_headers)\n\n    # Exemplo de dados\n    exemplo_unidade = [\n        \"U001\", \"Mina de Ferro\", \"Minas Gerais\", str(ano),\n        \"Min\u00e9rio ROM\", 1000.0, \"Concentrado Fe\", 500.0, massa_unidade,\n        \"DIESEL S10 (BRASIL);ELETRICIDADE\", \"0.5;1.2\",\n        \"FALSE\", \"FALSE\", \"\",\n    ]\n    _write_example_row(ws_u, 3, exemplo_unidade)\n    _auto_width(ws_u)\n\n    # Valida\u00e7\u00e3o para TaxacaoFronteira e TaxacaoLocal\n    dv_bool = DataValidation(type=\"list\", formula1='\"TRUE,FALSE\"', allow_blank=True)\n    dv_bool.error = \"Valor deve ser TRUE ou FALSE\"\n    dv_bool.errorTitle = \"Valor inv\u00e1lido\"\n    ws_u.add_data_validation(dv_bool)\n    dv_bool.add(f\"K2:L1000\")\n\n    # \u2500\u2500\u2500 ABA CONEX\u00d5ES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    ws_c = wb.create_sheet(\"Conexoes\")\n    ws_c.sheet_properties.tabColor = \"CC6600\"\n\n    conexoes_headers = [\n        (\"Origem (ID_ELO) *\", True),\n        (\"Destino (ID_ELO) *\", True),\n        (f\"Massa ({massa_unidade})\", False),\n        (\"Unidade_Massa\", False),\n        (\"Label\", False),\n        (\"Periodo *\", True),\n    ]\n    _write_headers(ws_c, conexoes_headers)\n\n    exemplo_conexao = [\"U001\", \"U002\", 500.0, massa_unidade, \"Fluxo Concentrado\", \"2025\"]\n    _write_example_row(ws_c, 3, exemplo_conexao)\n    _auto_width(ws_c)\n\n    # \u2500\u2500\u2500 ABA TECNOLOGIAS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    ws_t = wb.create_sheet(\"Tecnologias\")\n    ws_t.sheet_properties.tabColor = \"7C3AED\"\n\n    tec_headers = [\n        (\"ID *\", True),\n        (\"Nome *\", True),\n        (\"Insumos (nome1;nome2;...)\", True),\n        (\"Fator_Consumo (fc1;fc2;...)\", True),\n    ]\n    _write_headers(ws_t, tec_headers)\n\n    exemplo_tec = [\"TEC001\", \"Processo Convencional\", \"DIESEL S10 (BRASIL);ELETRICIDADE\", \"0.5;1.2\"]\n    _write_example_row(ws_t, 3, exemplo_tec)\n    _auto_width(ws_t)\n\n    # \u2500\u2500\u2500 ABA FATORES DE EMISS\u00c3O (refer\u00eancia) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    ws_f = wb.create_sheet(\"Fatores_Emissao\")\n    ws_f.sheet_properties.tabColor = \"059669\"\n\n    fatores_headers = [\n        (\"Grupo_Consumivel *\", True),\n        (\"Consumivel *\", True),\n        (\"Escopo *\", True),\n        (\"Ano\", False),\n        (\"Fator_Emissao *\", True),\n        (\"kgCO2e_Unid *\", True),\n    ]\n    _write_headers(ws_f, fatores_headers)\n\n    # Preencher com fatores existentes se dispon\u00edveis\n    if fatores_emissao:\n        for i, f in enumerate(fatores_emissao[:200]):  # Limitar a 200 linhas\n            row = i + 2\n            ws_f.cell(row=row, column=1, value=f.get(\"grupo_consumivel\", \"\"))\n            ws_f.cell(row=row, column=2, value=f.get(\"consumivel\", \"\"))\n            ws_f.cell(row=row, column=3, value=f.get(\"escopo\", \"\"))\n            ws_f.cell(row=row, column=4, value=f.get(\"ano\", \"\"))\n            ws_f.cell(row=row, column=5, value=f.get(\"fator_emissao\", 0.0))\n            ws_f.cell(row=row, column=6, value=f.get(\"kgCO2e_unid\", \"\"))\n            for col in range(1, 7):\n                ws_f.cell(row=row, column=col).border = _THIN_BORDER\n    else:\n        exemplo_fator = [\"LAND TRANSPORTATION\", \"DIESEL S10 (BRASIL)\", \"SCOPE 1\", str(ano), 2.35, \"L\"]\n        _write_example_row(ws_f, 3, exemplo_fator)\n\n    # Valida\u00e7\u00e3o de escopo\n    dv_escopo = DataValidation(\n        type=\"list\",\n        formula1='\"SCOPE 1,SCOPE 2,SCOPE 3\"',\n        allow_blank=True,\n    )\n    ws_f.add_data_validation(dv_escopo)\n    dv_escopo.add(f\"C2:C1000\")\n\n    _auto_width(ws_f)\n\n    # \u2500\u2500\u2500 SALVAR \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    buf = BytesIO()\n    wb.save(buf)\n    buf.seek(0)\n    return buf.getvalue()\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  EXPORTA\u00c7\u00c3O DE SESS\u00c3O PARA EXCEL (dados preenchidos)\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef exportar_sessao_excel(\n    unidades: List[Dict],\n    conexoes: List[Dict],\n    tecnologias: Optional[List[Dict]] = None,\n    fatores_emissao: Optional[List[Dict]] = None,\n    ano: Optional[int] = None,\n    massa_unidade: str = \"t\",\n) -> bytes:\n    \"\"\"Gera um arquivo Excel preenchido com os dados da sess\u00e3o.\n\n    Args:\n        unidades: Lista de dicts (ou objetos com to_dict) das unidades.\n        conexoes: Lista de dicts (ou objetos com to_dict) das conex\u00f5es.\n        tecnologias: Lista de dicts de tecnologias alternativas.\n        fatores_emissao: Lista de dicts de fatores de emiss\u00e3o.\n        ano: Ano de refer\u00eancia.\n\n    Returns:\n        Conte\u00fado do arquivo .xlsx como bytes.\n    \"\"\"\n    if not OPENPYXL_AVAILABLE:\n        raise ImportError(\"openpyxl \u00e9 necess\u00e1rio para exportar sess\u00e3o em Excel.\")\n\n    wb = Workbook()\n    ano = ano or datetime.now().year\n    massa_unidade = normalize_unit(massa_unidade)\n\n    _DATA_FONT = Font(name=\"Calibri\", size=10)\n\n    # \u2500\u2500\u2500 ABA README \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    ws_readme = wb.active\n    ws_readme.title = \"README\"\n    ws_readme.sheet_properties.tabColor = \"4c8061\"\n    readme_lines = [\n        [\"EXPORTA\u00c7\u00c3O DE SESS\u00c3O \u2014 Calculadora de Emiss\u00f5es CMP\"],\n        [\"\"],\n        [f\"Ano de refer\u00eancia: {ano}\"],\n        [f\"Exportado em: {datetime.now().strftime('%d/%m/%Y %H:%M')}\"],\n        [\"\"],\n        [\"Abas: Unidades, Conexoes, Tecnologias, Fatores_Emissao\"],\n        [\"Este arquivo pode ser reimportado na aplica\u00e7\u00e3o.\"],\n    ]\n    for i, row in enumerate(readme_lines):\n        cell = ws_readme.cell(row=i + 1, column=1, value=row[0] if row else \"\")\n        if i == 0:\n            cell.font = Font(name=\"Calibri\", bold=True, size=14, color=\"4c8061\")\n    ws_readme.column_dimensions[\"A\"].width = 70\n\n    # \u2500\u2500\u2500 ABA UNIDADES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    ws_u = wb.create_sheet(\"Unidades\")\n    ws_u.sheet_properties.tabColor = \"0066CC\"\n    unidades_headers = [\n        (\"ID_ELO *\", True),\n        (\"Nome *\", True),\n        (\"Localizacao *\", True),\n        (\"Periodo *\", True),\n        (\"Input\", False),\n        (f\"MassaInput ({massa_unidade}) *\", True),\n        (\"Output\", False),\n        (f\"MassaOutput ({massa_unidade}) *\", True),\n        (\"Unidade_Massa\", False),\n        (\"Consumiveis\", False),\n        (\"ConsumoEspecifico\", False),\n        (\"TaxacaoFronteira\", False),\n        (\"TaxacaoLocal\", False),\n        (\"Tecnologia\", False),\n    ]\n    _write_headers(ws_u, unidades_headers)\n\n    for i, u in enumerate(unidades):\n        d = u.to_dict() if hasattr(u, \"to_dict\") else (u if isinstance(u, dict) else vars(u))\n        row = i + 3  # row 1=header, row 2=hints\n\n        # Consum\u00edveis: lista de dicts \u2192 \"nome1;nome2\"\n        consumiveis_raw = d.get(\"Consumiveis\") or d.get(\"consumiveis\") or []\n        if isinstance(consumiveis_raw, list):\n            cons_nomes = \";\".join(\n                c[\"nome\"] if isinstance(c, dict) else str(c) for c in consumiveis_raw\n            )\n        else:\n            cons_nomes = str(consumiveis_raw)\n\n        # ConsumoEspecifico: lista de floats \u2192 \"0.5;1.2\"\n        ce_raw = d.get(\"ConsumoEspecifico\") or d.get(\"consumo_especifico\") or []\n        if isinstance(ce_raw, list):\n            cons_esp = \";\".join(str(v) for v in ce_raw)\n        else:\n            cons_esp = str(ce_raw)\n\n        # Tecnologia: pode ser obj, id ou None\n        tec_val = d.get(\"Tecnologia\") or d.get(\"tecnologia\") or \"\"\n        if isinstance(tec_val, dict):\n            tec_val = tec_val.get(\"id\", \"\")\n\n        values = [\n            d.get(\"ID_ELO\") or d.get(\"id_elo\", \"\"),\n            d.get(\"Nome\") or d.get(\"nome\", \"\"),\n            d.get(\"Localizacao\") or d.get(\"localizacao\", \"\"),\n            d.get(\"Periodo\") or d.get(\"periodo\", str(ano)),\n            d.get(\"Input\") or d.get(\"input\", \"\"),\n            convert_mass(d.get(\"MassaInput\") or d.get(\"massa_input\", 0), \"t\", massa_unidade),\n            d.get(\"Output\") or d.get(\"output\", \"\"),\n            convert_mass(d.get(\"MassaOutput\") or d.get(\"massa_output\", 0), \"t\", massa_unidade),\n            massa_unidade,\n            cons_nomes,\n            cons_esp,\n            str(d.get(\"TaxacaoFronteira\", d.get(\"taxacao_fronteira\", False))).upper(),\n            str(d.get(\"TaxacaoLocal\", d.get(\"taxacao_local\", False))).upper(),\n            tec_val,\n        ]\n        for col_idx, val in enumerate(values, 1):\n            cell = ws_u.cell(row=row, column=col_idx, value=val)\n            cell.font = _DATA_FONT\n            cell.border = _THIN_BORDER\n    _auto_width(ws_u)\n\n    # \u2500\u2500\u2500 ABA CONEX\u00d5ES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    ws_c = wb.create_sheet(\"Conexoes\")\n    ws_c.sheet_properties.tabColor = \"CC6600\"\n    conexoes_headers = [\n        (\"Origem (ID_ELO) *\", True),\n        (\"Destino (ID_ELO) *\", True),\n        (f\"Massa ({massa_unidade})\", False),\n        (\"Unidade_Massa\", False),\n        (\"Label\", False),\n        (\"Periodo *\", True),\n    ]\n    _write_headers(ws_c, conexoes_headers)\n\n    for i, c in enumerate(conexoes):\n        d = c.to_dict() if hasattr(c, \"to_dict\") else (c if isinstance(c, dict) else vars(c))\n        row = i + 3\n        values = [\n            d.get(\"origem\", \"\"),\n            d.get(\"destino\", \"\"),\n            convert_mass(d.get(\"massa\", 0), \"t\", massa_unidade),\n            massa_unidade,\n            d.get(\"label\", \"Fluxo\"),\n            d.get(\"periodo\", \"\"),\n        ]\n        for col_idx, val in enumerate(values, 1):\n            cell = ws_c.cell(row=row, column=col_idx, value=val)\n            cell.font = _DATA_FONT\n            cell.border = _THIN_BORDER\n    _auto_width(ws_c)\n\n    # \u2500\u2500\u2500 ABA TECNOLOGIAS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    ws_t = wb.create_sheet(\"Tecnologias\")\n    ws_t.sheet_properties.tabColor = \"7C3AED\"\n    tec_headers = [\n        (\"ID *\", True),\n        (\"Nome *\", True),\n        (\"Insumos (nome1;nome2;...)\", True),\n        (\"Fator_Consumo (fc1;fc2;...)\", True),\n    ]\n    _write_headers(ws_t, tec_headers)\n\n    for i, t in enumerate(tecnologias or []):\n        d = t.to_dict() if hasattr(t, \"to_dict\") else (t if isinstance(t, dict) else vars(t))\n        row = i + 3\n        insumos = d.get(\"insumos\", [])\n        nomes_ins = \";\".join(ins.get(\"nome\", \"\") if isinstance(ins, dict) else str(ins) for ins in insumos)\n        fcs_ins = \";\".join(str(ins.get(\"fator_consumo\", 1.0)) if isinstance(ins, dict) else \"1.0\" for ins in insumos)\n        values = [\n            d.get(\"id\", \"\"),\n            d.get(\"nome\", \"\"),\n            nomes_ins,\n            fcs_ins,\n        ]\n        for col_idx, val in enumerate(values, 1):\n            cell = ws_t.cell(row=row, column=col_idx, value=val)\n            cell.font = _DATA_FONT\n            cell.border = _THIN_BORDER\n    _auto_width(ws_t)\n\n    # \u2500\u2500\u2500 ABA FATORES DE EMISS\u00c3O \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    ws_f = wb.create_sheet(\"Fatores_Emissao\")\n    ws_f.sheet_properties.tabColor = \"059669\"\n    fatores_headers = [\n        (\"Grupo_Consumivel *\", True),\n        (\"Consumivel *\", True),\n        (\"Escopo *\", True),\n        (\"Ano\", False),\n        (\"Fator_Emissao *\", True),\n        (\"kgCO2e_Unid *\", True),\n    ]\n    _write_headers(ws_f, fatores_headers)\n\n    for i, f in enumerate(fatores_emissao or []):\n        row = i + 3\n        values = [\n            f.get(\"grupo_consumivel\", \"\"),\n            f.get(\"consumivel\", \"\"),\n            f.get(\"escopo\", \"\"),\n            f.get(\"ano\", \"\"),\n            f.get(\"fator_emissao\", 0.0),\n            f.get(\"kgCO2e_unid\", \"\"),\n        ]\n        for col_idx, val in enumerate(values, 1):\n            cell = ws_f.cell(row=row, column=col_idx, value=val)\n            cell.font = _DATA_FONT\n            cell.border = _THIN_BORDER\n    _auto_width(ws_f)\n\n    # \u2500\u2500\u2500 SALVAR \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    buf = BytesIO()\n    wb.save(buf)\n    buf.seek(0)\n    return buf.getvalue()\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  MIGRA\u00c7\u00c3O EXCEL \u2192 JSON\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef excel_to_json_db(filepath_or_bytes: Any) -> Dict[str, Any]:\n    \"\"\"Converte um arquivo Excel (template) para o formato JSON DB.\n\n    Args:\n        filepath_or_bytes: Caminho do arquivo ou bytes/BytesIO.\n\n    Returns:\n        Dict no formato do schema do banco de dados.\n    \"\"\"\n    if not PANDAS_AVAILABLE:\n        raise ImportError(\"pandas \u00e9 necess\u00e1rio para migra\u00e7\u00e3o Excel \u2192 JSON.\")\n\n    from core.validation.schema import SCHEMA_VERSION\n\n    sheets = pd.read_excel(filepath_or_bytes, sheet_name=None, engine=\"calamine\")\n\n    result: Dict[str, Any] = {\n        \"schema_version\": SCHEMA_VERSION,\n        \"created_at\": datetime.now().isoformat(),\n        \"updated_at\": datetime.now().isoformat(),\n        \"source\": \"excel_import\",\n        \"anos_disponiveis\": [],\n        \"fatores_emissao\": [],\n        \"unidades\": [],\n        \"conexoes\": [],\n        \"tecnologias\": [],\n    }\n\n    # Processar aba Fatores_Emissao\n    if \"Fatores_Emissao\" in sheets:\n        df = sheets[\"Fatores_Emissao\"].dropna(how=\"all\")\n        # Normalizar nomes das colunas (remover * e espa\u00e7os)\n        df.columns = [c.replace(\" *\", \"\").replace(\"*\", \"\").strip() for c in df.columns]\n        col_map = {\n            \"Grupo_Consumivel\": \"grupo_consumivel\",\n            \"Consumivel\": \"consumivel\",\n            \"Escopo\": \"escopo\",\n            \"Ano\": \"ano\",\n            \"Fator_Emissao\": \"fator_emissao\",\n            \"kgCO2e_Unid\": \"kgCO2e_unid\",\n        }\n        df = df.rename(columns={k: v for k, v in col_map.items() if k in df.columns})\n        # Remover linhas com cabe\u00e7alho duplicado ou exemplo na row 2\n        if \"grupo_consumivel\" in df.columns:\n            df = df[df[\"grupo_consumivel\"].notna()]\n            df = df[~df[\"grupo_consumivel\"].astype(str).str.strip().apply(_is_template_hint)]\n        fatores_records = df.to_dict(orient=\"records\")\n        for rec in fatores_records:\n            ano_val = rec.get(\"ano\", None)\n            if pd.isna(ano_val) or _is_template_hint(ano_val):\n                rec.pop(\"ano\", None)\n            else:\n                try:\n                    rec[\"ano\"] = int(float(ano_val))\n                except (ValueError, TypeError):\n                    rec.pop(\"ano\", None)\n        result[\"fatores_emissao\"] = fatores_records\n\n    # Processar aba Unidades\n    anos_encontrados = set()\n    if \"Unidades\" in sheets:\n        df = sheets[\"Unidades\"]\n        # Normalizar nomes das colunas (remover * e espa\u00e7os)\n        df.columns = [c.replace(\" *\", \"\").replace(\"*\", \"\").strip() for c in df.columns]\n        # Remover linhas totalmente vazias e sem ID_ELO\n        df = df.dropna(how=\"all\")\n        if \"ID_ELO\" in df.columns:\n            df = df[df[\"ID_ELO\"].notna()]\n            df = df[~df[\"ID_ELO\"].astype(str).str.strip().apply(_is_template_hint)]\n        col_map = {\n            \"ID_ELO\": \"ID_ELO\",\n            \"Nome\": \"Nome\",\n            \"Localizacao\": \"Localizacao\",\n            \"Periodo\": \"Periodo\",\n            \"Input\": \"Input\",\n            \"MassaInput\": \"MassaInput\",\n            \"Output\": \"Output\",\n            \"MassaOutput\": \"MassaOutput\",\n            \"Unidade_Massa\": \"Unidade_Massa\",\n            \"TaxacaoFronteira\": \"Taxaca
