u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    def _render_export_modal(self):\n        @st.dialog(\"Exportar Sess\u00e3o de Trabalho\", width=\"large\")\n        def export_dialog():\n            sessao_data = self._exportar_sessao()\n\n            st.markdown(\"\"\"\n            <style>\n            .export-info { background:#f8f9fa; padding:1.5rem; border-radius:12px;\n                           margin-bottom:1.5rem; border-left:4px solid #4c8061; }\n            .export-label { font-weight:600; color:#4c8061; margin-bottom:0.3rem; }\n            .export-value { font-size:1.1rem; color:#333; margin-bottom:1rem; }\n            .stat-box { background:white; padding:1rem; border-radius:8px;\n                        border:1px solid #e0e0e0; text-align:center; margin-bottom:0.5rem; }\n            .stat-number { font-size:2rem; font-weight:700; color:#4c8061; }\n            .stat-label  { font-size:0.9rem; color:#666; margin-top:0.3rem; }\n            </style>\n            \"\"\", unsafe_allow_html=True)\n\n            st.markdown(f\"\"\"\n            <div class=\"export-info\">\n                <div class=\"export-label\">Usu\u00e1rio</div>\n                <div class=\"export-value\">\ud83d\udc64 {sessao_data['usuario']}</div>\n                <div class=\"export-label\">Data e Hora</div>\n                <div class=\"export-value\">\ud83d\udcc5 {sessao_data['data_exportacao']}</div>\n            </div>\n            \"\"\", unsafe_allow_html=True)\n\n            st.markdown(\"#### \ud83d\udcca Conte\u00fado da Sess\u00e3o\")\n            c1, c2 = st.columns(2)\n            with c1:\n                st.markdown(f'<div class=\"stat-box\"><div class=\"stat-number\">{len(sessao_data.get(\"unidades\",[]))}</div><div class=\"stat-label\">Unidades produtivas</div></div>', unsafe_allow_html=True)\n                st.markdown(f'<div class=\"stat-box\"><div class=\"stat-number\">{len(sessao_data.get(\"fatores_emissao\",[]))}</div><div class=\"stat-label\">Fatores de Emiss\u00e3o</div></div>', unsafe_allow_html=True)\n            with c2:\n                st.markdown(f'<div class=\"stat-box\"><div class=\"stat-number\">{len(sessao_data.get(\"conexoes\",[]))}</div><div class=\"stat-label\">Conex\u00f5es de Fluxo</div></div>', unsafe_allow_html=True)\n                st.markdown(f'<div class=\"stat-box\"><div class=\"stat-number\">{len(sessao_data.get(\"tecnologias_alternativas\",[]))}</div><div class=\"stat-label\">Tecnologias Alternativas</div></div>', unsafe_allow_html=True)\n\n            st.markdown(\"<br>\", unsafe_allow_html=True)\n\n            timestamp = datetime.now().strftime(\"%Y%m%d_%H%M%S\")\n            nome_arquivo = f\"sessao_{st.session_state.usuario_logado}_{timestamp}.json\"\n\n            c1, c2 = st.columns([3, 1])\n            with c1:\n                st.download_button(\n                    label=\"\ud83d\udcbe Confirmar e Baixar Sess\u00e3o\",\n                    data=json.dumps(sessao_data, indent=2, ensure_ascii=False),\n                    file_name=nome_arquivo,\n                    mime=\"application/json\",\n                    use_container_width=True,\n                    type=\"primary\",\n                )\n            with c2:\n                if st.button(\"Cancelar\", use_container_width=True, key=\"cancel_export\"):\n                    st.session_state.show_export_modal = False\n                    st.rerun()\n\n            st.info(\"\ud83d\udca1 O arquivo ser\u00e1 salvo no formato JSON e pode ser importado posteriormente.\")\n\n        export_dialog()\n\n    def _render_import_modal(self):\n        @st.dialog(\"Importar Sess\u00e3o de Trabalho\", width=\"large\")\n        def import_dialog():\n            st.markdown(\"\"\"\n            <div style=\"background:#f8f9fa;padding:1.5rem;border-radius:12px;\n                        margin-bottom:1.5rem;border-left:4px solid #4c8061;\n                        font-family:'Poppins',sans-serif;color:#666;line-height:1.6;\">\n                \ud83d\udcc2 Selecione um arquivo de sess\u00e3o exportado anteriormente para restaurar\n                todas as unidades produtivas, conex\u00f5es, fatores de emiss\u00e3o e tecnologias.\n            </div>\n            \"\"\", unsafe_allow_html=True)\n\n            uploaded_file = st.file_uploader(\n                \"Arquivo de Sess\u00e3o (.json)\", type=[\"json\"],\n                key=\"upload_sessao_modal\",\n                help=\"Escolha um arquivo .json exportado pela plataforma\",\n            )\n\n            if uploaded_file:\n                try:\n                    sessao_data = json.load(uploaded_file)\n                    if \"usuario\" in sessao_data and \"data_exportacao\" in sessao_data:\n                        st.success(\"\u2705 Arquivo de sess\u00e3o v\u00e1lido!\")\n\n                        st.markdown(\"#### \ud83d\udccb Informa\u00e7\u00f5es da Sess\u00e3o\")\n                        st.markdown(f\"\"\"\n                        <div style=\"background:#f8f9fa;padding:1.5rem;border-radius:12px;\n                                    border-left:4px solid #4c8061;margin-bottom:1rem;\">\n                            <strong style=\"color:#4c8061;\">Usu\u00e1rio Original:</strong> {sessao_data.get('usuario','Desconhecido')}<br>\n                            <strong style=\"color:#4c8061;\">Data de Exporta\u00e7\u00e3o:</strong> {sessao_data.get('data_exportacao','Desconhecida')}\n                        </div>\n                        \"\"\", unsafe_allow_html=True)\n\n                        st.warning(\"\u26a0\ufe0f Esta a\u00e7\u00e3o substituir\u00e1 todos os dados atuais.\")\n\n                        # \u2500\u2500 Valida\u00e7\u00e3o relacional do JSON importado \u2500\u2500\n                        _val_data = {\n                            \"unidades\": sessao_data.get(\"unidades\", []),\n                            \"conexoes\": sessao_data.get(\"conexoes\", []),\n                            \"tecnologias\": [\n                                t if isinstance(t, dict) else t.to_dict()\n                                for t in sessao_data.get(\"tecnologias_alternativas\", [])\n                            ],\n                            \"fatores_emissao\": sessao_data.get(\"fatores_emissao\", []),\n                        }\n                        _rel_rpt = validar_integridade_relacional(_val_data)\n                        _md = formatar_relatorio_markdown(_rel_rpt)\n                        with st.expander(\n                            \"\ud83d\udccb Valida\u00e7\u00e3o Relacional\"\n                            + (\" \u2705\" if _rel_rpt.is_valid else \" \u274c\"),\n                            expanded=not _rel_rpt.is_valid,\n                        ):\n                            st.markdown(_md)\n\n                        if not _rel_rpt.is_valid:\n                            st.error(\n                                f\"Importa\u00e7\u00e3o bloqueada: {len(_rel_rpt.errors)} erro(s) \"\n                                f\"de integridade. Corrija o arquivo e tente novamente.\"\n                            )\n                        else:\n                            c1, c2 = st.columns([3, 1])\n                            with c1:\n                                if st.button(\"\ud83d\udd04 Confirmar e Restaurar\", use_container_width=True, type=\"primary\"):\n                                    with st.spinner(\"Importando sess\u00e3o...\"):\n                                        try:\n                                            self._importar_sessao(sessao_data)\n                                            st.session_state.show_import_modal = False\n                                            st.success(\"\u2705 Sess\u00e3o restaurada com sucesso!\")\n                                            st.balloons()\n                                            st.rerun()\n                                        except Exception as e:\n                                            st.error(f\"\u274c Erro ao importar: {e}\")\n                            with c2:\n                                if st.button(\"Cancelar\", use_container_width=True, key=\"cancel_import\"):\n                                    st.session_state.show_import_modal = False\n                                    st.rerun()\n                    else:\n                        st.error(\"\u274c Arquivo inv\u00e1lido.\")\n                except json.JSONDecodeError:\n                    st.error(\"\u274c Arquivo JSON inv\u00e1lido.\")\n                except Exception as e:\n                    st.error(f\"\u274c Erro: {e}\")\n            else:\n                st.info(\"\ud83d\udcc2 Aguardando sele\u00e7\u00e3o do arquivo...\")\n                if st.button(\"Cancelar\", use_container_width=True, key=\"cancel_import_wait\"):\n                    st.session_state.show_import_modal = False\n                    st.rerun()\n\n        import_dialog()\n\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    #  M\u00e9todos de dados (migrados de Home.py, sem altera\u00e7\u00e3o l\u00f3gica)\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    def _exportar_sessao(self) -> Dict:\n        ctx = AppContext.get()\n        unidades = st.session_state.get(\"unidades\", [])\n        unidades_dict = [u.to_dict() if hasattr(u, 'to_dict') else u for u in unidades]\n\n        conexoes = st.session_state.get(\"conexoes\", [])\n        conexoes_dict = [c.to_dict() if hasattr(c, 'to_dict') else c for c in conexoes]\n\n        tecnologias = st.session_state.get(\"tecnologias_alternativas\", [])\n        tecnologias_dict = [t.to_dict() if hasattr(t, 'to_dict') else t for t in tecnologias]\n\n        return {\n            \"usuario\": st.session_state.usuario_logado,\n            \"data_exportacao\": datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\"),\n            \"ano_ativo\": ctx.ano_ativo,\n            \"anos_selecionados\": list(ctx.anos_selecionados),\n            \"modo_comparacao\": bool(ctx.modo_comparacao),\n            \"ui_theme_mode\": st.session_state.get(\"ui_theme_mode\", \"light\"),\n            \"mass_unit\": normalize_unit(st.session_state.get(\"mass_unit\", \"t\")),\n            \"auto_save_session\": bool(st.session_state.get(\"auto_save_session\", False)),\n            \"auto_save_interval\": int(st.session_state.get(\"auto_save_interval\", 20)),\n            \"pref_show_save_toast\": bool(st.session_state.get(\"pref_show_save_toast\", True)),\n            \"pref_show_integrity_alerts\": bool(st.session_state.get(\"pref_show_integrity_alerts\", True)),\n            \"unidades\": unidades_dict,\n            \"conexoes\": conexoes_dict,\n            \"edges\": st.session_state.get(\"edges\", []),\n            \"fatores_emissao\": st.session_state.get(\"fatores_emissao\", []),\n            \"tecnologias_alternativas\": tecnologias_dict,\n            \"node_counter\": st.session_state.get(\"node_counter\", 1),\n            \"openrouter_api_key\": st.session_state.get(\"openrouter_api_key\", \"\"),\n        }\n\n    def _importar_sessao(self, sessao_data: Dict):\n        try:\n            tecnologias_dict = sessao_data.get(\"tecnologias_alternativas\", [])\n            tecnologias = []\n            tecnologias_map = {}\n            for t_dict in tecnologias_dict:\n                tecnologia = Tecnologia.from_dict(t_dict)\n                tecnologias.append(tecnologia)\n                tecnologias_map[tecnologia.id] = tecnologia\n\n            conexoes_dict = sessao_data.get(\"conexoes\", [])\n            conexoes = []\n            for c_dict in conexoes_dict:\n                conexao = Conexao(\n                    id=c_dict.get(\"id\", \"\"),\n                    origem=c_dict.get(\"origem\"),\n                    destino=c_dict.get(\"destino\"),\n                    massa=c_dict.get(\"massa\", 0.0),\n                    label=c_dict.get(\"label\", \"Fluxo\"),\n                    periodo=c_dict.get(\"periodo\", \"\"),\n                )\n                conexoes.append(conexao)\n\n            # Definir fatores ANTES do loop de unidades para que calcular_emissoes\n            # possa fazer lookup ao vivo mesmo durante a primeira restaura\u00e7\u00e3o.\n            fatores_emissao = sessao_data.get(\"fatores_emissao\", [])\n            st.session_state.fatores_emissao = fatores_emissao\n\n            unidades_dict = sessao_data.get(\"unidades\", [])\n            unidades = []\n            for u_dict in unidades_dict:\n                conexao = None\n                if u_dict.get(\"Conexao\"):\n                    cd = u_dict[\"Conexao\"]\n                    conexao = Conexao(\n                        id=cd.get(\"id\", \"\"),\n                        origem=cd.get(\"origem\"), destino=cd.get(\"destino\"),\n                        massa=cd.get(\"massa\", 0.0), label=cd.get(\"label\", \"Fluxo\"),\n                        periodo=cd.get(\"periodo\", \"\"),\n                    )\n\n                tecnologia_valor = u_dict.get(\"Tecnologia\")\n                tecnologia_obj = None\n                if tecnologia_valor:\n                    if isinstance(tecnologia_valor, str):\n                        tecnologia_obj = tecnologias_map.get(tecnologia_valor)\n                    else:\n                        tecnologia_obj = Tecnologia.from_dict(tecnologia_valor)\n\n                # \u2500\u2500 Re-construir Consumiveis a partir da tecnologia \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n                # Garante que nomes de consum\u00edveis e fatores reflitam o banco atual,\n                # corrigindo sess\u00f5es salvas com dados desatualizados.\n                from database import _rebuild_consumiveis_from_tech, _parse_ano_periodo_db\n                ano_ref_u = _parse_ano_periodo_db(u_dict.get(\"Periodo\"))\n                if tecnologia_obj and getattr(tecnologia_obj, \"insumos\", None):\n                    consumiveis_u, consumo_especifico_u = _rebuild_consumiveis_from_tech(\n                        tecnologia_obj, fatores_emissao, ano_ref_u\n                    )\n                    # Preserva ConsumoEspecifico salvo (o usu\u00e1rio pode t\u00ea-lo ajustado)\n                    ce_saved = u_dict.get(\"ConsumoEspecifico\", [])\n                    if len(ce_saved) == len(consumiveis_u):\n                        consumo_especifico_u = ce_saved\n                else:\n                    consumiveis_u = u_dict.get(\"Consumiveis\", [])\n                    consumo_especifico_u = u_dict.get(\"ConsumoEspecifico\", [])\n\n                inputs_u = UnidadeProdutiva._normalize_io_list(\n                    u_dict.get(\"inputs\", u_dict.get(\"Inputs\", []))\n                )\n                outputs_u = UnidadeProdutiva._normalize_io_list(\n                    u_dict.get(\"outputs\", u_dict.get(\"Outputs\", []))\n                )\n                if not inputs_u:\n                    inputs_u = UnidadeProdutiva._normalize_io_list([\n                        {\n                            \"produto_id\": u_dict.get(\"Input\", \"\"),\n                            \"quantidade\": u_dict.get(\"MassaInput\", 0.0),\n                            \"unidade\": \"t\",\n                        }\n                    ])\n                if not outputs_u:\n                    outputs_u = UnidadeProdutiva._normalize_io_list([\n                        {\n                            \"produto_id\": u_dict.get(\"Output\", \"\"),\n                            \"quantidade\": u_dict.get(\"MassaOutput\", 0.0),\n                            \"unidade\": \"t\",\n                        }\n                    ])\n\n                unidade = UnidadeProdutiva(\n                    id_elo=u_dict[\"ID_ELO\"], nome=u_dict[\"Nome\"],\n                    localizacao=u_dict[\"Localizacao\"], periodo=u_dict[\"Periodo\"],\n                    input_insumo=u_dict.get(\"Input\", \"\"), massa_input=u_dict.get(\"MassaInput\", 0.0),\n                    output_insumo=u_dict.get(\"Output\", \"\"), massa_output=u_dict.get(\"MassaOutput\", 0.0),\n                    consumiveis=consumiveis_u,\n                    consumo_especifico=consumo_especifico_u,\n                    inputs=inputs_u,\n                    outputs=outputs_u,\n                    taxacao_fronteira=u_dict.get(\"TaxacaoFronteira\", False),\n                    taxacao_local=u_dict.get(\"TaxacaoLocal\", False),\n                    tecnologia=tecnologia_obj, conexao=conexao,\n                )\n                unidade.ConfigOperacional = u_dict.get(\"ConfigOperacional\", \"Padr\u00e3o\")\n\n                # Recalcula emiss\u00f5es com consum\u00edveis e fatores atualizados\n                EmissionCalculator.calcular_emissoes(unidade)\n\n                unidades.append(unidade)\n\n            st.session_state.unidades = unidades\n            st.session_state.conexoes = conexoes\n            st.session_state.edges = sessao_data.get(\"edges\", [])\n            st.session_state.fatores_emissao = sessao_data.get(\"fatores_emissao\", [])\n            st.session_state.tecnologias_alternativas = tecnologias\n            st.session_state.node_counter = sessao_data.get(\"node_counter\", 1)\n            st.session_state.ui_theme_mode = sessao_data.get(\"ui_theme_mode\", st.session_state.get(\"ui_theme_mode\", \"light\"))\n            st.session_state.mass_unit = normalize_unit(sessao_data.get(\"mass_unit\", st.session_state.get(\"mass_unit\", \"t\")))\n            st.session_state.auto_save_session = bool(sessao_data.get(\"auto_save_session\", st.session_state.get(\"auto_save_session\", False)))\n            st.session_state.auto_save_interval = int(\n                sessao_data.get(\"auto_save_interval\", st.session_state.get(\"auto_save_interval\", 20))\n            )\n            st.session_state.pref_show_save_toast = bool(\n                sessao_data.get(\"pref_show_save_toast\", st.session_state.get(\"pref_show_save_toast\", True))\n            )\n            st.session_state.pref_show_integrity_alerts = bool(\n                sessao_data.get(\"pref_show_integrity_alerts\", st.session_state.get(\"pref_show_integrity_alerts\", True))\n            )\n\n            # Restaurar contexto de ano\n            try:\n                ctx = AppContext.get()\n                ctx.refresh_anos()\n                ano_salvo = sessao_data.get(\"ano_ativo\")\n                anos_sel_salvos = sessao_data.get(\"anos_selecionados\", [])\n                modo_comp_salvo = bool(sessao_data.get(\"modo_comparacao\", False))\n\n                if isinstance(ano_salvo, int) and ano_salvo in ctx.anos_disponiveis:\n                    ctx.set_ano(ano_salvo)\n                else:\n                    ctx.set_ano(ctx.anos_disponiveis[0])\n\n                if modo_comp_salvo and isinstance(anos_sel_salvos, list):\n                    anos_validos = [a for a in anos_sel_salvos if isinstance(a, int) and a in ctx.anos_disponiveis]\n                    if anos_validos:\n                        ctx.set_anos_selecionados(anos_validos)\n            except Exception:\n                pass\n\n            if \"openrouter_api_key\" in sessao_data:\n                st.session_state.openrouter_api_key = sessao_data.get(\"openrouter_api_key\", \"\")\n\n            # Propagar pegada encadeada ap\u00f3s restaurar todas as unidades\n            try:\n                import database as _db\n                _db.DatabaseManager().propagar_pegada()\n            except Exception:\n                pass\n\n            st.session_state.refresh_canvas = True\n        except Exception as e:\n            st.error(f\"Erro ao importar sess\u00e3o: {e}\")\n            raise\n\n    def _limpar_sessao(self):\n        keys_to_clear = [\n            \"unidades\", \"conexoes\", \"edges\", \"fatores_emissao\",\n            \"tecnologias_alternativas\", \"node_counter\", \"data_login\",\n            \"refresh_canvas\", \"selected_node\", \"mostrar_aviso_fatores_emissao\",\n            \"openrouter_api_key\", \"sessao_restaurada\", \"auto_save_session\",\n        ]\n        for key in keys_to_clear:\n            if key in st.session_state:\n                del st.session_state[key]\n\n    def _load_all_sessions(self) -> Dict:\n        if os.path.exists(self.sessions_file):\n            try:\n                with open(self.sessions_file, 'r', encoding='utf-8') as f:\n                    return json.load(f)\n            except Exception as e:\n                st.warning(f\"Erro ao carregar sess\u00f5es: {e}\")\n                return {}\n        return {}\n\n    def _save_all_sessions(self, sessions: Dict):\n        \"\"\"Persiste sess\u00f5es atomicamente com sanitiza\u00e7\u00e3o de tipos.\"\"\"\n        def _to_j(v: Any) -> Any:\n            if v is None or isinstance(v, (bool, int, float, str)):\n                return v\n            if isinstance(v, dict):\n                return {str(k): _to_j(val) for k, val in v.items()}\n            if isinstance(v, (list, tuple, set, frozenset)):\n                return [_to_j(i) for i in v]\n            if isinstance(v, datetime):\n                return v.isoformat()\n            try:\n                import numpy as np\n                if isinstance(v, np.generic):\n                    return v.item()\n            except ImportError:\n                pass\n            if hasattr(v, \"to_dict\"):\n                try:\n                    return _to_j(v.to_dict())\n                except Exception:\n                    pass\n            if hasattr(v, \"__dict__\"):\n                try:\n                    return _to_j(vars(v))\n                except Exception:\n                    pass\n            return str(v)\n\n        safe = _to_j(sessions)\n        content = json.dumps(safe, indent=2, ensure_ascii=False)\n        directory = os.path.dirname(self.sessions_file)\n        os.makedirs(directory, exist_ok=True)\n        fd, tmp_path = tempfile.mkstemp(prefix=\".tmp_sessions_\", suffix=\".json\", dir=directory)\n        try:\n            with os.fdopen(fd, \"w\", encoding=\"utf-8\") as f:\n                f.write(content)\n                f.flush()\n                os.fsync(f.fileno())\n            os.replace(tmp_path, self.sessions_file)\n        except Exception:\n            if os.path.exists(tmp_path):\n                try:\n                    os.remove(tmp_path)\n                except OSError:\n                    pass\n            raise\n\n    def _save_user_session(self):\n        usuario = st.session_state.get(\"usuario_logado\")\n        if not usuario:\n            return False\n        try:\n            sessao_data = self._exportar_sessao()\n            all_sessions = self._load_all_sessions()\n            all_sessions[usuario] = sessao_data\n            self._save_all_sessions(all_sessions)  # lan\u00e7a em caso de erro\n            try:\n                ctx = AppContext.get()\n                db_data = export_session_to_database(ano=ctx.ano_ativo)\n                save_database(ctx.db_master_path(), db_data)\n            except Exception:\n                pass\n            return True\n        except Exception as e:\n            st.error(f\"Erro ao salvar sess\u00e3o: {e}\")\n            return False", "tabs/Tecnologias.py": "import streamlit as st\nfrom database import Tecnologia\nfrom utils import UtilsUI\n\nclass TecnologiasTab:\n    \"\"\"Classe para gerenciar a aba de Tecnologias Alternativas no Streamlit.\"\"\"\n    \n    def __init__(self):\n        self.utils_ui = UtilsUI()\n\n    def _render(self):\n        if \"tecnologias_alternativas\" not in st.session_state:\n            st.session_state.tecnologias_alternativas = []\n        if \"fatores_emissao\" not in st.session_state:\n            st.session_state.fatores_emissao = []\n\n        feedback_msg = st.session_state.pop(\"tecnologia_feedback_msg\", None)\n        if feedback_msg:\n            st.toast(feedback_msg, icon=\"\u2705\")\n\n        if st.session_state.get(\"tec_criando_nova\"):\n            st.markdown(\"### \u2795 Nova Tecnologia\")\n            if st.button(\"\u2b05\ufe0f Voltar para lista\"):\n                del st.session_state[\"tec_criando_nova\"]\n                st.rerun()\n            st.markdown(\"---\")\n            self._render_criar_tecnologia()\n        else:\n            self._render_lista_tecnologias()\n\n    def _render_lista_tecnologias(self):\n        \"\"\"Renderiza a lista de tecnologias registradas\"\"\"\n        st.markdown(\"### Tecnologias\")\n\n        st.markdown(\"---\")\n        \n        if st.button(\"Adicionar nova tecnologia\", type=\"primary\"):\n            st.session_state[\"tec_criando_nova\"] = True\n            st.rerun()\n\n        if st.session_state.tecnologias_alternativas:\n            for i, tec in enumerate(st.session_state.tecnologias_alternativas):\n                # Criar colunas para expander e bot\u00e3o de remover\n                col_expander, col_btn = st.columns([10, 1])\n                \n                with col_expander:\n                    # Usar render_tecnologia_form para visualiza\u00e7\u00e3o consistente\n                    tecnologia_editada = self.utils_ui.render_tecnologia_form(\n                        tecnologia=tec,\n                        key_prefix=f\"tec_lista_{i}\",\n                        read_only=False,\n                        show_save_buttons=True,\n                        on_save_callback=self._salvar_tecnologia_editada,\n                        expanded=False  # Come\u00e7ar colapsado\n                    )\n                \n                with col_btn:\n                    # Espa\u00e7amento para alinhar com o expander\n                    st.write(\"\")\n                    # Bot\u00e3o de remover ao lado\n                    if st.button(\"\ud83d\uddd1\ufe0f\", key=f\"remover_tec_{i}\", help=\"Remover tecnologia\", use_container_width=True):\n                        st.session_state.tecnologias_alternativas.pop(i)\n                        st.session_state[\"tecnologia_feedback_msg\"] = \"Tecnologia removida com sucesso.\"\n                        st.rerun()\n                \n        else:\n            st.info(\"Nenhuma tecnologia alternativa registrada.\")\n    \n    def _render_criar_tecnologia(self):\n        \"\"\"Renderiza o formul\u00e1rio de cria\u00e7\u00e3o de nova tecnologia\"\"\"\n        st.markdown(\"Preencha os dados abaixo para criar uma nova tecnologia alternativa.\")\n\n        nova_tecnologia = self.utils_ui.render_tecnologia_form(\n            tecnologia=None,\n            key_prefix=\"tec_nova\",\n            read_only=False,\n            show_save_buttons=True,\n            on_save_callback=self._salvar_nova_tecnologia\n        )\n    \n    def _salvar_nova_tecnologia(self, tecnologia):\n        \"\"\"Callback para salvar nova tecnologia\"\"\"\n        if tecnologia:\n            ids_existentes = [t.id for t in st.session_state.tecnologias_alternativas]\n            if tecnologia.id in ids_existentes:\n                st.error(f\"\u274c J\u00e1 existe uma tecnologia com o ID '{tecnologia.id}'. Use um ID diferente.\")\n                return False\n\n            st.session_state.tecnologias_alternativas.append(tecnologia)\n            st.session_state[\"tecnologia_feedback_msg\"] = f\"\u2705 Tecnologia '{tecnologia.nome}' criada com sucesso!\"\n            st.session_state.pop(\"tec_criando_nova\", None)\n            st.rerun()\n            return True\n        return False\n    \n    def _salvar_tecnologia_editada(self, tecnologia):\n        \"\"\"Callback para salvar tecnologia editada\"\"\"\n        if tecnologia:\n            # Encontrar e substituir a tecnologia\n            for i, tec in enumerate(st.session_state.tecnologias_alternativas):\n                if tec.id == tecnologia.id:\n                    st.session_state.tecnologias_alternativas[i] = tecnologia\n                    st.session_state[\"tecnologia_feedback_msg\"] = f\"\u2705 Tecnologia '{tecnologia.nome}' atualizada com sucesso!\"\n                    st.rerun()\n                    return True\n            \n            # Se n\u00e3o encontrou, adicionar como nova\n            st.session_state.tecnologias_alternativas.append(tecnologia)\n            st.session_state[\"tecnologia_feedback_msg\"] = f\"\u2705 Nova vers\u00e3o da tecnologia '{tecnologia.nome}' salva com sucesso!\"\n            st.rerun()\n            return True\n        return False\n", "tabs/Unidades.py": "import streamlit as st\nimport sys\nimport os\n\n# Ensure core is importable\n_root_dir = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\nif _root_dir not in sys.path:\n    sys.path.insert(0, _root_dir)\n\nfrom utils import UtilsUI\nfrom core.context import AppContext\nfrom core.validation.relational import validar_integridade_relacional, formatar_relatorio_markdown\nfrom core.units import convert_mass, get_default_mass_unit_from_session, co2e_label\n\nclass UnidadesTab:\n    \"\"\"Classe para gerenciar a aba de Unidades e Fluxos no Streamlit.\"\"\"\n\n    def __init__(self):\n        self.utils_ui = UtilsUI()\n\n    def _render(self):\n        \"\"\"Renderiza a interface com tabs para organizar as funcionalidades\"\"\"\n        with st.sidebar:\n            st.markdown(\"### \ud83d\udd0d Filtros\")\n            filtros_sidebar = self._render_sidebar_filters()\n            st.markdown(\"---\")\n            st.markdown(\"### \ud83d\udd0e Valida\u00e7\u00e3o Relacional\")\n            self._render_relational_validation(\"sidebar\")\n\n        tab1, tab2 = st.tabs([\n            \"Unidades Produtivas\",\n            \"Fluxos\"\n        ])\n\n        with tab1:\n            self._render_tabela_unidades(filtros_sidebar)\n\n        with tab2:\n            self._render_gerenciar_fluxos()\n\n    def _render_sidebar_filters(self):\n        \"\"\"Renderiza filtros da p\u00e1gina de unidades na sidebar.\"\"\"\n        unidades = self.utils_ui.db.get_unidades()\n\n        anos_disponiveis = sorted({\n            str(getattr(u, \"Periodo\", \"\") or \"\").strip()\n            for u in unidades\n            if str(getattr(u, \"Periodo\", \"\") or \"\").strip()\n        })\n        localizacoes = sorted({\n            str(getattr(u, \"Localizacao\", \"\") or \"\").strip()\n            for u in unidades\n            if str(getattr(u, \"Localizacao\", \"\") or \"\").strip()\n        })\n        tecnologias = sorted({\n            (\n                getattr(getattr(u, \"Tecnologia\", None), \"nome\", \"\")\n                if getattr(u, \"Tecnologia\", None)\n                else \"\"\n            ).strip()\n            for u in unidades\n            if getattr(u, \"Tecnologia\", None)\n            and (\n                getattr(getattr(u, \"Tecnologia\", None), \"nome\", \"\")\n                if hasattr(getattr(u, \"Tecnologia\", None), \"nome\")\n                else \"\"\n            ).strip()\n        })\n\n        ano = st.selectbox(\n            \"Per\u00edodo (ano)\",\n            [\"Todos\"] + anos_disponiveis,\n            key=\"unidades_sidebar_filtro_ano\",\n        )\n        localizacao = st.selectbox(\n            \"Localiza\u00e7\u00e3o\",\n            [\"Todos\"] + localizacoes,\n            key=\"unidades_sidebar_filtro_localizacao\",\n        )\n        tecnologia = st.selectbox(\n            \"Tecnologia\",\n            [\"Todos\"] + tecnologias,\n            key=\"unidades_sidebar_filtro_tecnologia\",\n        )\n        busca = st.text_input(\n            \"Buscar por ID/Nome\",\n            key=\"unidades_sidebar_filtro_busca\",\n        )\n\n        return {\n            \"ano\": ano,\n            \"localizacao\": localizacao,\n            \"tecnologia\": tecnologia,\n            \"busca\": busca,\n        }\n\n    def _build_relational_payload(self):\n        \"\"\"Monta payload para valida\u00e7\u00e3o relacional a partir do estado atual.\"\"\"\n        unidades = [u.to_dict() if hasattr(u, \"to_dict\") else vars(u) for u in st.session_state.get(\"unidades\", [])]\n        conexoes = [c.to_dict() if hasattr(c, \"to_dict\") else vars(c) for c in st.session_state.get(\"conexoes\", [])]\n        tecnologias = [\n            t.to_dict() if hasattr(t, \"to_dict\") else (t if isinstance(t, dict) else vars(t))\n            for t in st.session_state.get(\"tecnologias_alternativas\", [])\n        ]\n        return {\n            \"unidades\": unidades,\n            \"conexoes\": conexoes,\n            \"tecnologias\": tecnologias,\n            \"fatores_emissao\": st.session_state.get(\"fatores_emissao\", []),\n        }\n\n    def _render_relational_validation(self, key_suffix: str):\n        \"\"\"Executa e exibe valida\u00e7\u00e3o relacional com foco em warnings de informa\u00e7\u00e3o faltante.\"\"\"\n        report = validar_integridade_relacional(self._build_relational_payload())\n\n        if report.errors:\n            st.error(\n                f\"Valida\u00e7\u00e3o relacional: {len(report.errors)} erro(s) encontrado(s). \"\n                \"Corrija antes de continuar altera\u00e7\u00f5es de fluxo/unidades.\"\n            )\n        elif report.warnings:\n            st.warning(\n                f\"Valida\u00e7\u00e3o relacional: {len(report.warnings)} aviso(s). \"\n                \"Revise campos faltantes (especialmente per\u00edodo/ano) para consist\u00eancia multi-ano.\"\n            )\n        else:\n            st.success(\"Valida\u00e7\u00e3o relacional: sem inconsist\u00eancias.\")\n\n        warnings_periodo = [\n            w for w in report.warnings\n            if w.rule_type in {\"periodo_vazio\", \"periodo_inconsistente\"}\n            or \"periodo\" in (w.campo or \"\").lower()\n        ]\n        if warnings_periodo:\n            st.warning(\n                \"Existem registros sem per\u00edodo/ano v\u00e1lido ou com per\u00edodo inconsistente. \"\n                \"Preencha/ajuste o campo de per\u00edodo nas unidades e fluxos para evitar erros futuros.\"\n            )\n\n        with st.expander(\"\ud83d\udd0e Detalhes da valida\u00e7\u00e3o relacional\", expanded=bool(report.errors)):\n            st.markdown(formatar_relatorio_markdown(report))\n\n    def _render_gerenciar_fluxos(self):\n        \"\"\"Tab para gerenciamento de fluxos (importa\u00e7\u00e3o/exporta\u00e7\u00e3o e cria\u00e7\u00e3o/exclus\u00e3o)\"\"\"\n        mass_unit = get_default_mass_unit_from_session(st.session_state)\n        st.markdown(\"### Gerenciar Fluxos\")\n        st.markdown(\"---\")\n        \n        # Se\u00e7\u00e3o de Cria\u00e7\u00e3o de Conex\u00f5es\n        st.markdown(\"#### Criar Novo Fluxo (Arco)\")\n        \n        if len(st.session_state.unidades) < 2:\n            st.info(\"\u00c9 necess\u00e1rio ter pelo menos 2 unidades cadastradas para criar um fluxo.\")\n        else:\n            unidades = st.session_state.unidades\n            opcoes_origem = {\n                f\"{u.ID_ELO} | {u.Nome} | Ano {u.Periodo}\": u\n                for u in unidades\n            }\n            col1, col2 = st.columns(2)\n            \n            with col1:\n                origem_label = st.selectbox(\n                    \"Unidade de Origem:\",\n                    list(opcoes_origem.keys()),\n                    key=\"fluxo_origem\"\n                )\n                origem_unidade = opcoes_origem[origem_label]\n                origem = origem_unidade.ID_ELO\n            \n            with col2:\n                # Filtrar destinos para n\u00e3o incluir a pr\u00f3pria origem\n                opcoes_destino = {\n                    f\"{u.ID_ELO} | {u.Nome} | Ano {u.Periodo}\": u\n                    for u in unidades\n                    if u.ID_ELO != origem\n                }\n                destino_label = st.selectbox(\n                    \"Unidade de Destino:\",\n                    list(opcoes_destino.keys()),\n                    key=\"fluxo_destino\"\n                )\n                destino_unidade = opcoes_destino[destino_label]\n                destino = destino_unidade.ID_ELO\n            \n            # Obter massa de sa\u00edda da unidade de origem\n            unidade_origem = self.utils_ui.db.get_unidade_by_id(origem)\n            massa_saida = unidade_origem.MassaOutput if unidade_origem else 0.0\n            \n            col3, col4 = st.columns(2)\n            \n            with col3:\n                massa_saida_disp = convert_mass(massa_saida, \"t\", mass_unit)\n                st.metric(\n                    f\"Massa do Fluxo ({mass_unit}):\",\n                    f\"{massa_saida_disp:.2f}\",\n                    help=\"A massa do fluxo \u00e9 sempre a massa de sa\u00edda da unidade de origem\"\n                )\n                st.caption(f\"Ano de origem: {getattr(origem_unidade, 'Periodo', '') or 'N\u00e3o informado'}\")\n            \n            with col4:\n                fluxo_id_preview = self.utils_ui.db.next_fluxo_id()\n                st.text_input(\n                    \"ID do Fluxo\",\n                    value=fluxo_id_preview,\n                    disabled=True,\n                    key=\"fluxo_id_preview\",\n                )\n                label = st.text_input(\n                    \"R\u00f3tulo do Fluxo:\",\n                    value=\"Fluxo\",\n                    key=\"fluxo_label\"\n                )\n                st.caption(f\"Ano de destino: {getattr(destino_unidade, 'Periodo', '') or 'N\u00e3o informado'}\")\n            \n            if st.button(\" Criar Fluxo\", type=\"primary\"):\n                self._criar_fluxo(origem, destino, massa_saida, label)\n        \n        st.markdown(\"---\")\n        \n        # Se\u00e7\u00e3o de Exclus\u00e3o de Conex\u00f5es\n        st.markdown(\"#### Excluir Fluxo Existente\")\n        \n        if not st.session_state.conexoes:\n            st.info(\"Nenhum fluxo cadastrado no sistema.\")\n        else:\n            # Criar lista de fluxos formatada\n            fluxos_disponiveis = [\n                f\"{getattr(c, 'id', '') or '-'} | {c.origem} \u2192 {c.destino} ({convert_mass(c.massa, 't', mass_unit):.2f} {mass_unit}) [{c.periodo}]\"\n                for c in st.session_state.conexoes\n            ]\n            \n            fluxo_selecionado = st.selectbox(\n                \"Selecione o fluxo para excluir:\",\n                range(len(fluxos_disponiveis)),\n                format_func=lambda i: fluxos_disponiveis[i],\n                key=\"fluxo_excluir\"\n            )\n            \n            if st.button(\"Excluir Fluxo\", type=\"secondary\"):\n                self._excluir_fluxo(fluxo_selecionado)\n        \n        st.markdown(\"---\")\n    \n    def _criar_fluxo(self, origem: str, destino: str, massa: float, label: str):\n        \"\"\"Cria um novo fluxo entre duas unidades\"\"\"\n        from database import Conexao\n        \n        # Buscar unidade de origem para obter o per\u00edodo\n        unidade_origem = self.utils_ui.db.get_unidade_by_id(origem)\n        unidade_destino = self.utils_ui.db.get_unidade_by_id(destino)\n        periodo_origem = str(unidade_origem.Periodo) if unidade_origem else \"\"\n        periodo_destino = str(unidade_destino.Periodo) if unidade_destino else \"\"\n\n        if not periodo_origem:\n            st.warning(\"A unidade de origem est\u00e1 sem ano/per\u00edodo. Preencha essa informa\u00e7\u00e3o antes de criar o fluxo.\")\n            return\n        if not periodo_destino:\n            st.warning(\"A unidade de destino est\u00e1 sem ano/per\u00edodo. Preencha essa informa\u00e7\u00e3o antes de criar o fluxo.\")\n            return\n        if periodo_origem != periodo_destino:\n            st.warning(\n                f\"Origem e destino est\u00e3o em anos diferentes ({periodo_origem} vs {periodo_destino}). \"\n                \"Ajuste os per\u00edodos para manter consist\u00eancia relacional.\"\n            )\n            return\n        \n        # Verificar se j\u00e1 existe conex\u00e3o entre essas unidades no mesmo per\u00edodo\n        for conexao in st.session_state.conexoes:\n            if conexao.origem == origem and conexao.destino == destino and conexao.periodo == periodo_origem:\n                st.error(f\"J\u00e1 existe um fluxo de {origem} para {destino} no per\u00edodo {periodo_origem}. Exclua o fluxo existente primeiro.\")\n                return\n        \n        # Criar nova conex\u00e3o\n        id_fluxo = self.utils_ui.db.next_fluxo_id()\n        nova_conexao = Conexao(\n            id=id_fluxo,\n            origem=origem,\n            destino=destino,\n            massa=massa,\n            label=label,\n            periodo=str(unidade_origem.Periodo) if unidade_origem else \"\",\n        )\n        \n        st.session_state.conexoes.append(nova_conexao)\n        \n        # Atualizar a unidade de origem com a conex\u00e3o\n        if unidade_origem:\n            unidade_origem.Conexao = nova_conexao\n        \n        st.success(f\"Fluxo {id_fluxo} criado com sucesso: {origem} \u2192 {destino}\")\n        st.rerun()\n    \n    def _excluir_fluxo(self, indice: int):\n        \"\"\"Exclui um fluxo existente\"\"\"\n        if 0 <= indice < len(st.session_state.conexoes):\n            conexao_removida = st.session_state.conexoes.pop(indice)\n            \n            # Remover conex\u00e3o da unidade de origem\n            unidade_origem = self.utils_ui.db.get_unidade_by_id(conexao_removida.origem)\n            if unidade_origem and hasattr(unidade_origem, 'Conexao'):\n                unidade_origem.Conexao = None\n            \n            st.success(f\"Fluxo exclu\u00eddo: {conexao_removida.origem} \u2192 {conexao_removida.destino}\")\n            st.rerun()\n        else:\n            st.error(\"\u00cdndice de fluxo inv\u00e1lido.\")\n    \n    def _render_tabela_unidades(self, filtros_sidebar=None):\n        \"\"\"Tab para visualizar, criar e editar unidades\"\"\"\n        feedback_msg = st.session_state.pop(\"unidade_feedback_msg\", None)\n        if feedback_msg:\n            st.toast(feedback_msg, icon=\"\u2705\")\n        tecnologia_feedback = st.session_state.pop(\"tecnologia_feedback_msg\", None)\n        if tecnologia_feedback:\n            st.toast(tecnologia_feedback, icon=\"\u2705\")\n\n        # Se est\u00e1 criando uma nova unidade\n        if st.session_state.get(\"criando_nova_unidade\"):\n            st.markdown(\"### Criar Nova Unidade\")\n            \n            # Bot\u00e3o para voltar \u00e0 tabela\n            if st.button(\"\u2b05\ufe0f Voltar para Tabela\"):\n                del st.session_state.criando_nova_unidade\n                st.rerun()\n            \n            st.markdown(\"---\")\n            st.markdown(\"Preencha os dados abaixo para criar uma nova unidade no sistema.\")\n            \n            self.utils_ui.render_form(modal=None)\n            return\n        \n        # Se h\u00e1 uma unidade sendo editada\n        if st.session_state.get(\"unidade_selecionada_tabela\"):\n            unidade = self.utils_ui.db.get_unidade_by_id(st.session_state.unidade_selecionada_tabela)\n            if unidade:\n                st.markdown(\"### Editar Unidade\")\n                \n                # Bot\u00e3o para voltar \u00e0 tabela\n                if st.button(\"\u2b05\ufe0f Voltar para Tabela\"):\n                    del st.session_state.unidade_selecionada_tabela\n                    st.rerun()\n                \n                st.markdown(\"---\")\n                \n                self.utils_ui.render_edit_form(\n                    unidade=unidade,\n                    fatores_emissao=st.session_state.fatores_emissao,\n                    callback_salvar=self.utils_ui._salvar_ou_atualizar_unidade\n                )\n                return\n\n        # Visualiza\u00e7\u00e3o da tabela (estado padr\u00e3o)\n        st.markdown(\"### Unidades\")\n        st.markdown(\"---\")\n\n        unidades = self.utils_ui.db.get_unidades()\n        filtros_sidebar = filtros_sidebar or {\n            \"ano\": \"Todos\",\n            \"localizacao\": \"Todos\",\n            \"tecnologia\": \"Todos\",\n            \"busca\": \"\",\n        }\n        \n        # Bot\u00e3o para criar nova unidade\n        if st.button(\" Criar Nova Unidade\", type=\"primary\"):\n            st.session_state.criando_nova_unidade = True\n            st.rerun()\n        \n        if not st.session_state.unidades:\n            st.info(\"Nenhuma unidade cadastrada no sistema. Clique no bot\u00e3o acima para criar a primeira unidade.\")\n            return\n\n        # M\u00e9tricas resumidas\n        estatisticas = self.utils_ui.db.get_estatisticas()\n        col1, col2, col3 = st.columns(3)\n        col1.metric(\"Total Unidades\", estatisticas[\"total_unidades\"])\n        col2.metric(\"Total Conex\u00f5es\", estatisticas[\"total_conexoes\"])\n        _mu = get_default_mass_unit_from_session(st.session_state)\n        col3.metric(\"Emiss\u00e3o Total\", f\"{estatisticas['emissao_total']:,.2f} {co2e_label(_mu)}\")\n\n        edges = self.utils_ui.db.get_edges_for_graph()\n        filtro_ano = filtros_sidebar.get(\"ano\", \"Todos\")\n        filtro_localizacao = filtros_sidebar.get(\"localizacao\", \"Todos\")\n        filtro_tecnologia = filtros_sidebar.get(\"tecnologia\", \"Todos\")\n        busca = str(filtros_sidebar.get(\"busca\", \"\") or \"\").strip().lower()\n\n        if filtro_ano != \"Todos\":\n            unidades = [u for u in unidades if str(getattr(u, \"Periodo\", \"\")).strip() == filtro_ano]\n        if filtro_localizacao != \"Todos\":\n            unidades = [u for u in unidades if str(getattr(u, \"Localizacao\", \"\")).strip() == filtro_localizacao]\n        if filtro_tecnologia != \"Todos\":\n            unidades = [\n                u for u in unidades\n                if str(getattr(getattr(u, \"Tecnologia\", None), \"nome\", \"\")).strip() == filtro_tecnologia\n            ]\n        if busca:\n            unidades = [\n                u for u in unidades\n                if busca in str(getattr(u, \"ID_ELO\", \"\")).lower()\n                or busca in str(getattr(u, \"Nome\", \"\")).lower()\n            ]\n\n        ids_filtrados = {u.ID_ELO for u in unidades}\n        edges = [e for e in edges if e.get(\"source\") in ids_filtrados]\n        if filtro_ano != \"Todos\":\n            edges = [e for e in edges if e.get(\"periodo\", \"\") == filtro_ano or not e.get(\"periodo\")]\n\n        unidades_sem_ano = [u.ID_ELO for u in self.utils_ui.db.get_unidades() if not str(getattr(u, \"Periodo\", \"\") or \"\").strip()]\n        if unidades_sem_ano:\n            st.warning(\n                \"As seguintes unidades est\u00e3o sem ano/per\u00edodo: \"\n                + \", \".join(unidades_sem_ano)\n                + \". Preencha para garantir consist\u00eancia dos fluxos.\"\n            )\n\n        self.utils_ui.render_table(\n            unidades=unidades,\n            edges=edges,\n            editar_callback=self._editar_unidade_tabela,\n            remover_callback=self._remover_unidade_tabela\n        )\n\n    def _editar_unidade_tabela(self, id_elo):\n        \"\"\"Callback para editar unidade da tabela\"\"\"\n        st.session_state.unidade_selecionada_tabela = id_elo\n        st.rerun()\n\n    def _remover_unidade_tabela(self, id_elo):\n        \"\"\"Callback para remover unidade da tabela\"\"\"\n        self.utils_ui.db.remove_unidade(id_elo)\n        st.session_state.unidades = self.utils_ui.db.get_unidades()\n        st.success(f\"Unidade {id_elo} removida com sucesso.\")\n        if st.session_state.get(\"unidade_selecionada_tabela\") == id_elo:\n            st.session_state.pop(\"unidade_selecionada_tabela\")\n        st.rerun()", "tabs/report_exports.py": "\"\"\"\nReport export utilities \u2014 MD/PDF generation and customization for Reports tab.\nProvides markdown generators, PDF generators (via reportlab), a customization panel,\nand a reusable download-bar component.\n\"\"\"\nfrom __future__ import annotations\nimport streamlit as st\nimport json\nimport sys\nimport os\nfrom datetime import datetime\nfrom io import BytesIO\nfrom typing import Optional\n\n# Ensure core is importable\n_root_dir = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\nif _root_dir not in sys.path:\n    sys.path.insert(0, _root_dir)\n\nfrom core.units import co2e_label, co2e_intensity_label, get_default_mass_unit_from_session\n\n\ndef _unit_lbl():\n    \"\"\"Return (co2e_label, intensity_label) for the current session.\"\"\"\n    _mu = get_default_mass_unit_from_session(st.session_state)\n    return co2e_label(_mu), co2e_intensity_label(_mu)\n\nREPORTLAB_AVAILABLE = False  # PDF generation removed; markdown-only exports\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  REPORT CONFIG \u2014 defaults, init, render, get\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nREPORT_CONFIG_DEFAULTS = {\n    \"rpt_titulo\": \"\",\n    \"rpt_subtitulo\": \"\",\n    \"rpt_rodape\": \"\",\n    \"rpt_confidencial\": False,\n    \"rpt_tema\": \"Padr\u00e3o\",\n    \"rpt_incluir_metodologia\": True,\n    \"rpt_incluir_graficos_desc\": True,\n    \"rpt_formato_data\": \"DD/MM/AAAA\",\n    \"rpt_secoes_painel\": True,\n    \"rpt_secoes_inventario\": True,\n    \"rpt_secoes_ifrs\": True,\n    \"rpt_secoes_unidades\": True,\n    \"rpt_secoes_comparativo\": True,\n}\n\nTEMAS_CORES = {\n    \"Padr\u00e3o\":         {\"primary\": \"#0F766E\", \"accent\": \"#0284C7\", \"bg\": \"#F8FAFC\"},\n    \"Corporativo\":    {\"primary\": \"#1E3A5F\", \"accent\": \"#2563EB\", \"bg\": \"#F1F5F9\"},\n    \"Minimalista\":    {\"primary\": \"#374151\", \"accent\": \"#6B7280\", \"bg\": \"#FFFFFF\"},\n    \"Alto Contraste\": {\"primary\": \"#000000\", \"accent\": \"#B91C1C\", \"bg\": \"#FFFFFF\"},\n}\n\n\ndef init_report_config():\n    if \"report_config\" not in st.session_state:\n        st.session_state.report_config = dict(REPORT_CONFIG_DEFAULTS)\n\n\ndef get_report_config() -> dict:\n    init_report_config()\n    return st.session_state.report_config\n\n\ndef _fmt_date(dt: Optional[datetime] = None, fmt: str = \"DD/MM/AAAA\") -> str:\n    dt = dt or datetime.now()\n    if fmt == \"AAAA-MM-DD\":\n        return dt.strftime(\"%Y-%m-%d\")\n    if fmt == \"MM/DD/AAAA\":\n        return dt.strftime(\"%m/%d/%Y\")\n    return dt.strftime(\"%d/%m/%Y\")\n\n\ndef render_report_config():\n    \"\"\"Renders the customization panel for reports (call once at top of Reports).\"\"\"\n    init_report_config()\n    cfg = st.session_state.report_config\n\n    with st.expander(\"\u2699\ufe0f Personaliza\u00e7\u00e3o dos Relat\u00f3rios\", expanded=False):\n        st.caption(\"Configure t\u00edtulo, tema, se\u00e7\u00f5es e op\u00e7\u00f5es de exporta\u00e7\u00e3o para todos os relat\u00f3rios.\")\n        c1, c2, c3 = st.columns(3)\n        with c1:\n            cfg[\"rpt_titulo\"] = st.text_input(\n                \"T\u00edtulo personalizado\",\n                value=cfg.get(\"rpt_titulo\", \"\"),\n                placeholder=\"Deixe vazio para t\u00edtulo padr\u00e3o\",\n                key=\"_rpt_titulo\",\n            )\n            cfg[\"rpt_tema\"] = st.selectbox(\n                \"Tema visual\",\n                list(TEMAS_CORES.keys()),\n                index=list(TEMAS_CORES.keys()).index(cfg.get(\"rpt_tema\", \"Padr\u00e3o\")),\n                key=\"_rpt_tema\",\n            )\n        with c2:\n            cfg[\"rpt_subtitulo\"] = st.text_input(\n                \"Subt\u00edtulo / Departamento\",\n                value=cfg.get(\"rpt_subtitulo\", \"\"),\n                key=\"_rpt_subtitulo\",\n            )\n            cfg[\"rpt_formato_data\"] = st.selectbox(\n                \"Formato de data\",\n                [\"DD/MM/AAAA\", \"AAAA-MM-DD\", \"MM/DD/AAAA\"],\n                index=[\"DD/MM/AAAA\", \"AAAA-MM-DD\", \"MM/DD/AAAA\"].index(\n                    cfg.get(\"rpt_formato_data\", \"DD/MM/AAAA\")\n                ),\n                key=\"_rpt_fmt_data\",\n            )\n        with c3:\n            cfg[\"rpt_rodape\"] = st.text_input(\n                \"Texto de rodap\u00e9\",\n                value=cfg.get(\"rpt_rodape\", \"\"),\n                placeholder=\"Ex: Documento interno\",\n                key=\"_rpt_rodape\",\n            )\n            cfg[\"rpt_confidencial\"] = st.checkbox(\n                \"\ud83d\udd12 Marcar como Confidencial\",\n                value=cfg.get(\"rpt_confidencial\", False),\n                key=\"_rpt_conf\",\n            )\n\n        st.markdown(\"**Se\u00e7\u00f5es inclu\u00eddas nos downloads:**\")\n        sc1, sc2, sc3, sc4, sc5 = st.columns(5)\n        with sc1:\n            cfg[\"rpt_secoes_painel\"] = st.checkbox(\n                \"Painel Geral\", value=cfg.get(\"rpt_secoes_painel\", True), key=\"_rpt_s1\"\n            )\n        with sc2:\n            cfg[\"rpt_secoes_inventario\"] = st.checkbox(\n                \"Invent\u00e1rio GEE\", value=cfg.get(\"rpt_secoes_inventario\", True), key=\"_rpt_s2\"\n            )\n        with sc3:\n            cfg[\"rpt_secoes_ifrs\"] = st.checkbox(\n                \"Reporte IFRS\", value=cfg.get(\"rpt_secoes_ifrs\", True), key=\"_rpt_s3\"\n            )\n        with sc4:\n            cfg[\"rpt_secoes_unidades\"] = st.checkbox(\n                \"An\u00e1lise Unidades\", value=cfg.get(\"rpt_secoes_unidades\", True), key=\"_rpt_s4\"\n            )\n        with sc5:\n            cfg[\"rpt_secoes_comparativo\"] = st.checkbox(\n                \"Comparativo\", value=cfg.get(\"rpt_secoes_comparativo\", True), key=\"_rpt_s5\"\n            )\n\n        c1, c2 = st.columns(2)\n        with c1:\n            cfg[\"rpt_incluir_metodologia\"] = st.checkbox(\n                \"Incluir notas metodol\u00f3gicas\",\n                value=cfg.get(\"rpt_incluir_metodologia\", True),\n                key=\"_rpt_met\",\n            )\n        with c2:\n            cfg[\"rpt_incluir_graficos_desc\"] = st.checkbox(\n                \"Incluir descri\u00e7\u00e3o de gr\u00e1ficos no MD\",\n                value=cfg.get(\"rpt_incluir_graficos_desc\", True),\n                key=\"_rpt_graf\",\n            )\n\n    st.session_state.report_config = cfg\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  HELPERS\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef _header_md(title: str, cfg: dict, level: int = 1) -> str:\n    \"\"\"Build the standard MD header block.\"\"\"\n    hashes = \"#\" * level\n    custom = cfg.get(\"rpt_titulo\", \"\")\n    titulo = custom if custom else title\n    lines = [f\"{hashes} {titulo}\"]\n    if cfg.get(\"rpt_subtitulo\"):\n        lines.append(f\"*{cfg['rpt_subtitulo']}*\")\n    date_str = _fmt_date(fmt=cfg.get(\"rpt_formato_data\", \"DD/MM/AAAA\"))\n    lines.append(f\"\\n> Gerado em: {date_str}\")\n    if cfg.get(\"rpt_confidencial\"):\n        lines.append(\"\\n> \u26a0\ufe0f **CONFIDENCIAL** \u2014 Distribui\u00e7\u00e3o restrita\")\n    lines.append(\"\")\n    return \"\\n\".join(lines)\n\n\ndef _footer_md(cfg: dict) -> str:\n    lines = [\"\\n---\"]\n    date_str = _fmt_date(fmt=cfg.get(\"rpt_formato_data\", \"DD/MM/AAAA\"))\n    lines.append(f\"*Gerado automaticamente em {date_str} \u00b7 Calculadora CMP*\")\n    if cfg.get(\"rpt_rodape\"):\n        lines.append(f\"\\n*{cfg['rpt_rodape']}*\")\n    if cfg.get(\"rpt_confidencial\"):\n        lines.append(\"\\n**CONFIDENCIAL**\")\n    return \"\\n\".join(lines)\n\n\ndef _table_md(headers: list[str], rows: list[list], align: Optional[list[str]] = None) -> str:\n    \"\"\"Build a pipe-delimited markdown table.\"\"\"\n    if not rows:\n        return \"*Sem dados.*\\n\"\n    n = len(headers)\n    if align is None:\n        align = [\":-\"] * n\n    sep = [a + \"-\" * max(1, 6 - len(a)) for a in align]\n    lines = [\"| \" + \" | \".join(str(h) for h in headers) + \" |\"]\n    lines.append(\"| \" + \" | \".join(sep) + \" |\")\n    for row in rows:\n        cells = [str(c) for c in row]\n        while len(cells) < n:\n            cells.append(\"\")\n        lines.append(\"| \" + \" | \".join(cells[:n]) + \" |\")\n    return \"\\n\".join(lines) + \"\\n\"\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  PDF TEXT HELPERS \u2014 subscript fix & smart number formatting\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\n_UNICODE_SUB_MAP = {\n    '\\u2080': '0', '\\u2081': '1', '\\u2082': '2', '\\u2083': '3', '\\u2084': '4',\n    '\\u2085': '5', '\\u2086': '6', '\\u2087': '7', '\\u2088': '8', '\\u2089': '9',\n}\n\n\ndef _pdf_safe(text) -> str:\n    \"\"\"Replace Unicode subscript characters with plain digits for PDF rendering.\n\n    Helvetica (ReportLab default) does not include \\u2082, \\u2083 etc.\\u2009\\u2014\n    they render as squares.  This converts CO\\u2082 \\u2192 CO2, N\\u2082O \\u2192 N2O, CH\\u2084 \\u2192 CH4.\n    \"\"\"\n    s = str(text)\n    for uni, plain in _UNICODE_SUB_MAP.items():\n        s = s.replace(uni, plain)\n    return s\n\n\ndef _fmt_num(value, decimals: int = 2, max_chars: int = 11) -> str:\n    \"\"\"Smart number formatting for PDF table cells.\n\n    - Reduces decimal places when the formatted string exceeds *max_chars*.\n    - Uses **k / M / G** suffixes for very large values.\n    - Uses scientific notation for very small values (|v| < 0.001).\n    \"\"\"\n    if value is None:\n        return \"\\u2014\"   # em-dash\n    v = float(value)\n    if v == 0:\n        return \"0\"\n    abs_v = abs(v)\n\n    # Very small non-zero \\u2192 scientific notation\n    if 0 < abs_v < 0.001:\n        return f\"{v:.2e}\"\n\n    # Try standard formatting\n    formatted = f\"{v:,.{decimals}f}\"\n    if len(formatted) <= max_chars:\n        return formatted\n\n    # Reduce decimals progressively\n    for d in range(decimals - 1, -1, -1):\n        formatted = f\"{v:,.{d}f}\"\n        if len(formatted) <= max_chars:\n            return formatted\n\n    # Use engineering suffixes\n    if abs_v >= 1e9:\n        return f\"{v / 1e9:,.2f} G\"\n    if abs_v >= 1e6:\n        return f\"{v / 1e6:,.2f} M\"\n    if abs_v >= 1e3:\n        return f\"{v / 1e3:,.1f} k\"\n\n    # Last resort: scientific notation\n    return f\"{v:.{min(decimals, 2)}e}\"\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  MARKDOWN GENERATORS\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef generate_md_painel_geral(data: dict, cfg: dict) -> str:\n    \"\"\"Generate Markdown for Painel Geral tab.\"\"\"\n    _el, _il = _unit_lbl()\n    md = _header_md(\"\ud83d\udcc8 Painel Geral de Emiss\u00f5es\", cfg)\n\n    md += \"## Indicadores-Chave\\n\\n\"\n    md += _table_md(\n        [\"M\u00e9trica\", \"Valor\"],\n        [\n            [\"Emiss\u00e3o Total\", f\"{data['emissao_total']:,.2f} {_el}\"],\n            [\"Intensidade M\u00e9dia\", f\"{data['intensidade_media']:,.4f} {_il}\"],\n            [\"Massa Produzida\", f\"{data['massa_total']:,.1f} t\"],\n            [\"Total de Unidades\", data[\"total_unidades\"]],\n            [\"Unidades Taxadas\", f\"{data['unidades_taxadas']} ({data['pct_taxadas']:.0f}%)\"],\n        ],\n        [\":-\", \"-:\"],\n    )\n\n    esc1, esc2, esc3 = data[\"esc1\"], data[\"esc2\"], data[\"esc3\"]\n    total_e = esc1 + esc2 + esc3\n    pct = lambda v: f\"{v / total_e * 100:.1f}%\" if total_e > 0 else \"0%\"\n\n    md += \"\\n## Emiss\u00f5es por Escopo (GHG Protocol)\\n\\n\"\n    md += _table_md(\n        [\"Escopo\", _el, \"%\"],\n        [\n            [\"\ud83d\udd34 Escopo 1 \u2013 Diretas\", f\"{esc1:,.2f}\", pct(esc1)],\n            [\"\ud83d\udfe1 Escopo 2 \u2013 Energia\", f\"{esc2:,.2f}\", pct(esc2)],\n            [\"\ud83d\udd35 Escopo 3 \u2013 Cadeia de valor\", f\"{esc3:,.2f}\", pct(esc3)],\n            [\"**Total**\", f\"**{total_e:,.2f}**\", \"**100%**\"],\n        ],\n        [\":-\", \"-:\", \":-:\"],\n    )\n\n    if data.get(\"top5\"):\n        md += \"\\n## Top 5 Emissores\\n\\n\"\n        md += _table_md(\n            [\"#\", \"Unidade\", f\"Emiss\u00e3o ({_el})\"],\n            [\n                [i + 1, t[\"id\"], f\"{t['emissao']:,.2f}\"]\n                for i, t in enumerate(data[\"top5\"])\n            ],\n            [\":-:\", \":-\", \"-:\"],\n        )\n\n    if data.get(\"por_localizacao\") and cfg.get(\"rpt_incluir_graficos_desc\", True):\n        md += \"\\n## Emiss\u00f5es por Localiza\u00e7\u00e3o\\n\\n\"\n        md += _table_md(\n            [\"Localiza\u00e7\u00e3o\", _el],\n            [[loc, f\"{val:,.2f}\"] for loc, val in data[\"por_localizacao\"].items()],\n            [\":-\", \"-:\"],\n        )\n\n    if data.get(\"todas_unidades\"):\n        md += \"\\n## Emiss\u00f5es por Escopo por Unidade\\n\\n\"\n        md += _table_md(\n            [\"Unidade\", \"Escopo 1\", \"Escopo 2\", \"Escopo 3\", \"Total\"],\n            [\n                [\n                    u[\"id\"],\n                    f\"{u['e1']:,.2f}\",\n                    f\"{u['e2']:,.2f}\",\n                    f\"{u['e3']:,.2f}\",\n                    f\"{u['total']:,.2f}\",\n                ]\n                for u in data[\"todas_unidades\"][:30]\n            ],\n            [\":-\", \"-:\", \"-:\", \"-:\", \"-:\"],\n        )\n\n    md += _footer_md(cfg)\n    return md\n\n\ndef generate_md_inventario(data: dict, cfg: dict) -> str:\n    \"\"\"Generate Markdown for Invent\u00e1rio GEE tab.\"\"\"\n    _el, _il = _unit_lbl()\n    md = _header_md(\"\ud83d\udce6 Invent\u00e1rio de Emiss\u00f5es de GEE\", cfg)\n\n    empresa = data.get(\"empresa\", \"Entidade\")\n    periodo = data.get(\"periodo\", str(datetime.now().year))\n    consolidacao = data.get(\"consolidacao\", \"Controle operacional\")\n\n    md += f\"**Entidade:** {empresa} \u00b7 **Per\u00edodo:** {periodo} \u00b7 **Consolida\u00e7\u00e3o:** {consolidacao}\\n\\n\"\n\n    t = data.get(\"totais\", {})\n    total = t.get(\"total\", 0)\n    pct = lambda v: f\"{v / total * 100:.1f}%\" if total > 0 else \"0%\"\n\n    md += \"## Resumo do Invent\u00e1rio\\n\\n\"\n    md += _table_md(\n        [\"Categoria GHG Protocol\", _el, \"% do Total\", \"Fontes\"],\n        [\n            [\"**Escopo 1** \u2013 Emiss\u00f5es diretas\", f\"{t.get('escopo1', 0):,.4f}\", pct(t.get(\"escopo1\", 0)),\n             len(data.get(\"fontes_escopo1\", []))],\n            [\"**Escopo 2** \u2013 Energia indireta\", f\"{t.get('escopo2', 0):,.4f}\", pct(t.get(\"escopo2\", 0)),\n             len(data.get(\"fontes_escopo2\", []))],\n            [\"**Escopo 3** \u2013 Outras indiretas\", f\"{t.get('escopo3', 0):,.4f}\", pct(t.get(\"escopo3\", 0)),\n             len(data.get(\"fontes_escopo3\", []))],\n            [\"**Total de Emiss\u00f5es**\", f\"**{total:,.4f}**\", \"**100%**\",\n             sum(len(data.get(f\"fontes_escopo{s}\", [])) for s in [1, 2, 3])],\n            [\"Escopo 1+2 (operacional)\", f\"{t.get('escopo1', 0) + t.get('escopo2', 0):,.4f}\",\n             pct(t.get(\"escopo1\", 0) + t.get(\"escopo2\", 0)), \"\"],\n        ],\n        [\":-\", \"-:\", \":-:\", \"-:\"],\n    )\n\n    if t.get(\"massa\", 0) > 0:\n        md += f\"\\n**Intensidade m\u00e9dia:** {total / t['massa']:,.6f} {_il}\\n\"\n        md += f\"**Massa total produzida:** {t['massa']:,.1f} t\\n\\n\"\n\n    # Detalhamento por escopo\n    for scope_n, scope_lbl, key in [\n        (1, \"Escopo 1 \u2013 Emiss\u00f5es Diretas\", \"fontes_escopo1\"),\n        (2, \"Escopo 2 \u2013 Emiss\u00f5es Indiretas de Energia\", \"fontes_escopo2\"),\n        (3, \"Escopo 3 \u2013 Outras Emiss\u00f5es Indiretas\", \"fontes_escopo3\"),\n    ]:\n        fontes = data.get(key, [])\n        emoji = \"\ud83d\udd34\" if scope_n == 1 else \"\ud83d\udfe1\" if scope_n == 2 else \"\ud83d\udd35\"\n        total_scope = sum(f.get(\"Emiss\u00e3o (tCO\u2082e)\", 0) for f in fontes)\n        md += f\"\\n### {emoji} {scope_lbl}\\n\\n\"\n        md += f\"**Total:** {total_scope:,.4f} {_el} \u00b7 **Fontes:** {len(fontes)}\\n\\n\"\n\n        if fontes:\n            md += _table_md(\n                [\"Unidade\", \"Fonte\", \"G\u00e1s\", \"FE\", \"CE\", \"Massa (t)\", _el],\n                [\n                    [\n                        f.get(\"Unidade\", \"\"),\n                        f.get(\"Fonte de Emiss\u00e3o\", \"\"),\n                        f.get(\"G\u00e1s\", \"CO\u2082e\"),\n                        f\"{f.get('Fator de Emiss\u00e3o', 0):.4f}\",\n                        f\"{f.get('Consumo Espec\u00edfico', 0):.4f}\",\n                        f\"{f.get('Massa Output (t)', 0):.1f}\",\n                        f\"{f.get('Emiss\u00e3o (tCO\u2082e)', 0):,.4f}\",\n                    ]\n                    for f in sorted(fontes, key=lambda x: x.get(\"Emiss\u00e3o (tCO\u2082e)\", 0), reverse=True)\n                ],\n                [\":-\", \":-\", \":-:\", \"-:\", \"-:\", \"-:\", \"-:\"],\n            )\n        else:\n            md += f\"*Nenhuma fonte de Escopo {scope_n} identificada.*\\n\"\n\n    # Resumo por unidade\n    if data.get(\"resumo_unidades\"):\n        md += \"\\n## Resumo por Unidade Produtiva\\n\\n\"\n        md += _table_md(\n            [\"ID\", \"Nome\", \"Local\", \"E1\", \"E2\", \"E3\", \"Total\", \"Intensidade\"],\n            [\n                [\n                    u[\"ID\"], u[\"Nome\"], u.get(\"Localiza\u00e7\u00e3o\", \"\u2014\"),\n                    f\"{u.get('Escopo 1 (tCO\u2082e)', 0):,.4f}\",\n                    f\"{u.get('Escopo 2 (tCO\u2082e)', 0):,.4f}\",\n                    f\"{u.get('Escopo 3 (tCO\u2082e)', 0):,.4f}\",\n                    f\"{u.get('Total (tCO\u2082e)', 0):,.4f}\",\n                    f\"{u.get('Intensidade (tCO\u2082e/t)', 0):,.6f}\",\n                ]\n                for u in sorted(data[\"resumo_unidades\"],\n                                key=lambda x: x.get(\"Total (tCO\u2082e)\", 0), reverse=True)\n            ],\n            [\":-\", \":-\", \":-\", \"-:\", \"-:\", \"-:\", \"-:\", \"-:\"],\n        )\n\n    # Metodologia\n    if cfg.get(\"rpt_incluir_metodologia\", True):\n        md += \"\\n## Nota Metodol\u00f3gica\\n\\n\"\n        md += \"- **Padr\u00e3o:** GHG Protocol \u2013 Corporate Accounting and Reporting Standard\\n\"\n        md += \"- **Escopo 3:** GHG Protocol \u2013 Corporate Value Chain Standard\\n\"\n        md += \"- **ISO:** ISO 14064-1:2018\\n\"\n        md += f\"- **Consolida\u00e7\u00e3o:** {consolidacao}\\n\"\n        md += \"- **Gases:** CO\u2082, CH\u2084, N\u2082O e outros (CO\u2082 equivalente)\\n\"\n        md += f\"- **Per\u00edodo:** {periodo}\\n\"\n\n    md += _footer_md(cfg)\n    return md\n\n\ndef generate_md_ifrs(data: dict, cfg: dict) -> str:\n    \"\"\"Generate Markdown for IFRS S1/S2 report.\"\"\"\n    _el, _il = _unit_lbl()\n    md = _header_md(\"\ud83d\udccb Relat\u00f3rio IFRS S1/S2 \u2013 Divulga\u00e7\u00f5es Clim\u00e1ticas\", cfg)\n\n    ent = data.get(\"entidade\", {})\n    empresa = ent.get(\"nome\", \"Entidade\")\n    periodo_d = data.get(\"periodo\", {})\n    periodo = f\"{periodo_d.get('inicio', '')} a {periodo_d.get('fim', '')}\" if periodo_d.get(\"inicio\") else str(periodo_d.get(\"ano\", datetime.now().year))\n\n    md += f\"**Entidade:** {empresa} \u00b7 **Per\u00edodo:** {periodo} \u00b7 **Consolida\u00e7\u00e3o:** {ent.get('consolidacao', 'Controle operacional')}\\n\\n\"\n\n    # Governan\u00e7a\n    gov = data.get(\"governanca\", {})\n    md += \"## 1. Governan\u00e7a (IFRS S2 \u00a75-12)\\n\\n\"\n    if gov.get(\"orgao_supervisor\"):\n        md += f\"- **\u00d3rg\u00e3o de supervis\u00e3o:** {gov['orgao_supervisor']}\\n\"\n        md += f\"- **Frequ\u00eancia de reporte:** {gov.get('frequencia', '\u2014')}\\n\"\n        if gov.get(\"comite_dedicado\"):\n            md += f\"- **Comit\u00ea dedicado:** {gov.get('comite_nome', 'Sim')}\\n\"\n        if gov.get(\"competencias\"):\n            md += f\"- **Compet\u00eancias:** {gov['competencias']}\\n\"\n        if gov.get(\"integracao_estrategia\"):\n            md += f\"- **Integra\u00e7\u00e3o na estrat\u00e9gia:** {gov['integracao_estrategia']}\\n\"\n        if gov.get(\"remuneracao_vinculada\"):\n            md += \"- **Remunera\u00e7\u00e3o vinculada a metas clim\u00e1ticas:** Sim\\n\"\n    else:\n        md += \"*Governan\u00e7a clim\u00e1tica a ser detalhada.*\\n\"\n    md += \"\\n\"\n\n    # M\u00e9tricas GHG\n    ghg = data.get(\"metricas_ghg\", {})\n    md += \"## 2. M\u00e9tricas de GEE (IFRS S2 \u00a729)\\n\\n\"\n    md += _table_md(\n        [\"M\u00e9trica\", \"Valor\", \"Unidade\"],\n        [\n            [\"Escopo 1 \u2013 Diretas\", f\"{ghg.get('escopo_1_tco2e', 0):,.2f}\", _el],\n            [\"Escopo 2 \u2013 Energia\", f\"{ghg.get('escopo_2_tco2e', 0):,.2f}\", _el],\n            [\"Escopo 3 \u2013 Cadeia de valor\", f\"{ghg.get('escopo_3_tco2e', 0):,.2f}\", _el],\n            [\"**Total GEE**\", f\"**{ghg.get('total_tco2e', 0):,.2f}**\", f\"**{_el}**\"],\n            [\"Intensidade\", f\"{ghg.get('intensidade_media', 0):,.4f}\", _il],\n            [\"Massa produzida\", f\"{ghg.get('massa_total_t', 0):,.1f}\", \"t\"],\n        ],\n        [\":-\", \"-:\", \":-\"],\n    )\n\n    # Exposi\u00e7\u00e3o regulat\u00f3ria\n    exp = data.get(\"exposicao_regulatoria\", {})\n    md += \"\\n### Exposi\u00e7\u00e3o Regulat\u00f3ria (\u00a729b)\\n\\n\"\n    md += _table_md(\n        [\"M\u00e9trica\", \"Valor\"],\n        [\n            [\"GEE sob regula\u00e7\u00e3o de pre\u00e7o\", f\"{exp.get('pct_sob_regulacao', 0):.1f}%\"],\n            [\"Emiss\u00f5es CBAM/fronteira\", f\"{exp.get('emissao_cbam_tco2e', 0):,.2f} {_el}\"],\n            [\"Emiss\u00f5es taxa\u00e7\u00e3o local\", f\"{exp.get('emissao_local_tco2e', 0):,.2f} {_el}\"],\n        ],\n        [\":-\", \"-:\"],\n    )\n\n    # Riscos\n    riscos = data.get(\"riscos\", [])\n    md += \"\\n## 3. Estrat\u00e9gia \u2013 Riscos Clim\u00e1ticos (\u00a713)\\n\\n\"\n    if riscos:\n        md += _table_md(\n            [\"Tipo\", \"Descri\u00e7\u00e3o\", \"Exposi\u00e7\u00e3o\", \"Horizonte\"],\n            [\n                [r.get(\"tipo\", \"\u2014\"), r.get(\"descricao\", \"\u2014\"),\n                 r.get(\"exposicao\", \"\u2014\"), r.get(\"horizonte\", \"\u2014\")]\n                for r in riscos\n            ],\n        )\n    else:\n        md += \"*Nenhum risco clim\u00e1tico material identificado.*\\n\"\n\n    # Oportunidades\n    oportunidades = data.get(\"oportunidades\", [])\n    md += \"\\n### Oportunidades\\n\\n\"\n    if oportunidades:\n        for o in oportunidades:\n            md += f\"- **{o.get('tipo', '\u2014')}:** {o.get('descricao', '\u2014')}\\n\"\n    else:\n        md += \"*Nenhuma oportunidade identificada.*\\n\"\n\n    # Metas\n    metas = data.get(\"metas\", {})\n    md += \"\\n## 4. Metas Clim\u00e1ticas (\u00a733-36)\\n\\n\"\n    if metas.get(\"possui\"):\n        md += _table_md(\n            [\"Aspecto\", \"Detalhe\"],\n            [\n                [\"Tipo de meta\", metas.get(\"tipo\", \"\u2014\")],\n                [\"Ano-base\", str(metas.get(\"ano_base\", \"\u2014\"))],\n                [\"Ano-alvo\", str(metas.get(\"ano_alvo\", \"\u2014\"))],\n                [\"Redu\u00e7\u00e3o\", f\"{metas.get('reducao_pct', 0)}%\"],\n                [\"Valida\u00e7\u00e3o SBTi\", \"\u2705 Sim\" if metas.get(\"sbti\") else \"\u274c N\u00e3o\"],\n                [\"Net Zero\", metas.get(\"net_zero\", \"\u2014\") or \"\u2014\"],\n            ],\n        )\n    else:\n        md += \"*A organiza\u00e7\u00e3o n\u00e3o declarou metas clim\u00e1ticas formais.*\\n\"\n\n    # Plano de transi\u00e7\u00e3o\n    plano = data.get(\"plano_transicao\", {})\n    md += \"\\n## 5. Plano de Transi\u00e7\u00e3o (\u00a714)\\n\\n\"\n    if plano.get(\"possui\"):\n        if plano.get(\"acoes\"):\n            md += f\"- **A\u00e7\u00f5es:** {plano['acoes']}\\n\"\n        if plano.get(\"investimento\"):\n            md += f\"- **Investimento:** {plano['investimento']}\\n\"\n    else:\n        md += \"*Plano de transi\u00e7\u00e3o n\u00e3o declarado.*\\n\"\n\n    # Verifica\u00e7\u00e3o\n    ver = data.get(\"verificacao\", {})\n    md += \"\\n## 6. Verifica\u00e7\u00e3o e Assegura\u00e7\u00e3o\\n\\n\"\n    if ver.get(\"assegurado\"):\n        md += f\"- **Tipo:** {ver.get('tipo', '\u2014')}\\n\"\n        md += f\"- **Auditor:** {ver.get('auditor', '\u2014')}\\n\"\n        md += f\"- **Norma:** {ver.get('norma', '\u2014')}\\n\"\n    else:\n        md += \"*Invent\u00e1rio n\u00e3o assegurado por terceiros.*\\n\"\n\n    # Detalhamento por unidade\n    det = data.get(\"detalhamento_unidades\", [])\n    if det:\n        md += \"\\n## Anexo: Detalhamento por Unidade\\n\\n\"\n        md += _table_md(\n            [\"ID\", \"Nome\", \"Local\", \"E1\", \"E2\", \"E3\", \"Total\", \"Taxa\u00e7\u00e3o\"],\n            [\n                [\n                    u.get(\"id\", \"\"), u.get(\"nome\", \"\"), u.get(\"localizacao\", \"\u2014\"),\n                    f\"{u.get('escopo1', 0):,.2f}\", f\"{u.get('escopo2', 0):,.2f}\",\n                    f\"{u.get('escopo3', 0):,.2f}\", f\"{u.get('total', 0):,.2f}\",\n                    (\"CBAM \" if u.get(\"taxacao_fronteira\") else \"\") +\n                    (\"Local\" if u.get(\"taxacao_local\") else \"\") or \"\u2014\",\n                ]\n                for u in sorted(det, key=lambda x: x.get(\"total\", 0), reverse=True)[:25]\n            ],\n            [\":-\", \":-\", \":-\", \"-:\", \"-:\", \"-:\", \"-:\", \":-:\"],\n        )\n\n    md += _footer_md(cfg)\n    return md\n\n\ndef generate_md_analise_unidade(data: dict, cfg: dict) -> str:\n    \"\"\"Generate Markdown for An\u00e1lise por Unidade tab.\"\"\"\n    _el, _il = _unit_lbl()\n    md = _header_md(\"\ud83d\udcd1 An\u00e1lise Detalhada por Unidade\", cfg)\n\n    rows = data.get(\"unidades\", [])\n    if not rows:\n        md += \"*Sem dados de unidades.*\\n\"\n        md += _footer_md(cfg)\n        return md\n\n    # KPIs\n    md += \"## Indicadores\\n\\n\"\n    md += _table_md(\n        [\"M\u00e9trica\", \"Valor\"],\n        [\n            [\"Unidades\", data.get(\"total\", len(rows))],\n            [\"Emiss\u00e3o Total\", f\"{data.get('emissao_total', 0):,.2f} {_el}\"],\n            [\"Intensidade M\u00e9dia\", f\"{data.get('intensidade_media', 0):,.4f} {_il}\"],\n            [\"Pegada M\u00e9dia\", f\"{data.get('pegada_media', 0):,.4f} {_il}\"],\n        ],\n        [\":-\", \"-:\"],\n    )\n\n    # Table\n    md += \"\\n## Detalhamento\\n\\n\"\n    md += _table_md(\n        [\"ID\", \"Nome\", \"Local\", \"Massa In\", \"Massa Out\", \"E1\", \"E2\", \"E3\", \"Total\", \"Intensidade\", \"Taxa\u00e7\u00e3o\"],\n        [\n            [\n                u.get(\"ID\", \"\"), u.get(\"Nome\", \"\"), u.get(\"Local\", \"\u2014\"),\n                f\"{u.get('Massa In (t)', 0):,.2f}\", f\"{u.get('Massa Out (t)', 0):,.2f}\",\n                f\"{u.get(f'E1 ({_el})', 0):,.2f}\", f\"{u.get(f'E2 ({_el})', 0):,.2f}\",\n                f\"{u.get(f'E3 ({_el})', 0):,.2f}\", f\"{u.get(f'Total ({_el})', 0):,.2f}\",\n                f\"{u.get('Intensidade', 0):,.4f}\", u.get(\"Taxa\u00e7\u00e3o\", \"\u2014\"),\n            ]\n            for u in rows\n        ],\n        [\":-\", \":-\", \":-\", \"-:\", \"-:\", \"-:\", \"-:\", \"-:\", \"-:\", \"-:\", \":-:\"],\n    )\n\n    md += _footer_md(cfg)\n    return md\n\n\ndef generate_md_comparativo(data: dict, cfg: dict) -> str:\n    \"\"\"Generate Markdown for Comparativo Multi-Ano tab.\"\"\"\n    _el, _il = _unit_lbl()\n    md = _header_md(\"\ud83d\udd04 An\u00e1lise Comparativa Multi-Ano\", cfg)\n\n    anos = data.get(\"anos\", [])\n    if not anos:\n        md += \"*Sem dados comparativos dispon\u00edveis.*\\n\"\n        md += _footer_md(cfg)\n        return md\n\n    md += f\"**Per\u00edodos comparados:** {', '.join(str(a) for a in sorted(anos))}\\n\\n\"\n\n    # Resumo por ano\n    resumo = data.get(\"resumo\", {})\n    if resumo:\n        md += \"## Resumo por Ano\\n\\n\"\n        headers = [\"Ano\", f\"Emiss\u00e3o Total ({_el})\", \"Unidades\", \"Massa (t)\"]\n        rows = []\n        for ano in sorted(anos):\n            d = resumo.get(ano, {})\n            rows.append([\n                str(ano),\n                f\"{d.get('emissao_total', 0):,.4f}\",\n                d.get(\"total_unidades\", 0),\n                f\"{d.get('massa_total', 0):,.1f}\",\n            ])\n        md += _table_md(headers, rows, [\":-:\", \"-:\", \"-:\", \"-:\"])\n\n    # Deltas\n    deltas = data.get(\"deltas\", [])\n    if deltas:\n        md += \"\\n## Varia\u00e7\u00e3o entre Per\u00edodos\\n\\n\"\n        md += _table_md(\n            [\"De \u2192 Para\", f\"\u03
