    <script type="module">
        import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.89.1/build/stlite.js";

        // Em file:/// (origin null), alguns navegadores bloqueiam pushState/replaceState.
        // Isso evita erro recorrente de "Bad message format" no standalone.
        if (window.location.protocol === "file:" && window.history) {
            const _pushState = window.history.pushState.bind(window.history);
            const _replaceState = window.history.replaceState.bind(window.history);

            // Sempre salva o path no hash — lido pelo Python via js.window.location.hash
            // para restaurar a página ativa após qualquer st.rerun() em file://.
            function _saveNavHash(url) {
                if (!url) return;
                try {
                    var path = String(url).replace(/^\/+/, '');
                    window.location.hash = path;
                } catch (_) {}
            }

            window.history.pushState = function(state, title, url) {
                _saveNavHash(url);
                try { return _pushState(state, title, url); } catch (_) {}
            };

            window.history.replaceState = function(state, title, url) {
                _saveNavHash(url);
                try { return _replaceState(state, title, url); } catch (_) {}
            };
        }
        
        mount({
            requirements: ["pandas", "numpy", "plotly", "openpyxl", "networkx"],
            entrypoint: "app.py",
            files: {"app.py": "\"\"\"\nCalculadora de Emiss\u00f5es CMP - Entrypoint principal\nUsa st.navigation (Streamlit \u2265 1.36) para navega\u00e7\u00e3o program\u00e1tica \u2014\nn\u00e3o depende de uma pasta pages/ e n\u00e3o usa st.switch_page.\n\"\"\"\nimport os\nimport sys\nimport streamlit as st\n\n# \u2500\u2500 path setup \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n_src_dir = os.path.dirname(os.path.abspath(__file__))\n_root_dir = os.path.dirname(_src_dir)\nsys.path.insert(0, _src_dir)\nsys.path.insert(0, _root_dir)\n\n# \u2500\u2500 app utils \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfrom multipage_utils import init_session_state, render_header_bar, render_sidebar_extras\n\n# \u2500\u2500 tab imports \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfrom tabs.Home import HomeTab\nfrom tabs.FluxoPlotly import FluxoTab\nfrom tabs.Unidades import UnidadesTab\nfrom tabs.FatoresEmissao import FatoresEmissaoTab\nfrom tabs.Tecnologias import TecnologiasTab\nfrom tabs.Reports import ReportsTab\nfrom tabs.Sessoes import SessoesTab\nfrom tabs.Settings import SettingsTab\n\n# \u2500\u2500 page config (must be first Streamlit call) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nst.set_page_config(\n    page_title=\"CMP - Calculadora de Emiss\u00f5es\",\n    page_icon=\"\ud83c\udf0d\",\n    layout=\"wide\",\n    initial_sidebar_state=\"expanded\",\n)\n\n# \u2500\u2500 shared state \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ninit_session_state()\n\nusuario_logado = st.session_state.get(\"usuario_logado\", None)\n\n# \u2500\u2500 sidebar: ocultar quando n\u00e3o autenticado \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nif not usuario_logado:\n    st.markdown(\n        \"\"\"\n        <style>\n        [data-testid=\"stSidebar\"],\n        [data-testid=\"collapsedControl\"] { display:none !important; }\n        </style>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n# \u2500\u2500 helpers \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef _is_pyodide() -> bool:\n    \"\"\"Retorna True quando rodando no browser via Pyodide/Stlite (standalone).\"\"\"\n    return \"pyodide\" in sys.modules or \"js\" in sys.modules\n\n# \u2500\u2500 loading screen (disparado logo ap\u00f3s o login) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# No standalone (Pyodide), time.sleep() bloqueia o event-loop do WASM e\n# causa STATUS_STACK_BUFFER_OVERRUN.  A tela \u00e9 cosm\u00e9tica \u2014 pulamos no browser.\nif st.session_state.pop(\"_show_loading\", False) and usuario_logado and not _is_pyodide():\n    import time\n    import streamlit.components.v1 as _cmp\n\n    # Fecha sidebar durante o carregamento\n    st.markdown(\n        \"\"\"\n        <style>\n        [data-testid=\"stSidebar\"],\n        [data-testid=\"collapsedControl\"] { display:none !important; }\n        </style>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n    escaped_user = usuario_logado.replace(\"&\", \"&amp;\").replace(\"<\", \"&lt;\").replace(\">\", \"&gt;\")\n\n    st.markdown(\n        f\"\"\"\n        <div style=\"\n            position:fixed; inset:0; z-index:999999;\n            background:linear-gradient(135deg,#edf0e7 0%,#d6e4da 100%);\n            display:flex; flex-direction:column; align-items:center;\n            justify-content:center; gap:1.4rem;\n            font-family:'Segoe UI',sans-serif;\n        \">\n            <div style=\"font-size:3.5rem; animation:pulse-logo 1.4s ease-in-out infinite;\">\ud83c\udf0d</div>\n            <p style=\"font-size:1.8rem;font-weight:700;color:#4c8061;margin:0;\">\n                Calculadora de Emiss\u00f5es\n            </p>\n            <p style=\"font-size:1rem;color:#6b7280;margin:0;\">\n                Bem-vindo(a), <strong>{escaped_user}</strong>\n            </p>\n            <div style=\"\n                width:min(420px,80vw); background:rgba(76,128,97,0.15);\n                border-radius:999px; height:8px; overflow:hidden;\n            \">\n                <div id=\"_cmp-pbar\" style=\"\n                    height:100%; border-radius:999px; width:0%;\n                    background:linear-gradient(90deg,#4c8061,#6cba89);\n                \"></div>\n            </div>\n            <p id=\"_cmp-step-txt\" style=\"font-size:0.82rem;color:#9ca3af;margin:0;\">\n                Inicializando sess\u00e3o...\n            </p>\n        </div>\n        <style>\n        @keyframes pulse-logo {{\n            0%,100% {{ transform:scale(1); opacity:1; }}\n            50%      {{ transform:scale(1.08); opacity:0.85; }}\n        }}\n        </style>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n    # JS para ciclar o texto de status e animar a barra (iframe same-origin)\n    _cmp.html(\n        \"\"\"\n        <script>\n        (function() {\n            var pd = window.parent.document;\n            var steps = [\n                'Inicializando sess\u00e3o...',\n                'Carregando fatores de emiss\u00e3o...',\n                'Preparando dados do painel...',\n                'Quase pronto!'\n            ];\n            var pcts = [18, 52, 82, 100];\n            var el   = pd.getElementById('_cmp-step-txt');\n            var bar  = pd.getElementById('_cmp-pbar');\n            if (!el || !bar) return;\n            var i = 0;\n            bar.style.transition = 'width 0.5s ease';\n            bar.style.width = pcts[0] + '%';\n            var iv = setInterval(function() {\n                i++;\n                if (i < steps.length) {\n                    el.textContent   = steps[i];\n                    bar.style.width  = pcts[i] + '%';\n                } else {\n                    clearInterval(iv);\n                }\n            }, 550);\n        })();\n        <\\/script>\n        \"\"\",\n        height=0,\n    )\n    time.sleep(1.0)\n    st.rerun()\n# \u2500\u2500 page functions \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef page_home():\n    HomeTab()._render()\n\ndef page_fluxo():\n    if not usuario_logado:\n        HomeTab()._render()\n        return\n    FluxoTab()._render()\n\ndef page_unidades():\n    if not usuario_logado:\n        HomeTab()._render()\n        return\n    UnidadesTab()._render()\n\ndef page_fatores():\n    if not usuario_logado:\n        HomeTab()._render()\n        return\n    FatoresEmissaoTab()._render()\n\ndef page_tecnologias():\n    if not usuario_logado:\n        HomeTab()._render()\n        return\n    TecnologiasTab()._render()\n\ndef page_relatorios():\n    if not usuario_logado:\n        HomeTab()._render()\n        return\n    ReportsTab()._render()\n\ndef page_chatbot():\n    if not usuario_logado:\n        HomeTab()._render()\n        return\n    from tabs.Chatbot import ChatbotTab\n    ChatbotTab()._render()\n\ndef page_sessoes():\n    if not usuario_logado:\n        HomeTab()._render()\n        return\n    SessoesTab()._render()\n\ndef page_configuracoes():\n    if not usuario_logado:\n        HomeTab()._render()\n        return\n    SettingsTab()._render()\n\n# \u2500\u2500 navigation definition \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n_pages_publicas = [\n    st.Page(page_home,          title=\"In\u00edcio\",          default=True),\n    st.Page(page_sessoes,       title=\"Sess\u00f5es\",         url_path=\"sessoes\"),\n    st.Page(page_configuracoes, title=\"Configura\u00e7\u00f5es\",   url_path=\"configuracoes\"),\n]\n\n_pages_autenticadas = [\n    st.Page(page_unidades,    title=\"Unidades & Fluxos\",   url_path=\"unidades\"),\n    st.Page(page_fluxo,       title=\"Diagrama de Fluxo\",   url_path=\"fluxo\"),\n    st.Page(page_fatores,     title=\"Fatores de Emiss\u00e3o\",  url_path=\"fatores\"),\n    st.Page(page_tecnologias, title=\"Tecnologias\",         url_path=\"tecnologias\"),\n    st.Page(page_relatorios,  title=\"An\u00e1lise de Emiss\u00f5es\", url_path=\"relatorios\"),\n]\nif st.session_state.get(\"chatbot_enabled\", False):\n    _pages_autenticadas.append(st.Page(page_chatbot, title=\"Assistente IA\", url_path=\"chatbot\"))\n\nif usuario_logado:\n    nav_pages = {f\"\ud83d\udc64 {usuario_logado}\": _pages_publicas, \"----------------------------------------------\": _pages_autenticadas}\nelse:\n    nav_pages = {\"\": _pages_publicas}\n\n# \u2500\u2500 render navigation & header bar \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\npg = st.navigation(nav_pages, position=\"sidebar\", expanded=True)\n\n# Em Pyodide/standalone (file://), pushState falha e st.navigation() perde\n# o contexto ap\u00f3s qualquer st.rerun(), voltando sempre \u00e0 p\u00e1gina default.\n# O shim JS salva o path no window.location.hash; lemos aqui para restaurar.\n_all_pages = _pages_publicas + (_pages_autenticadas if usuario_logado else [])\n_pages_by_title = {p.title: p for p in _all_pages}\n_url_to_page   = {getattr(p, \"url_path\", None): p for p in _all_pages\n                  if getattr(p, \"url_path\", None)}\n\nif _is_pyodide() and pg.title == \"In\u00edcio\":\n    try:\n        import js as _js  # pyodide only\n        _hash = str(getattr(_js.window.location, \"hash\", \"\") or \"\")\n        _path = _hash.lstrip(\"#/\").split(\"?\")[0].strip()\n        if _path and _path in _url_to_page:\n            pg = _url_to_page[_path]\n    except Exception:\n        pass\n\n# Consumir pedido de navega\u00e7\u00e3o r\u00e1pida (bot\u00f5es da Home)\n_nav_target = st.session_state.pop(\"_nav_target\", None)\nif _nav_target and _nav_target in _pages_by_title:\n    st.switch_page(_pages_by_title[_nav_target])\n\n# Header bar (usu\u00e1rio + auto-save) no canto superior direito\nrender_header_bar(usuario_logado)\n\nwith st.sidebar:\n    render_sidebar_extras(usuario_logado)\n\npg.run()\n", "calculations.py": "from __future__ import annotations\n\nfrom typing import List, Dict, Set, Optional\nfrom database import UnidadeProdutiva\nimport streamlit as st\nfrom core.units import (\n    convert_mass, get_default_mass_unit_from_session,\n    co2e_label, co2e_intensity_label, convert_co2e, normalize_unit,\n)\n\n\nclass EmissionCalculator:\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    #  C\u00c1LCULO POR UNIDADE\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    @staticmethod\n    def calcular_emissoes(unidade: UnidadeProdutiva) -> UnidadeProdutiva:\n        \"\"\"Calcula a intensidade de emiss\u00e3o por escopo e total da unidade.\n\n        Unidades internas (can\u00f4nicas):\n          IntensidadeEmissao*  \u2192  kgCO\u2082e por tonelada de output\n          Pegada*              \u2192  kgCO\u2082e por tonelada de output (lifecycle,\n                                  atualizado depois de propagar_pegada)\n\n        ConsumoEspecifico \u00e9 armazenado em [unid_consum\u00edvel / mass_unit].\n        Escala para tonelada = convert_mass(1 t \u2192 mass_unit) garante que\n        os fatores (kgCO\u2082e/unid_consum\u00edvel) \u00d7 consumo_por_t = kgCO\u2082e/t.\n\n        Nota: o fator de emiss\u00e3o \u00e9 sempre buscado ao vivo no banco de fatores\n        (st.session_state.fatores_emissao) para garantir que altera\u00e7\u00f5es nos\n        fatores se reflitam imediatamente, sem necessidade de re-salvar cada\n        unidade.  O valor armazenado em Consumiveis[].fator serve apenas como\n        fallback quando o consum\u00edvel n\u00e3o \u00e9 encontrado na base atual.\n        \"\"\"\n        intensidade_escopo1 = 0.0\n        intensidade_escopo2 = 0.0\n        intensidade_escopo3 = 0.0\n\n        mass_unit = get_default_mass_unit_from_session(st.session_state)\n        # Quantas [mass_unit] h\u00e1 em 1 tonelada  (ex: kg \u2192 1 000; t \u2192 1; kt \u2192 0,001)\n        escala_para_ton = convert_mass(1.0, \"t\", mass_unit)\n\n        # \u2500\u2500 \u00cdndice ao vivo de fatores de emiss\u00e3o \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n        fatores_db = st.session_state.get(\"fatores_emissao\", [])\n        try:\n            from core.calc.fatores import FatorIndex\n            _fator_idx = FatorIndex(fatores_db) if fatores_db else None\n        except Exception:\n            _fator_idx = None\n\n        try:\n            ano_ref = int(float(str(unidade.Periodo).strip()))\n        except (ValueError, TypeError, AttributeError):\n            ano_ref = None\n\n        if float(getattr(unidade, \"MassaOutput\", 0.0) or 0.0) <= 0:\n            unidade.IntensidadeEmissaoEscopo1 = 0.0\n            unidade.IntensidadeEmissaoEscopo2 = 0.0\n            unidade.IntensidadeEmissaoEscopo3 = 0.0\n            unidade.IntensidadeEmissao = 0.0\n            unidade.PegadaEscopo1 = 0.0\n            unidade.PegadaEscopo2 = 0.0\n            unidade.PegadaEscopo3 = 0.0\n            unidade.Pegada = 0.0\n            return unidade\n\n        entradas = getattr(unidade, \"Inputs\", []) or []\n        consumiveis = list(getattr(unidade, \"Consumiveis\", []) or [])\n        consumo_especifico = list(getattr(unidade, \"ConsumoEspecifico\", []) or [])\n\n        # Prioriza modelo novo (inputs/outputs) quando consum\u00edveis n\u00e3o estiverem alinhados.\n        if (not consumiveis or len(consumiveis) != len(consumo_especifico)) and entradas:\n            massa_output = float(getattr(unidade, \"MassaOutput\", 0.0) or 0.0)\n            consumiveis = []\n            consumo_especifico = []\n            for item in entradas:\n                produto = str(item.get(\"produto_id\", \"\") or \"\").strip()\n                quantidade = float(item.get(\"quantidade\", 0.0) or 0.0)\n                consumiveis.append({\n                    \"nome\": produto,\n                    \"fator\": 0.0,\n                    \"escopo\": \"SCOPE 1\",\n                })\n                # quantidade absoluta -> consumo espec\u00edfico por unidade de output\n                if massa_output > 0:\n                    consumo_especifico.append(quantidade / massa_output)\n                else:\n                    consumo_especifico.append(0.0)\n\n        for c, e in zip(consumiveis, consumo_especifico):\n            nome_consumivel = str(c.get(\"nome\", \"\")).strip()\n            escopo_stored   = str(c.get(\"escopo\", \"SCOPE 1\"))\n\n            # Valor de fallback: fator salvo no consum\u00edvel\n            fator = float(c.get(\"fator\", 0.0))   # kgCO\u2082e / unid_consum\u00edvel\n            escopo = escopo_stored\n\n            # Busca ao vivo: prioriza DB atual sobre valor salvo\n            if _fator_idx and nome_consumivel:\n                # 1) Tenta com o escopo armazenado e o ano exato\n                fator_dict = _fator_idx.get_fator_dict(nome_consumivel, escopo_stored, ano=ano_ref)\n                # 2) Se n\u00e3o encontrou, percorre todos os escopos\n                if fator_dict is None:\n                    for esc_try in [\"1\", \"2\", \"3\"]:\n                        fator_dict = _fator_idx.get_fator_dict(nome_consumivel, esc_try, ano=ano_ref)\n                        if fator_dict is not None:\n                            break\n                if fator_dict is not None:\n                    fator  = float(fator_dict.get(\"fator_emissao\", 0.0))\n                    escopo = str(fator_dict.get(\"escopo\", escopo_stored))\n                elif fator <= 0:\n                    st.warning(\n                        f\"Fator de emiss\u00e3o n\u00e3o encontrado para '{nome_consumivel}' (ano {ano_ref}).\"\n                    )\n\n            consumo_por_ton = float(e) * float(escala_para_ton)  # unid_consum\u00edvel / t\n            emissao = fator * consumo_por_ton                     # kgCO\u2082e / t\n\n            if \"1\" in escopo:\n                intensidade_escopo1 += emissao\n            elif \"2\" in escopo:\n                intensidade_escopo2 += emissao\n            elif \"3\" in escopo:\n                intensidade_escopo3 += emissao\n\n        unidade.IntensidadeEmissaoEscopo1 = intensidade_escopo1\n        unidade.IntensidadeEmissaoEscopo2 = intensidade_escopo2\n        unidade.IntensidadeEmissaoEscopo3 = intensidade_escopo3\n        unidade.IntensidadeEmissao = (\n            intensidade_escopo1 + intensidade_escopo2 + intensidade_escopo3\n        )\n        # Pegada = intensidade pr\u00f3pria; ser\u00e1 sobrescrito por propagar_pegada\n        unidade.Pegada = unidade.IntensidadeEmissao\n        unidade.PegadaEscopo1 = intensidade_escopo1\n        unidade.PegadaEscopo2 = intensidade_escopo2\n        unidade.PegadaEscopo3 = intensidade_escopo3\n        return unidade\n\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    #  PROPAGA\u00c7\u00c3O DE PEGADA NA CADEIA\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    @staticmethod\n    def propagar_pegada(\n        unidades: List[UnidadeProdutiva], conexoes: List[Dict]\n    ) -> List[UnidadeProdutiva]:\n        \"\"\"Propaga a pegada acumulada (kgCO\u2082e/t de output) ao longo da cadeia.\n\n        F\u00f3rmula (lifecycle product carbon footprint):\n            pegada(U) = pr\u00f3pria_intensidade(U)\n                      + \u03a3_pais [ pegada(P) \u00d7 massa(P\u2192U) / MassaOutput(U) ]\n\n        Dividir por MassaOutput(U), e n\u00e3o por MassaInput(U), garante que o\n        resultado seja kgCO\u2082e por tonelada de PRODUTO de U (n\u00e3o de insumo),\n        respeitando perdas de processo.\n        \"\"\"\n        if not unidades:\n            return unidades\n\n        mapa_unidades = {u.ID_ELO: u for u in unidades}\n        grafo: Dict[str, List[str]] = {u.ID_ELO: [] for u in unidades}\n        grau_entrada: Dict[str, int] = {u.ID_ELO: 0 for u in unidades}\n\n        for c in conexoes:\n            src, tgt = c.get(\"source\"), c.get(\"target\")\n            if src in grafo and tgt in grafo:\n                grafo[src].append(tgt)\n                grau_entrada[tgt] += 1\n\n        # Ordena\u00e7\u00e3o topol\u00f3gica (Kahn)\n        fila = [nid for nid, grau in grau_entrada.items() if grau == 0]\n        ordem: List[str] = []\n        while fila:\n            atual = fila.pop(0)\n            ordem.append(atual)\n            for vizinho in grafo.get(atual, []):\n                grau_entrada[vizinho] -= 1\n                if grau_entrada[vizinho] == 0:\n                    fila.append(vizinho)\n\n        # Inicializar todos com intensidade pr\u00f3pria (cobre ciclos/n\u00f3s isolados)\n        for u in unidades:\n            u.PegadaEscopo1 = u.IntensidadeEmissaoEscopo1\n            u.PegadaEscopo2 = u.IntensidadeEmissaoEscopo2\n            u.PegadaEscopo3 = u.IntensidadeEmissaoEscopo3\n            u.Pegada = u.IntensidadeEmissao\n\n        for elo_id in ordem:\n            unidade = mapa_unidades[elo_id]\n            pais_conexoes = [\n                c for c in conexoes\n                if c.get(\"target\") == elo_id and c.get(\"source\") in mapa_unidades\n            ]\n            if not pais_conexoes:\n                # N\u00f3 raiz: pegada = intensidade pr\u00f3pria (j\u00e1 inicializado)\n                continue\n\n            # Denominador: MassaOutput de U (kgCO\u2082e/t de produto final)\n            massa_output_u = float(unidade.MassaOutput or 0.0)\n            if massa_output_u <= 0:\n                # Sem output definido: usar intensidade pr\u00f3pria, sem heran\u00e7a\n                continue\n\n            he1 = he2 = he3 = 0.0\n            for c in pais_conexoes:\n                pai = mapa_unidades[c[\"source\"]]\n                # massa transferida: usa campo \"massa\" do edge; fallback = MassaOutput do pai\n                massa_trf = float(\n                    c.get(\"massa\") or pai.MassaOutput or 0.0\n                )\n                proporcao = massa_trf / massa_output_u\n                he1 += pai.PegadaEscopo1 * proporcao\n                he2 += pai.PegadaEscopo2 * proporcao\n                he3 += pai.PegadaEscopo3 * proporcao\n\n            unidade.PegadaEscopo1 = he1 + unidade.IntensidadeEmissaoEscopo1\n            unidade.PegadaEscopo2 = he2 + unidade.IntensidadeEmissaoEscopo2\n            unidade.PegadaEscopo3 = he3 + unidade.IntensidadeEmissaoEscopo3\n            unidade.Pegada = (\n                unidade.PegadaEscopo1\n                + unidade.PegadaEscopo2\n                + unidade.PegadaEscopo3\n            )\n\n        return list(mapa_unidades.values())\n\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    #  TOTAIS CENTRALIZADOS\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    @staticmethod\n    def calcular_totais(\n        unidades: List[UnidadeProdutiva],\n        ano: Optional[str | int] = None,\n        ids_selecionados: Optional[Set[str]] = None,\n    ) -> Dict:\n        \"\"\"Calcula totais de emiss\u00e3o filtrando por per\u00edodo e/ou sele\u00e7\u00e3o de n\u00f3s.\n\n        Retorna valores em unidades can\u00f4nicas (internas):\n          - emiss\u00f5es : kgCO\u2082e\n          - massa    : toneladas\n          - intensidade: kgCO\u2082e/t\n\n        Args:\n            unidades:         lista de UnidadeProdutiva (j\u00e1 propagadas)\n            ano:              se fornecido, filtra por u.Periodo == str(ano)\n            ids_selecionados: se fornecido e n\u00e3o vazio, filtra por ID_ELO\n\n        Returns:\n            dict com:\n              escopo1, escopo2, escopo3, total             \u2014 emiss\u00f5es pr\u00f3prias (kgCO\u2082e)\n              lifecycle_total                               \u2014 Pegada \u00d7 MassaOutput (kgCO\u2082e)\n              massa_total                                   \u2014 soma de MassaOutput (t)\n              intensidade_media                             \u2014 kgCO\u2082e/t (m\u00e9dia das unidades activas)\n              n_unidades\n        \"\"\"\n        filtradas = list(unidades)\n\n        if ano is not None:\n            ano_str = str(ano)\n            filtradas = [u for u in filtradas if str(u.Periodo) == ano_str]\n\n        if ids_selecionados:\n            filtradas = [u for u in filtradas if u.ID_ELO in ids_selecionados]\n\n        e1 = sum(\n            u.IntensidadeEmissaoEscopo1 * (u.MassaOutput or 0.0) for u in filtradas\n        )\n        e2 = sum(\n            u.IntensidadeEmissaoEscopo2 * (u.MassaOutput or 0.0) for u in filtradas\n        )\n        e3 = sum(\n            u.IntensidadeEmissaoEscopo3 * (u.MassaOutput or 0.0) for u in filtradas\n        )\n        total = e1 + e2 + e3\n        lifecycle = sum(\n            u.Pegada * (u.MassaOutput or 0.0) for u in filtradas\n        )\n        massa_total = sum(u.MassaOutput or 0.0 for u in filtradas)\n        ints = [u.IntensidadeEmissao for u in filtradas if u.IntensidadeEmissao > 0]\n        intensidade_media = sum(ints) / len(ints) if ints else 0.0\n\n        return {\n            \"escopo1\": e1,\n            \"escopo2\": e2,\n            \"escopo3\": e3,\n            \"total\": total,\n            \"lifecycle_total\": lifecycle,\n            \"massa_total\": massa_total,\n            \"intensidade_media\": intensidade_media,\n            \"n_unidades\": len(filtradas),\n        }\n\n    @staticmethod\n    def calcular_totais_display(\n        unidades: List[UnidadeProdutiva],\n        mass_unit: Optional[str] = None,\n        ano: Optional[str | int] = None,\n        ids_selecionados: Optional[Set[str]] = None,\n    ) -> Dict:\n        \"\"\"Como calcular_totais, mas converte para a unidade de exibi\u00e7\u00e3o.\n\n        Chama calcular_totais internamente e aplica convert_co2e / convert_mass\n        aos resultados, devolvendo tamb\u00e9m r\u00f3tulos prontos para UI.\n\n        Returns:\n            dict igual a calcular_totais com valores convertidos, mais:\n              co2e_lbl  \u2014 ex. \"tCO\u2082e\", \"kgCO\u2082e\", \"MtCO\u2082e\"\n              int_lbl   \u2014 ex. \"tCO\u2082e/t\", \"kgCO\u2082e/kg\"\n              mass_unit \u2014 chave normalizada da unidade (ex. \"t\", \"kg\")\n        \"\"\"\n        raw = EmissionCalculator.calcular_totais(\n            unidades, ano=ano, ids_selecionados=ids_selecionados\n        )\n        mu = normalize_unit(mass_unit or \"t\")\n\n        return {\n            \"escopo1\":          convert_co2e(raw[\"escopo1\"], mu),\n            \"escopo2\":          convert_co2e(raw[\"escopo2\"], mu),\n            \"escopo3\":          convert_co2e(raw[\"escopo3\"], mu),\n            \"total\":            convert_co2e(raw[\"total\"], mu),\n            \"lifecycle_total\":  convert_co2e(raw[\"lifecycle_total\"], mu),\n            \"massa_total\":      convert_mass(raw[\"massa_total\"], \"t\", mu),\n            \"intensidade_media\":convert_co2e(raw[\"intensidade_media\"], mu),\n            \"n_unidades\":       raw[\"n_unidades\"],\n            # r\u00f3tulos prontos para UI\n            \"co2e_lbl\":  co2e_label(mu),\n            \"int_lbl\":   co2e_intensity_label(mu),\n            \"mass_unit\": mu,\n        }\n\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    #  HELPERS LEGADOS (mantidos por compatibilidade)\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    @staticmethod\n    def calcular_pegada_total(unidades: List[UnidadeProdutiva]) -> float:\n        \"\"\"Pegada acumulada total em kgCO\u2082e (Pegada [kgCO\u2082e/t] \u00d7 MassaOutput [t]).\"\"\"\n        return sum(\n            u.Pegada * (u.MassaOutput or 0.0) for u in unidades\n        )\n\n    @staticmethod\n    def calcular_emissoes_por_localizacao(unidades: List[UnidadeProdutiva]) -> Dict:\n        \"\"\"Emiss\u00f5es pr\u00f3prias totais (kgCO\u2082e) agrupadas por localiza\u00e7\u00e3o.\"\"\"\n        emissoes: Dict[str, float] = {}\n        for u in unidades:\n            loc = u.Localizacao or \"Sem local\"\n            emissoes[loc] = (\n                emissoes.get(loc, 0.0)\n                + u.IntensidadeEmissao * (u.MassaOutput or 0.0)\n            )\n        return emissoes\n\n    @staticmethod\n    def gerar_dados_grafico(unidades: List[UnidadeProdutiva]) -> Dict:\n        return {\n            \"labels\":   [u.ID_ELO for u in unidades],\n            \"emissoes\": [\n                u.IntensidadeEmissao * (u.MassaOutput or 0.0) for u in unidades\n            ],\n        }\n\n    @staticmethod\n    def determinar_ordem_fluxo(unidades, conexoes):\n        \"\"\"Ordena\u00e7\u00e3o topol\u00f3gica das unidades segundo o grafo de fluxo.\"\"\"\n        grafo = {u.ID_ELO: [] for u in unidades}\n        grau_entrada = {u.ID_ELO: 0 for u in unidades}\n        for conexao in conexoes:\n            grafo[conexao[\"source\"]].append(conexao[\"target\"])\n            grau_entrada[conexao[\"target\"]] += 1\n        fila = [n for n in grafo if grau_entrada[n] == 0]\n        ordem = []\n        while fila:\n            node = fila.pop(0)\n            ordem.append(node)\n            for viz in grafo[node]:\n                grau_entrada[viz] -= 1\n                if grau_entrada[viz] == 0:\n                    fila.append(viz)\n        return ordem", "config.py": "CANVAS_CONFIG = {\n    \"width\": 1920,  # voc\u00ea pode ajustar conforme necess\u00e1rio\n    \"height\": 1080,\n    \"directed\": True,\n    \"node\": {\n        \"labelProperty\": \"label\",\n        \"shape\": \"box\",\n        \"font\": {\"size\": 12, \"align\": \"left\"},\n        \"margin\": 10,\n        \"borderWidth\": 2,\n        \"color\": \"#e6f3ff\"\n    },\n    \"link\": {\"renderLabel\": True},\n    \"physics\": {\"enabled\": True},\n    \"backgroundColor\": \"#ffffff\",  # fundo branco\n    \"border\": \"2px solid #333333\"  # borda ao redor do canvas\n}\n\n\nCOLORS = {\n    \"primary\": \"#0066cc\",\n    \"background\": \"#f8f9fa\",\n    \"tax_border\": \"#cc0000\",\n    \"default_border\": \"#333333\"\n}\n\n# Adicionar estilos para a se\u00e7\u00e3o de import/export\nEXPORT_STYLES = {\n    \"button\": {\n        \"background\": \"#4CAF50\",\n        \"color\": \"white\"\n    },\n    \"warning\": {\n        \"background\": \"#FFF3CD\",\n        \"color\": \"#856404\"\n    }\n}\n\nFLOWCHART_LAYOUTS = {\n    \"Hier\u00e1rquico\": {\n        \"hierarchical\": {\n            \"enabled\": True,\n            \"direction\": \"LR\",  # Left-to-Right\n            \"sortMethod\": \"directed\",\n            \"nodeSpacing\": 300,\n            \"levelSeparation\": 180\n        }\n    },\n    \"Ordenado por Fluxo\": {\n        \"hierarchical\": {\n            \"enabled\": True,\n            \"direction\": \"LR\",\n            \"sortMethod\": \"hubsize\",\n            \"nodeSpacing\": 200\n        }\n    },\n    \"Circular\": {\n        \"layout\": {\n            \"randomSeed\": 42,\n            \"improvedLayout\": True\n        }\n    }\n}", "database.py": "from __future__ import annotations\n\nimport streamlit as st\nimport json\nimport re\nfrom typing import List, Dict, Optional, Any\nimport pandas as pd\n#from database import Tecnologia\nfrom dataclasses import dataclass, asdict, field\nfrom core.units import (\n    co2e_label, co2e_intensity_label, convert_co2e,\n    get_default_mass_unit_from_session,\n)\n\n\ndef _parse_ano_periodo_db(periodo) -> Optional[int]:\n    \"\"\"Converte string de per\u00edodo em inteiro de ano (None se inv\u00e1lido).\"\"\"\n    try:\n        return int(float(str(periodo).strip()))\n    except (ValueError, TypeError):\n        return None\n\n\ndef _rebuild_consumiveis_from_tech(tecnologia, fatores_emissao: list, ano_ref: Optional[int]):\n    \"\"\"Re-constr\u00f3i Consumiveis e ConsumoEspecifico a partir dos insumos da tecnologia.\n\n    Faz busca ao vivo no banco de fatores para garantir que o nome do consum\u00edvel\n    e o fator de emiss\u00e3o est\u00e3o sempre atualizados, independentemente do que estava\n    salvo nos dados da sess\u00e3o anterior.\n\n    Returns:\n        tuple: (consumiveis: list[dict], consumo_especifico: list[float])\n    \"\"\"\n    consumiveis: List[dict] = []\n    consumo_especifico: List[float] = []\n\n    if not tecnologia or not getattr(tecnologia, \"insumos\", None):\n        return consumiveis, consumo_especifico\n\n    try:\n        from core.calc.fatores import FatorIndex\n        idx = FatorIndex(fatores_emissao) if fatores_emissao else None\n    except Exception:\n        idx = None\n\n    for insumo in tecnologia.insumos:\n        nome = str(insumo.get(\"nome\", \"\")).strip()\n        fator_consumo = float(insumo.get(\"fator_consumo\", 0.0))\n\n        fator_emissao = 0.0\n        escopo = \"SCOPE 1\"  # default\n\n        if idx and nome:\n            fator_dict = None\n            # Busca por escopo espec\u00edfico + ano\n            for esc_try in [\"1\", \"2\", \"3\"]:\n                fator_dict = idx.get_fator_dict(nome, esc_try, ano=ano_ref)\n                if fator_dict is not None:\n                    break\n            # Fallback: busca global (sem ano)\n            if fator_dict is None:\n                for esc_try in [\"1\", \"2\", \"3\"]:\n                    fator_dict = idx.get_fator_dict(nome, esc_try, ano=None)\n                    if fator_dict is not None:\n                        break\n            if fator_dict is not None:\n                fator_emissao = float(fator_dict.get(\"fator_emissao\", 0.0))\n                escopo = str(fator_dict.get(\"escopo\", \"SCOPE 1\"))\n\n        consumiveis.append({\n            \"nome\": nome,\n            \"fator\": fator_emissao,\n            \"escopo\": escopo,\n        })\n        consumo_especifico.append(fator_consumo)\n\n    return consumiveis, consumo_especifico\n\n@dataclass\nclass Conexao:\n    \"\"\"Classe que representa uma conex\u00e3o entre unidades produtivas\"\"\"\n    origem: str\n    destino: str\n    id: str = \"\"\n    massa: float = 0.0  # Massa transferida na conex\u00e3o\n    label: str = \"Fluxo\"\n    periodo: str = \"\"   # Per\u00edodo/ano da conex\u00e3o\n\n    def to_dict(self):\n        return asdict(self)\n\n@dataclass\nclass Tecnologia:\n    \"\"\"Classe que representa uma tecnologia alternativa\"\"\"\n    id: str\n    nome: str\n    insumos: List[Dict[str, float]]  # [{\"nome\": str, \"fator_consumo\": float}]\n    unidades: List[Dict[str, Any]] = field(default_factory=list)\n    # [{\"unidade\": str, \"limite_inferior\": float, \"limite_superior\": float}]\n\n    def to_dict(self) -> Dict[str, Any]:\n        return {\n            \"id\": self.id,\n            \"nome\": self.nome,\n            \"insumos\": self.insumos,\n            \"unidades\": self.unidades\n        }\n\n    @staticmethod\n    def from_dict(data: Dict[str, Any]) -> \"Tecnologia\":\n        return Tecnologia(\n            id=data.get(\"id\", \"\"),\n            nome=data.get(\"nome\", \"\"),\n            insumos=data.get(\"insumos\", []),\n            unidades=data.get(\"unidades\", [])\n        )\n\nclass UnidadeProdutiva:\n    @staticmethod\n    def _normalize_io_list(items: Any) -> List[Dict[str, Any]]:\n        \"\"\"Normaliza lista de entradas/sa\u00eddas para o formato can\u00f4nico.\"\"\"\n        normalized: List[Dict[str, Any]] = []\n        if not isinstance(items, list):\n            return normalized\n\n        for raw in items:\n            if not isinstance(raw, dict):\n                continue\n            produto_id = str(raw.get(\"produto_id\", raw.get(\"produto\", \"\")) or \"\").strip()\n            unidade = str(raw.get(\"unidade\", \"t\") or \"t\").strip() or \"t\"\n            try:\n                quantidade = float(raw.get(\"quantidade\", 0.0) or 0.0)\n            except (TypeError, ValueError):\n                quantidade = 0.0\n            normalized.append(\n                {\n                    \"produto_id\": produto_id,\n                    \"quantidade\": quantidade,\n                    \"unidade\": unidade,\n                }\n            )\n        return normalized\n\n    def __init__(self, id_elo: str, nome: str, localizacao: str, periodo: str, \n                input_insumo: str, massa_input: float,\n                output_insumo: str, massa_output: float,\n                consumiveis: list[dict], consumo_especifico: list[float],\n                inputs: Optional[List[Dict[str, Any]]] = None,\n                outputs: Optional[List[Dict[str, Any]]] = None,\n                taxacao_fronteira: bool = False, taxacao_local: bool = False,\n                tecnologia=None, conexao: 'Conexao' = None):  # novo par\u00e2metro\n        \n        self.ID_ELO = id_elo\n        self.Nome = nome\n        self.Localizacao = localizacao\n        self.Periodo = periodo\n\n        if inputs is None:\n            inputs = [\n                {\n                    \"produto_id\": str(input_insumo or \"\").strip(),\n                    \"quantidade\": float(massa_input or 0.0),\n                    \"unidade\": \"t\",\n                }\n            ]\n        if outputs is None:\n            outputs = [\n                {\n                    \"produto_id\": str(output_insumo or \"\").strip(),\n                    \"quantidade\": float(massa_output or 0.0),\n                    \"unidade\": \"t\",\n                }\n            ]\n\n        self.Inputs = self._normalize_io_list(inputs)\n        self.Outputs = self._normalize_io_list(outputs)\n\n        # Campos legados permanecem para retrocompatibilidade com partes da UI.\n        self.Input = str(input_insumo or \"\").strip()\n        self.Output = str(output_insumo or \"\").strip()\n        self.MassaInput = float(massa_input or 0.0)\n        self.MassaOutput = float(massa_output or 0.0)\n        self.sync_legacy_fields_from_lists()\n\n        self.Consumiveis = consumiveis\n        self.ConsumoEspecifico = consumo_especifico\n\n        self.TaxacaoFronteira = taxacao_fronteira\n        self.TaxacaoLocal = taxacao_local\n\n        # Valores calculados\n        self.IntensidadeEmissaoEscopo1 = 0.0\n        self.IntensidadeEmissaoEscopo2 = 0.0\n        self.IntensidadeEmissaoEscopo3 = 0.0\n        self.IntensidadeEmissao = 0.0\n\n        self.PegadaEscopo1 = 0.0\n        self.PegadaEscopo2 = 0.0\n        self.PegadaEscopo3 = 0.0\n        self.Pegada = 0.0\n\n        # Propriedades adicionais\n        self.Tecnologia = tecnologia\n        self.Conexao = conexao  # Inst\u00e2ncia de Conexao que sai desta unidade\n\n    def sync_legacy_fields_from_lists(self) -> None:\n        \"\"\"Sincroniza campos legados (Input/Output/Massa*) a partir de Inputs/Outputs.\"\"\"\n        if self.Inputs:\n            first_input = self.Inputs[0]\n            self.Input = str(first_input.get(\"produto_id\", \"\") or \"\")\n            self.MassaInput = float(sum(float(i.get(\"quantidade\", 0.0) or 0.0) for i in self.Inputs))\n        if self.Outputs:\n            first_output = self.Outputs[0]\n            self.Output = str(first_output.get(\"produto_id\", \"\") or \"\")\n            self.MassaOutput = float(sum(float(o.get(\"quantidade\", 0.0) or 0.0) for o in self.Outputs))\n\n    def to_dict(self):\n        # Converter Tecnologia para ID se for um objeto\n        tecnologia_valor = None\n        if self.Tecnologia:\n            if isinstance(self.Tecnologia, Tecnologia):\n                tecnologia_valor = self.Tecnologia.id\n            else:\n                tecnologia_valor = self.Tecnologia\n        \n        # Converter Conexao para dict se existir\n        conexao_valor = None\n        if hasattr(self, 'Conexao') and self.Conexao:\n            if isinstance(self.Conexao, Conexao):\n                conexao_valor = self.Conexao.to_dict()\n            else:\n                conexao_valor = self.Conexao\n        \n        return {\n            \"ID_ELO\": self.ID_ELO,\n            \"Nome\": self.Nome,\n            \"Localizacao\": self.Localizacao,\n            \"Periodo\": self.Periodo,\n            \"Input\": self.Input,\n            \"MassaInput\": self.MassaInput,\n            \"Output\": self.Output,\n            \"MassaOutput\": self.MassaOutput,\n            \"inputs\": self.Inputs,\n            \"outputs\": self.Outputs,\n            \"Consumiveis\": self.Consumiveis,\n            \"ConsumoEspecifico\": self.ConsumoEspecifico,\n            \"IntensidadeEmissao\": self.IntensidadeEmissao,\n            \"IntensidadeEmissaoEscopo1\": self.IntensidadeEmissaoEscopo1,\n            \"IntensidadeEmissaoEscopo2\": self.IntensidadeEmissaoEscopo2,\n            \"IntensidadeEmissaoEscopo3\": self.IntensidadeEmissaoEscopo3,\n            \"Pegada\": self.Pegada,\n            \"PegadaEscopo1\": self.PegadaEscopo1,\n            \"PegadaEscopo2\": self.PegadaEscopo2,\n            \"PegadaEscopo3\": self.PegadaEscopo3,\n            \"TaxacaoFronteira\": self.TaxacaoFronteira,\n            \"TaxacaoLocal\": self.TaxacaoLocal,\n            \"Tecnologia\": tecnologia_valor,\n            \"ConfigOperacional\": getattr(self, \"ConfigOperacional\", \"Padr\u00e3o\"),\n            \"Conexao\": conexao_valor\n        }\n\n\nclass DatabaseManager:\n    def __init__(self):\n        self._init_session_data()\n    \n    def _init_session_data(self):\n        if \"unidades\" not in st.session_state:\n            st.session_state.unidades = []\n        if \"conexoes\" not in st.session_state:\n            st.session_state.conexoes = []\n\n    @staticmethod\n    def _next_sequential_id(prefix: str, existing_ids: List[str], width: int = 3) -> str:\n        pattern = re.compile(rf\"^{re.escape(prefix)}(\\d+)$\", re.IGNORECASE)\n        used = set()\n        max_num = -1\n\n        for raw in existing_ids:\n            sid = str(raw or \"\").strip()\n            if not sid:\n                continue\n            used.add(sid.upper())\n            match = pattern.match(sid)\n            if not match:\n                continue\n            try:\n                num = int(match.group(1))\n                if num > max_num:\n                    max_num = num\n            except ValueError:\n                continue\n\n        next_num = max_num + 1\n        candidate = f\"{prefix}{next_num:0{width}d}\"\n        while candidate.upper() in used:\n            next_num += 1\n            candidate = f\"{prefix}{next_num:0{width}d}\"\n        return candidate\n\n    def next_unidade_id(self) -> str:\n        ids = [getattr(u, \"ID_ELO\", \"\") for u in st.session_state.get(\"unidades\", [])]\n        return self._next_sequential_id(\"E\", ids)\n\n    def next_tecnologia_id(self) -> str:\n        ids = []\n        for t in st.session_state.get(\"tecnologias_alternativas\", []):\n            if hasattr(t, \"id\"):\n                ids.append(getattr(t, \"id\", \"\"))\n            elif isinstance(t, dict):\n                ids.append(t.get(\"id\", \"\"))\n        return self._next_sequential_id(\"T\", ids)\n\n    def next_fluxo_id(self) -> str:\n        ids = []\n        for c in st.session_state.get(\"conexoes\", []):\n            if hasattr(c, \"id\"):\n                ids.append(getattr(c, \"id\", \"\"))\n            elif isinstance(c, dict):\n                ids.append(c.get(\"id\", \"\"))\n        return self._next_sequential_id(\"F\", ids)\n\n    # --- Unidades ---\n    def add_unidade(self, unidade: UnidadeProdutiva) -> None:\n        if not any(u.ID_ELO == unidade.ID_ELO for u in st.session_state.unidades):\n            st.session_state.unidades.append(unidade)\n    \n    def remove_unidade(self, id_elo: str) -> None:\n        st.session_state.unidades = [u for u in st.session_state.unidades if u.ID_ELO != id_elo]\n        self._remove_connections_with_node(id_elo)\n    \n    def get_unidades(self) -> List[UnidadeProdutiva]:\n        return st.session_state.unidades\n    \n    def get_unidade_by_id(self, id_elo: str) -> UnidadeProdutiva:\n        return next((u for u in st.session_state.unidades if u.ID_ELO == id_elo), None)\n\n    # --- Conex\u00f5es ---\n    def add_edge(self, origem: str, destino: str, massa: float = 0.0, periodo: str = \"\", label: str = \"Fluxo\", id_fluxo: str = \"\") -> Optional[Conexao]:\n        if not any(c.origem == origem and c.destino == destino and c.periodo == periodo for c in st.session_state.conexoes):\n            fluxo_id = str(id_fluxo or \"\").strip() or self.next_fluxo_id()\n            conexao = Conexao(id=fluxo_id, origem=origem, destino=destino, massa=massa, label=label, periodo=periodo)\n            st.session_state.conexoes.append(conexao)\n            return conexao\n        return None\n    \n    def remove_edge(self, origem: str, destino: str) -> None:\n        st.session_state.conexoes = [\n            c for c in st.session_state.conexoes if not (c.origem == origem and c.destino == destino)\n        ]\n    \n    def get_conexoes(self) -> List[Conexao]:\n        return st.session_state.conexoes\n    \n    def _remove_connections_with_node(self, node_id: str) -> None:\n        st.session_state.conexoes = [\n            c for c in st.session_state.conexoes if c.origem != node_id and c.destino != node_id\n        ]\n\n    # --- Visualiza\u00e7\u00e3o ---\n    def get_unidades_df(self) -> pd.DataFrame:\n        _mu = get_default_mass_unit_from_session(st.session_state)\n        _lbl = co2e_label(_mu)\n        _int_lbl = co2e_intensity_label(_mu)\n        dados = []\n        for unidade in st.session_state.unidades:\n            dados.append({\n                \"ID ELO\": unidade.ID_ELO,\n                \"Nome\": unidade.Nome,\n                \"Localiza\u00e7\u00e3o\": unidade.Localizacao,\n                \"Per\u00edodo\": unidade.Periodo,\n                \"Input\": unidade.Input,\n                \"Output\": unidade.Output,\n                f\"Emiss\u00e3o ({_lbl})\": f\"{convert_co2e(unidade.IntensidadeEmissao * unidade.MassaOutput, _mu):,.2f}\",\n                f\"Intensidade ({_int_lbl})\": f\"{convert_co2e(unidade.IntensidadeEmissao, 't'):,.2f}\",\n                \"Int. Escopo 1\": f\"{convert_co2e(unidade.IntensidadeEmissaoEscopo1, 't'):,.2f}\",\n                \"Int. Escopo 2\": f\"{convert_co2e(unidade.IntensidadeEmissaoEscopo2, 't'):,.2f}\",\n                \"Int. Escopo 3\": f\"{convert_co2e(unidade.IntensidadeEmissaoEscopo3, 't'):,.2f}\",\n                f\"Pegada ({_int_lbl})\": f\"{convert_co2e(unidade.Pegada, 't'):,.2f}\",\n                \"Pegada Escopo 1\": f\"{unidade.PegadaEscopo1:.2f}\",\n                \"Pegada Escopo 2\": f\"{unidade.PegadaEscopo2:.2f}\",\n                \"Pegada Escopo 3\": f\"{unidade.PegadaEscopo3:.2f}\",\n                \"Tax. Fronteira\": \"\u2705\" if unidade.TaxacaoFronteira else \"\u274c\",\n                \"Tax. Local\": \"\u2705\" if unidade.TaxacaoLocal else \"\u274c\"\n            })\n        return pd.DataFrame(dados)\n    \n    def get_estatisticas(self) -> Dict:\n        _mu = get_default_mass_unit_from_session(st.session_state)\n        raw_total = sum(u.IntensidadeEmissao * u.MassaOutput for u in st.session_state.unidades)\n        return {\n            \"total_unidades\": len(st.session_state.unidades),\n            \"total_conexoes\": len(st.session_state.conexoes),\n            \"emissao_total\": convert_co2e(raw_total, _mu),\n        }\n\n    def export_to_json(self):\n        data = {\n            \"unidades\": [u.to_dict() if hasattr(u, \"to_dict\") else vars(u) for u in st.session_state.unidades],\n            \"conexoes\": [c.to_dict() if hasattr(c, \"to_dict\") else vars(c) for c in st.session_state.get(\"conexoes\", [])],\n            \"tecnologias_alternativas\": [\n                t.to_dict() if hasattr(t, \"to_dict\") else t\n                for t in st.session_state.get(\"tecnologias_alternativas\", [])\n            ]\n        }\n        return json.dumps(data, indent=2, ensure_ascii=False)\n\n    def import_from_json(self, json_str: str) -> bool:\n        from calculations import EmissionCalculator\n        try:\n            data = json.loads(json_str)\n            \n            # Primeiro, processar tecnologias\n            fatores_emissao = st.session_state.get(\"fatores_emissao\", [])\n            insumos_disponiveis = {f[\"consumivel\"] for f in fatores_emissao}\n            insumos_faltando = set()\n\n            tecnologias_raw = data.get(\"tecnologias_alternativas\")\n            if tecnologias_raw is None:\n                tecnologias_raw = data.get(\"tecnologias\", [])\n            tecnologias_obj = []\n            tecnologias_map = {}  # Mapa ID -> objeto Tecnologia\n\n            for t in tecnologias_raw:\n                tec_id = str(t.get(\"id\", \"\")).strip()\n                tec_nome = str(t.get(\"nome\", \"\")).strip()\n                if not tec_id or not tec_nome:\n                    continue\n\n                insumos = []\n                for i in t.get(\"insumos\", []):\n                    nome = i.get(\"nome\")\n                    if not nome:\n                        continue\n                    if nome not in insumos_disponiveis:\n                        insumos_faltando.add(nome)\n                        insumos.append({\"nome\": nome, \"fator_consumo\": 0.0})\n                    else:\n                        insumos.append({\n                            \"nome\": nome,\n                            \"fator_consumo\": i.get(\"fator_consumo\", 1.0),\n                        })\n                \n                tecnologia = Tecnologia(\n                    id=tec_id,\n                    nome=tec_nome,\n                    insumos=insumos,\n                    unidades=t.get(\"unidades\", [])\n                )\n                tecnologias_obj.append(tecnologia)\n                tecnologias_map[tec_id] = tecnologia\n\n            st.session_state.tecnologias_alternativas = tecnologias_obj\n\n            if insumos_faltando:\n                st.warning(\n                    f\"Insumos usados em tecnologias sem fator de emiss\u00e3o registrado: {', '.join(sorted(insumos_faltando))}. \"\n                    f\"O fator foi considerado como 0.0 para evitar erros.\"\n                )\n            \n            # Agora processar unidades\n            st.session_state.unidades = []\n            st.session_state.conexoes = []\n\n            for u_data in data.get(\"unidades\", []):\n                # Buscar tecnologia se existir\n                tecnologia_id = u_data.get(\"Tecnologia\")\n                tecnologia = tecnologias_map.get(tecnologia_id) if tecnologia_id else None\n                \n                # Reconstruir conex\u00e3o se existir\n                conexao = None\n                conexao_data = u_data.get(\"Conexao\")\n                if conexao_data:\n                    conexao = Conexao(\n                        id=conexao_data.get(\"id\", \"\"),\n                        origem=conexao_data.get(\"origem\"),\n                        destino=conexao_data.get(\"destino\"),\n                        massa=conexao_data.get(\"massa\", 0.0),\n                        label=conexao_data.get(\"label\", \"Fluxo\"),\n                        periodo=conexao_data.get(\"periodo\", \"\"),\n                    )\n\n                # \u2500\u2500 Re-construir Consumiveis a partir da tecnologia (corrige nomes/fatores desatualizados) \u2500\u2500\n                ano_ref_u = _parse_ano_periodo_db(u_data.get(\"Periodo\"))\n                if tecnologia and getattr(tecnologia, \"insumos\", None):\n                    consumiveis_u, consumo_especifico_u = _rebuild_consumiveis_from_tech(\n                        tecnologia, fatores_emissao, ano_ref_u\n                    )\n                    # Preserva ConsumoEspecifico salvo se a tecnologia n\u00e3o redefine os valores\n                    # (usu\u00e1rio pode ter ajustado os valores manualmente)\n                    ce_saved = u_data.get(\"ConsumoEspecifico\", [])\n                    if len(ce_saved) == len(consumiveis_u):\n                        consumo_especifico_u = ce_saved\n                else:\n                    consumiveis_u = u_data.get(\"Consumiveis\", [])\n                    consumo_especifico_u = u_data.get(\"ConsumoEspecifico\", [])\n\n                inputs_u = UnidadeProdutiva._normalize_io_list(u_data.get(\"inputs\", []))\n                outputs_u = UnidadeProdutiva._normalize_io_list(u_data.get(\"outputs\", []))\n\n                # Compatibilidade com legado (input/output \u00fanicos)\n                if not inputs_u:\n                    inputs_u = UnidadeProdutiva._normalize_io_list(\n                        [\n                            {\n                                \"produto_id\": u_data.get(\"Input\", \"\"),\n                                \"quantidade\": u_data.get(\"MassaInput\", 0.0),\n                                \"unidade\": \"t\",\n                            }\n                        ]\n                    )\n                if not outputs_u:\n                    outputs_u = UnidadeProdutiva._normalize_io_list(\n                        [\n                            {\n                                \"produto_id\": u_data.get(\"Output\", \"\"),\n                                \"quantidade\": u_data.get(\"MassaOutput\", 0.0),\n                                \"unidade\": \"t\",\n                            }\n                        ]\n                    )\n\n                unidade = UnidadeProdutiva(\n                    id_elo=u_data[\"ID_ELO\"],\n                    nome=u_data[\"Nome\"],\n                    localizacao=u_data[\"Localizacao\"],\n                    periodo=u_data[\"Periodo\"],\n                    input_insumo=u_data[\"Input\"],\n                    massa_input=u_data.get(\"MassaInput\", 0.0),\n                    output_insumo=u_data[\"Output\"],\n                    massa_output=u_data.get(\"MassaOutput\", 0.0),\n                    consumiveis=consumiveis_u,\n                    consumo_especifico=consumo_especifico_u,\n                    inputs=inputs_u,\n                    outputs=outputs_u,\n                    taxacao_fronteira=u_data.get(\"TaxacaoFronteira\", False),\n                    taxacao_local=u_data.get(\"TaxacaoLocal\", False),\n                    tecnologia=tecnologia,\n                    conexao=conexao\n                )\n\n                # Recalcula emiss\u00f5es com consum\u00edveis e fatores atualizados\n                # (n\u00e3o restaura valores salvos \u2014 garante consist\u00eancia com o banco atual)\n                EmissionCalculator.calcular_emissoes(unidade)\n\n                st.session_state.unidades.append(unidade)\n                \n                # Se a unidade tem uma conex\u00e3o, adicionar ao session_state.conexoes\n                if conexao:\n                    self.add_edge(\n                        conexao.origem,\n                        conexao.destino,\n                        massa=conexao.massa,\n                        periodo=conexao.periodo,\n                        label=conexao.label,\n                        id_fluxo=conexao.id,\n                    )\n\n            for c_data in data.get(\"conexoes\", []):\n                self.add_edge(\n                    c_data[\"origem\"],\n                    c_data[\"destino\"],\n                    massa=c_data.get(\"massa\", 0.0),\n                    periodo=c_data.get(\"periodo\", \"\"),\n                    label=c_data.get(\"label\", \"Fluxo\"),\n                    id_fluxo=c_data.get(\"id\", \"\"),\n                )\n            \n            # Propagar a pegada ap\u00f3s importar\n            self.propagar_pegada()\n\n            return True\n        except Exception as e:\n            st.error(f\"Erro ao importar dados: {str(e)}\")\n            return False\n\n    def get_edges_for_graph(self) -> List[Dict]:\n        return [\n            {\n                \"id\": getattr(c, \"id\", \"\"),\n                \"source\": c.origem,\n                \"target\": c.destino,\n                \"massa\": c.massa,\n                \"label\": getattr(c, \"label\", \"Fluxo\"),\n                \"periodo\": c.periodo,\n            }\n            for c in st.session_state.conexoes\n        ]\n\n    # --- Atualiza\u00e7\u00e3o de Pegadas ---\n    def propagar_pegada(self):\n        \"\"\"Atualiza a pegada de todas as unidades com base nas conex\u00f5es\"\"\"\n        from calculations import EmissionCalculator\n        EmissionCalculator.propagar_pegada(\n            st.session_state.unidades,\n            self.get_edges_for_graph()\n        )\n", "multipage_utils.py": "\"\"\"\nUtilit\u00e1rios compartilhados entre todas as p\u00e1ginas da aplica\u00e7\u00e3o.\n\nN\u00e3o cont\u00e9m l\u00f3gica de navega\u00e7\u00e3o (st.switch_page / PAGE_PATHS) \u2014 a navega\u00e7\u00e3o\n\u00e9 gerenciada inteiramente pelo st.navigation em app.py.\n\"\"\"\nimport json\nimport os\nimport sys\nimport time\nfrom typing import Any, MutableMapping, Optional\nimport streamlit as st\n\n_src_dir = os.path.dirname(os.path.abspath(__file__))\n_root_dir = os.path.dirname(_src_dir)\nsys.path.insert(0, _src_dir)\nsys.path.insert(0, _root_dir)\n\nfrom database import DatabaseManager\nfrom core.context import AppContext\nfrom core.io.json_io import load_fatores_emissao\nfrom core.io.local_storage import ls_save, ls_load\n\n\n@st.cache_resource\ndef _load_fatores_cached(path: str) -> list:\n    \"\"\"Carrega fatores de emiss\u00e3o uma \u00fanica vez e compartilha entre todas as sess\u00f5es.\n\n    Usando cache_resource, o JSON \u00e9 lido do disco apenas uma vez por processo\n    (ou por recarregamento do servidor). Evita duplicar ~14 KB de objetos JSON\n    em mem\u00f3ria para cada sess\u00e3o ativa, o que \u00e9 cr\u00edtico no ambiente WASM/Pyodide\n    onde a heap \u00e9 compartilhada.\n    \"\"\"\n    return load_fatores_emissao(path) or []\n\n\n# \u2500\u2500 Session state \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef _auto_restore_session(session_state: Optional[MutableMapping[str, Any]] = None) -> None:\n    \"\"\"Restaura automaticamente a sess\u00e3o salva do usu\u00e1rio no primeiro rerun ap\u00f3s o login.\n\n    Tenta restaurar na seguinte ordem de prioridade:\n      1. data/user_sessions.json (modo servidor/desktop)\n      2. localStorage do browser via m\u00f3dulo local_storage (modo standalone/Pyodide)\n\n    O flag 'sessao_restaurada' evita que a restaura\u00e7\u00e3o seja disparada mais de\n    uma vez por sess\u00e3o de browser.\n    \"\"\"\n    state = session_state if session_state is not None else st.session_state\n\n    usuario = state.get(\"usuario_logado\")\n    if not usuario:\n        return\n    if state.get(\"sessao_restaurada\"):\n        return\n\n    # Marca imediatamente para evitar re-entrada em caso de erro\n    state[\"sessao_restaurada\"] = True\n\n    sessao_data = None\n\n    # Prioridade 1: arquivo JSON no sistema de arquivos\n    sessions_file = os.path.join(_root_dir, \"data\", \"user_sessions.json\")\n    if os.path.exists(sessions_file):\n        try:\n            with open(sessions_file, \"r\", encoding=\"utf-8\") as f:\n                all_sessions = json.load(f)\n            sessao_data = all_sessions.get(usuario)\n        except Exception:\n            pass\n\n    # Prioridade 2: localStorage do browser (standalone/Pyodide)\n    if not sessao_data:\n        try:\n            from core.io.local_storage import ls_load, ls_session_key\n            sessao_data = ls_load(ls_session_key(usuario))\n        except Exception:\n            pass\n\n    if not sessao_data:\n        return\n\n    try:\n        from tabs.Settings import SettingsTab  # importa\u00e7\u00e3o local \u2014 evita ciclo\n        from core.units import normalize_unit\n        SettingsTab()._importar_sessao(sessao_data)\n        \n        # Refor\u00e7o extra: garanta que mass_unit foi restaurado mesmo se houver falha parcial\n        if \"mass_unit\" in sessao_data:\n            state[\"mass_unit\"] = normalize_unit(sessao_data[\"mass_unit\"])\n    except Exception as e:\n        st.warning(f\"\u26a0\ufe0f N\u00e3o foi poss\u00edvel restaurar a sess\u00e3o anterior: {e}\")\n\n\ndef init_session_state(\n    session_state: Optional[MutableMapping[str, Any]] = None,\n    db: Optional[DatabaseManager] = None,\n    context: Optional[AppContext] = None,\n) -> None:\n    \"\"\"Inicializa valores padr\u00e3o da sess\u00e3o e restaura sess\u00e3o salva.\n\n    Args:\n        session_state (Optional[MutableMapping[str, Any]]): Estado alvo da sess\u00e3o.\n            Quando ``None``, usa ``st.session_state``.\n        db (Optional[DatabaseManager]): Inst\u00e2ncia opcional para acesso a dados.\n        context (Optional[AppContext]): Contexto da aplica\u00e7\u00e3o para resolu\u00e7\u00e3o de paths.\n    \"\"\"\n    state = session_state if session_state is not None else st.session_state\n    db = db or DatabaseManager()\n    ctx = context or AppContext.get()\n\n    session_defaults = {\n        # dados do modelo\n        \"unidades\": db.get_unidades(),\n        \"conexoes\": db.get_conexoes(),\n        \"edges\": db.get_edges_for_graph(),\n        \"tecnologias_alternativas\": [],\n        \"fatores_emissao\": [],\n        # autentica\u00e7\u00e3o\n        \"usuario_logado\": None,\n        # UI / sele\u00e7\u00e3o\n        \"selected_nodes\": [],\n        \"selected_edges\": [],\n        \"selected_edge\": None,\n        \"modo_selecao\": False,\n        \"modo_exclusao_fluxo\": False,\n        \"refresh_canvas\": True,\n        \"canvas_opened_once\": False,\n        \"unidade_editando_fluxo\": None,\n        \"confirmar_exclusao\": False,\n        \"nodes_para_excluir\": [],\n        # unidades de medida\n        \"mass_unit\": \"t\",\n        \"emission_unit\": \"tCO\u2082e\",\n        # contadores\n        \"node_counter\": 1,\n        # prefer\u00eancias / auto-save\n        \"auto_save_session\": True,\n        \"auto_save_interval\": 20,\n        \"pref_show_save_toast\": True,\n        \"pref_show_integrity_alerts\": True,\n        \"chatbot_enabled\": False,\n        \"_auto_save_last_ts\": 0.0,\n        # restaura\u00e7\u00e3o de sess\u00e3o\n        \"sessao_restaurada\": False,\n    }\n    for key, value in session_defaults.items():\n        if key not in state:\n            state[key] = value\n\n    if \"fatores_emissao\" not in state or not state[\"fatores_emissao\"]:\n        fatores = _load_fatores_cached(ctx.fatores_path())\n        if fatores:\n            state[\"fatores_emissao\"] = fatores\n        else:\n            state[\"fatores_emissao\"] = []\n            state[\"mostrar_aviso_fatores_emissao\"] = True\n\n    # Restaura sess\u00e3o salva no primeiro rerun ap\u00f3s o login\n    _auto_restore_session(state)\n\n\n# \u2500\u2500 Theme \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef apply_theme():\n    \"\"\"No-op \u2014 tema escuro removido.\"\"\"\n    pass\n\n\n# \u2500\u2500 Header bar (canto superior direito) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef render_header_bar(usuario_logado: Optional[str]) -> None:\n    \"\"\"\n    Renderiza o header da aplica\u00e7\u00e3o.\n\n    Args:\n        usuario_logado (Optional[str]): Nome do usu\u00e1rio autenticado.\n\n    Injeta um pill fixo no canto superior direito com o nome do usu\u00e1rio.\n    Usa apenas estilos inline (sem bloco <style>) para evitar o bug do\n    Streamlit que vaza o texto de blocos <style> na p\u00e1gina.\n    \"\"\"\n    if not usuario_logado:\n        return\n\n    escaped = usuario_logado.replace(\"&\", \"&amp;\").replace(\"<\", \"&lt;\").replace(\">\", \"&gt;\")\n    st.markdown(\n        f\"\"\"\n        <div style=\"\n            position: fixed;\n            top: 0.5rem;\n            right: 5.5rem;\n            z-index: 99999;\n            display: flex;\n            align-items: center;\n            gap: 0.5rem;\n            background: rgba(255,255,255,0.97);\n            border: 1px solid #e5e7eb;\n            padding: 0.3rem 1rem;\n            border-radius: 50px;\n            box-shadow: 0 2px 8px rgba(0,0,0,0.09);\n            font-family: 'Segoe UI', sans-serif;\n            font-size: 0.84rem;\n            color: #374151;\n            pointer-events: none;\n        \">\n            <span style=\"font-size:1rem;\">\ud83d\udc64</span>\n            <span style=\"font-weight:600; color:#4c8061;\">{escaped}</span>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n\n\n# \u2500\u2500 Sidebar extras \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef render_sidebar_extras(\n    usuario_logado: Optional[str],\n    session_state: Optional[MutableMapping[str, Any]] = None,\n) -> None:\n    \"\"\"\n    Executa o salvamento autom\u00e1tico peri\u00f3dico (sem widget na sidebar\n    \u2014 o toggle fica em Configura\u00e7\u00f5es > Prefer\u00eancias).\n\n    Args:\n        usuario_logado (Optional[str]): Nome do usu\u00e1rio autenticado.\n        session_state (Optional[MutableMapping[str, Any]]): Estado alvo da sess\u00e3o.\n            Quando ``None``, usa ``st.session_state``.\n    \"\"\"\n    if not usuario_logado:\n        return\n\n    state = session_state if session_state is not None else st.session_state\n\n    if state.get(\"auto_save_session\", True):\n        try:\n            interval = int(state.get(\"auto_save_interval\", 20))\n        except (TypeError, ValueError):\n            interval = 20\n\n        interval = max(5, interval)\n        now_ts = time.time()\n        last_ts = float(state.get(\"_auto_save_last_ts\", 0.0) or 0.0)\n        if (now_ts - last_ts) >= interval:\n            from tabs.Sessoes import SessoesTab  # importa\u00e7\u00e3o local para evitar ciclo\n            if SessoesTab()._save_user_session():\n                state[\"_auto_save_last_ts\"] = now_ts\n                if state.get(\"pref_show_save_toast\", True):\n                    st.toast(\"\u2705 Sess\u00e3o salva automaticamente\", icon=\"\ud83d\udcbe\")\n\n\n", "tabs/Chatbot.py": "import streamlit as st\nimport requests\nimport json\nimport os\nfrom typing import List, Dict\nfrom datetime import datetime\nfrom core.units import (\n    co2e_label, co2e_intensity_label, convert_co2e,\n    get_default_mass_unit_from_session,\n)\n\nclass ChatbotTab:\n    def __init__(self):\n        self.openrouter_url = \"https://openrouter.ai/api/v1/chat/completions\"\n        self.modelos_padrao = [\n            \"google/gemma-3n-e2b-it:free\",\n            \"nvidia/nemotron-3-nano-30b-a3b:free\",\n            \"openai/gpt-oss-20b:free\",\n            \"qwen/qwen3-vl-30b-a3b-thinking\",\n            \"openai/gpt-oss-120b:free\"\n        ]\n        self.modelos_path = os.path.join(\n            os.path.dirname(os.path.dirname(os.path.dirname(__file__))),\n            \"data\",\n            \"chatbot_models.json\",\n        )\n        self.modelos_disponiveis = self._carregar_modelos_disponiveis()\n\n    def _carregar_modelos_disponiveis(self) -> List[str]:\n        \"\"\"Carrega modelos padr\u00e3o + customizados do arquivo local.\"\"\"\n        custom = []\n        try:\n            if os.path.exists(self.modelos_path):\n                with open(self.modelos_path, \"r\", encoding=\"utf-8\") as f:\n                    data = json.load(f)\n                if isinstance(data, list):\n                    custom = [str(m).strip() for m in data if str(m).strip()]\n        except Exception:\n            custom = []\n\n        merged = []\n        for m in self.modelos_padrao + custom:\n            if m not in merged:\n                merged.append(m)\n        return merged\n\n    def _salvar_modelos_customizados(self, modelos: List[str]) -> None:\n        \"\"\"Salva apenas modelos fora da lista padr\u00e3o.\"\"\"\n        try:\n            os.makedirs(os.path.dirname(self.modelos_path), exist_ok=True)\n            custom = [m for m in modelos if m not in self.modelos_padrao]\n            with open(self.modelos_path, \"w\", encoding=\"utf-8\") as f:\n                json.dump(custom, f, ensure_ascii=False, indent=2)\n        except Exception as e:\n            st.warning(f\"N\u00e3o foi poss\u00edvel salvar a lista de modelos: {e}\")\n\n    def _render_gerenciar_modelos(self, key_prefix: str = \"chatbot\"):\n        \"\"\"UI para adicionar/remover modelos dinamicamente.\"\"\"\n        with st.expander(\"\ud83e\udde9 Gerenciar modelos\", expanded=False):\n            st.caption(\"Adicione IDs de modelos da OpenRouter para manter a lista sempre atualizada.\")\n\n            novo_modelo = st.text_input(\n                \"Novo modelo\",\n                placeholder=\"Ex: mistralai/mistral-small-3.1-24b-instruct:free\",\n                key=f\"{key_prefix}_novo_modelo\",\n            )\n\n            if st.button(\"\u2795 Adicionar modelo\", key=f\"{key_prefix}_add_modelo\", use_container_width=True):\n                candidato = (novo_modelo or \"\").strip()\n                if not candidato:\n                    st.warning(\"Informe um modelo v\u00e1lido antes de adicionar.\")\n                elif candidato in self.modelos_disponiveis:\n                    st.info(\"Esse modelo j\u00e1 est\u00e1 na lista.\")\n                else:\n                    self.modelos_disponiveis.append(candidato)\n                    self._salvar_modelos_customizados(self.modelos_disponiveis)\n                    st.success(\"Modelo adicionado com sucesso.\")\n                    st.rerun()\n\n            custom_models = [m for m in self.modelos_disponiveis if m not in self.modelos_padrao]\n            if custom_models:\n                remover = st.selectbox(\n                    \"Remover modelo customizado\",\n                    options=custom_models,\n                    key=f\"{key_prefix}_remover_modelo\",\n                )\n                if st.button(\"\ud83d\uddd1\ufe0f Remover modelo\", key=f\"{key_prefix}_del_modelo\", use_container_width=True):\n                    self.modelos_disponiveis = [m for m in self.modelos_disponiveis if m != remover]\n                    if st.session_state.get(\"modelo_selecionado\") == remover:\n                        st.session_state.modelo_selecionado = self.modelos_disponiveis[0]\n                    self._salvar_modelos_customizados(self.modelos_disponiveis)\n                    st.success(\"Modelo removido com sucesso.\")\n                    st.rerun()\n        \n    def _render(self):\n        st.title(\"Assistente de An\u00e1lise de Emiss\u00f5es\")\n        st.markdown(\"Converse com o assistente sobre seu processo industrial, emiss\u00f5es e poss\u00edveis melhorias.\")\n        \n        # Configura\u00e7\u00e3o da API Key\n        if not self._verificar_api_key():\n            self._render_configuracao_api()\n            return\n        \n        # Interface principal do chat\n        self._render_chat_interface()\n    \n    def _verificar_api_key(self) -> bool:\n        \"\"\"Verifica se a API key est\u00e1 configurada\"\"\"\n        return \"openrouter_api_key\" in st.session_state and st.session_state.openrouter_api_key\n    \n    def _render_configuracao_api(self):\n        \"\"\"Renderiza formul\u00e1rio de configura\u00e7\u00e3o da API key\"\"\"\n        st.info(\"\ud83d\udc4b Para come\u00e7ar, configure sua API key da OpenRouter.\")\n\n        self._render_gerenciar_modelos(\"config\")\n        \n        with st.expander(\"\u2139\ufe0f Como obter uma API key?\", expanded=True):\n            st.markdown(\"\"\"\n            1. Acesse [OpenRouter](https://openrouter.ai/)\n            2. Crie uma conta ou fa\u00e7a login\n            3. V\u00e1 em **Keys** no menu\n            4. Crie uma nova API key\n            5. Cole a key abaixo\n            \n            **Modelos dispon\u00edveis gratuitos:**\n            - Llama 3.3 8B Instruct\n            - Llama 4 Scout\n            - Qwen3 4B\n            - DeepSeek R1 Qwen3 8B\n            \"\"\")\n        \n        with st.form(\"config_api_key\"):\n            api_key = st.text_input(\n                \"API Key da OpenRouter\",\n                type=\"default\",\n                value=\"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\"\n            )\n            \n            modelo = st.selectbox(\n                \"Modelo de IA\",\n                self.modelos_disponiveis,\n                index=0\n            )\n            \n            submitted = st.form_submit_button(\"\ud83d\udcbe Salvar Configura\u00e7\u00e3o\", use_container_width=True)\n            \n            if submitted:\n                if api_key.strip():\n                    st.session_state.openrouter_api_key = api_key.strip()\n                    st.session_state.modelo_selecionado = modelo\n                    st.session_state.chat_history = []\n                    st.success(\"\u2705 Configura\u00e7\u00e3o salva com sucesso!\")\n                    st.rerun()\n                else:\n                    st.error(\"\u274c Por favor, insira uma API key v\u00e1lida.\")\n    \n    def _render_chat_interface(self):\n        \"\"\"Renderiza a interface principal do chat\"\"\"\n        \n        # Sidebar com configura\u00e7\u00f5es e contexto\n        with st.sidebar:\n            st.markdown(\"### \u2699\ufe0f Configura\u00e7\u00f5es\")\n\n            self._render_gerenciar_modelos(\"sidebar\")\n            \n            # Trocar modelo\n            novo_modelo = st.selectbox(\n                \"Modelo de IA\",\n                self.modelos_disponiveis,\n                index=(\n                    self.modelos_disponiveis.index(st.session_state.get(\"modelo_selecionado\"))\n                    if st.session_state.get(\"modelo_selecionado\") in self.modelos_disponiveis\n
