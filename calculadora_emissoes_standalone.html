oFronteira\",\n            \"TaxacaoLocal\": \"TaxacaoLocal\",\n            \"Tecnologia\": \"Tecnologia\",\n            \"Consumiveis\": \"Consumiveis\",\n            \"ConsumoEspecifico\": \"ConsumoEspecifico\",\n        }\n        for col in list(df.columns):\n            col_clean = str(col).strip()\n            if col_clean.startswith(\"MassaInput\"):\n                col_map[col] = \"MassaInput\"\n            if col_clean.startswith(\"MassaOutput\"):\n                col_map[col] = \"MassaOutput\"\n        df = df.rename(columns={k: v for k, v in col_map.items() if k in df.columns})\n\n        for _, row in df.iterrows():\n            periodo_ref = None\n            try:\n                periodo_ref = int(float(row.get(\"Periodo\", datetime.now().year)))\n            except (ValueError, TypeError):\n                periodo_ref = None\n\n            # Parse consum\u00edveis (formato: \"item1;item2\")\n            consumiveis_raw = str(row.get(\"Consumiveis\", \"\"))\n            consumo_raw = str(row.get(\"ConsumoEspecifico\", \"\"))\n\n            consumiveis = []\n            consumo_especifico = []\n            if consumiveis_raw and consumiveis_raw != \"nan\":\n                nomes = [n.strip() for n in consumiveis_raw.split(\";\") if n.strip()]\n                ces = [c.strip() for c in consumo_raw.split(\";\") if c.strip()] if consumo_raw != \"nan\" else []\n\n                for i, nome in enumerate(nomes):\n                    ce = _safe_float(ces[i], 0.0) if i < len(ces) else 0.0\n                    # Buscar fator nos fatores importados\n                    fator = 0.0\n                    escopo = \"1\"\n                    fator_resolvido = _resolver_fator_por_consumivel_ano(\n                        nome,\n                        result[\"fatores_emissao\"],\n                        periodo_ref,\n                    )\n                    if fator_resolvido:\n                        fator = _safe_float(fator_resolvido.get(\"fator_emissao\", 0.0), 0.0)\n                        escopo = str(fator_resolvido.get(\"escopo\", \"1\"))\n                    consumiveis.append({\"nome\": nome, \"fator\": fator, \"escopo\": escopo})\n                    consumo_especifico.append(ce)\n\n            try:\n                periodo = str(int(float(row.get(\"Periodo\", datetime.now().year))))\n            except (ValueError, TypeError):\n                periodo = str(datetime.now().year)\n            anos_encontrados.add(int(periodo))\n\n            unidade = {\n                \"ID_ELO\": str(row.get(\"ID_ELO\", \"\")),\n                \"Nome\": str(row.get(\"Nome\", \"\")),\n                \"Localizacao\": str(row.get(\"Localizacao\", \"\")),\n                \"Periodo\": periodo,\n                \"Input\": str(row.get(\"Input\", \"\")),\n                \"MassaInput\": convert_mass(\n                    _safe_float(row.get(\"MassaInput\", 0), 0.0),\n                    normalize_unit(row.get(\"Unidade_Massa\", \"t\")),\n                    \"t\",\n                ),\n                \"Output\": str(row.get(\"Output\", \"\")),\n                \"MassaOutput\": convert_mass(\n                    _safe_float(row.get(\"MassaOutput\", 0), 0.0),\n                    normalize_unit(row.get(\"Unidade_Massa\", \"t\")),\n                    \"t\",\n                ),\n                \"Consumiveis\": consumiveis,\n                \"ConsumoEspecifico\": consumo_especifico,\n                \"TaxacaoFronteira\": _parse_bool(row.get(\"TaxacaoFronteira\")),\n                \"TaxacaoLocal\": _parse_bool(row.get(\"TaxacaoLocal\")),\n                \"Tecnologia\": str(row.get(\"Tecnologia\", \"\")) if pd.notna(row.get(\"Tecnologia\")) else None,\n            }\n            result[\"unidades\"].append(unidade)\n\n    # Processar aba Conexoes\n    if \"Conexoes\" in sheets:\n        df = sheets[\"Conexoes\"].dropna(how=\"all\")\n        df.columns = [c.replace(\" *\", \"\").replace(\"*\", \"\").replace(\"(ID_ELO) \", \"\").replace(\"(ID_ELO)\", \"\").strip() for c in df.columns]\n        col_map = {\n            \"Origem\": \"origem\",\n            \"Destino\": \"destino\",\n            \"Massa\": \"massa\",\n            \"Unidade_Massa\": \"unidade_massa\",\n            \"Label\": \"label\",\n            \"Periodo\": \"periodo\",\n        }\n        for col in list(df.columns):\n            col_clean = str(col).strip()\n            if col_clean.startswith(\"Massa\"):\n                col_map[col] = \"massa\"\n        df = df.rename(columns={k: v for k, v in col_map.items() if k in df.columns})\n        if \"origem\" in df.columns:\n            df = df[~df[\"origem\"].astype(str).str.strip().apply(_is_template_hint)]\n        if \"destino\" in df.columns:\n            df = df[~df[\"destino\"].astype(str).str.strip().apply(_is_template_hint)]\n        for _, row in df.iterrows():\n            if pd.notna(row.get(\"origem\")) and pd.notna(row.get(\"destino\")):\n                result[\"conexoes\"].append({\n                    \"origem\": str(row[\"origem\"]).strip(),\n                    \"destino\": str(row[\"destino\"]).strip(),\n                    \"massa\": convert_mass(\n                        _safe_float(row.get(\"massa\", 0), 0.0),\n                        normalize_unit(row.get(\"unidade_massa\", \"t\")),\n                        \"t\",\n                    ),\n                    \"label\": str(row.get(\"label\", \"Fluxo\")),\n                    \"periodo\": str(row.get(\"periodo\", \"\")) if pd.notna(row.get(\"periodo\")) else \"\",\n                })\n\n    # Processar aba Tecnologias\n    if \"Tecnologias\" in sheets:\n        df = sheets[\"Tecnologias\"].dropna(how=\"all\")\n        df.columns = [c.replace(\" *\", \"\").replace(\"*\", \"\").strip() for c in df.columns]\n        if \"ID\" in df.columns:\n            df = df[~df[\"ID\"].astype(str).str.strip().apply(_is_template_hint)]\n        for _, row in df.iterrows():\n            insumos_raw = str(row.get(\"Insumos (nome1;nome2;...)\", row.get(\"Insumos\", \"\")))\n            fc_raw = str(row.get(\"Fator_Consumo (fc1;fc2;...)\", row.get(\"Fator_Consumo\", \"\")))\n\n            insumos = []\n            if insumos_raw and insumos_raw != \"nan\":\n                nomes = [n.strip() for n in insumos_raw.split(\";\") if n.strip()]\n                fcs = [c.strip() for c in fc_raw.split(\";\") if c.strip()] if fc_raw != \"nan\" else []\n                for i, nome in enumerate(nomes):\n                    fc = _safe_float(fcs[i], 1.0) if i < len(fcs) else 1.0\n                    insumos.append({\"nome\": nome, \"fator_consumo\": fc})\n\n            tec = {\n                \"id\": str(row.get(\"ID\", \"\")),\n                \"nome\": str(row.get(\"Nome\", \"\")),\n                \"insumos\": insumos,\n                \"unidades\": [],\n            }\n            result[\"tecnologias\"].append(tec)\n\n    result[\"anos_disponiveis\"] = sorted(anos_encontrados) if anos_encontrados else [datetime.now().year]\n    return result\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  HELPERS\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef _parse_bool(val: Any) -> bool:\n    \"\"\"Parse boolean de v\u00e1rios formatos.\"\"\"\n    if isinstance(val, bool):\n        return val\n    if isinstance(val, str):\n        return val.strip().upper() in (\"TRUE\", \"1\", \"SIM\", \"YES\", \"\u2705\")\n    return False\n\n\ndef _is_template_hint(val: Any) -> bool:\n    \"\"\"Retorna True para c\u00e9lulas de dica do template (obrigat\u00f3rio/opcional).\"\"\"\n    if val is None:\n        return False\n    text = str(val).strip().lower()\n    return text in {\"(obrigat\u00f3rio)\", \"(opcional)\"}\n\n\ndef _safe_float(val: Any, default: float = 0.0) -> float:\n    \"\"\"Converte para float sem lan\u00e7ar exce\u00e7\u00e3o em c\u00e9lulas textuais do template.\"\"\"\n    if val is None:\n        return default\n    if isinstance(val, (int, float)):\n        return float(val)\n    text = str(val).strip()\n    if not text or _is_template_hint(text) or text.lower() == \"nan\":\n        return default\n    try:\n        return float(text.replace(\",\", \".\"))\n    except (ValueError, TypeError):\n        return default\n\n\ndef _resolver_fator_por_consumivel_ano(\n    consumivel: str,\n    fatores: list[dict],\n    ano: Optional[int],\n) -> Optional[dict]:\n    \"\"\"Resolve fator por consum\u00edvel priorizando ano exato e fallback global.\n\n    Regras:\n    1) Primeiro fator com consum\u00edvel + ano exato\n    2) Primeiro fator com consum\u00edvel sem ano (global)\n    3) Primeiro fator com consum\u00edvel (qualquer ano)\n    \"\"\"\n    nome = str(consumivel).strip().upper()\n    if not nome:\n        return None\n\n    candidatos = [\n        f for f in fatores\n        if str(f.get(\"consumivel\", \"\")).strip().upper() == nome\n    ]\n    if not candidatos:\n        return None\n\n    if ano is not None:\n        for fator in candidatos:\n            try:\n                if int(fator.get(\"ano\")) == int(ano):\n                    return fator\n            except (ValueError, TypeError):\n                continue\n\n    for fator in candidatos:\n        ano_f = fator.get(\"ano\", None)\n        if ano_f is None or str(ano_f).strip() == \"\":\n            return fator\n\n    return candidatos[0]\n\n\ndef _write_headers(ws: Any, headers: list) -> None:\n    \"\"\"Escreve cabe\u00e7alhos com formata\u00e7\u00e3o.\"\"\"\n    for col_idx, (label, required) in enumerate(headers, 1):\n        cell = ws.cell(row=1, column=col_idx, value=label)\n        cell.font = _HDR_FONT\n        cell.fill = _HDR_FILL\n        cell.alignment = _CENTER\n        cell.border = _THIN_BORDER\n\n        # Linha de dica (row 2)\n        hint_cell = ws.cell(row=2, column=col_idx, value=\"(obrigat\u00f3rio)\" if required else \"(opcional)\")\n        hint_cell.font = Font(name=\"Calibri\", italic=True, size=9, color=\"888888\")\n        hint_cell.fill = _REQ_FILL if required else _OPT_FILL\n        hint_cell.alignment = _CENTER\n        hint_cell.border = _THIN_BORDER\n\n\ndef _write_example_row(ws: Any, row: int, values: list) -> None:\n    \"\"\"Escreve linha de exemplo com formata\u00e7\u00e3o.\"\"\"\n    for col_idx, val in enumerate(values, 1):\n        cell = ws.cell(row=row, column=col_idx, value=val)\n        cell.font = Font(name=\"Calibri\", italic=True, color=\"999999\", size=10)\n        cell.border = _THIN_BORDER\n\n\ndef _auto_width(ws: Any) -> None:\n    \"\"\"Ajusta largura das colunas automaticamente.\"\"\"\n    for col_cells in ws.columns:\n        max_len = 0\n        col_letter = get_column_letter(col_cells[0].column)\n        for cell in col_cells:\n            if cell.value:\n                max_len = max(max_len, len(str(cell.value)))\n        ws.column_dimensions[col_letter].width = min(max_len + 4, 45)\n", "core/io/json_io.py": "\"\"\"\nLeitura e escrita de dados JSON \u2014 loader/exporter do banco de dados.\n\nRespons\u00e1vel por:\n- Carregar o JSON DB para estruturas internas\n- Exportar o estado atual para JSON com metadados\n- Migrar dados de Excel para JSON\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport logging\nimport os\nimport tempfile\nfrom datetime import datetime\nfrom typing import Any, Dict, List, Optional\n\nimport streamlit as st\n\nlogger = logging.getLogger(__name__)\n\n\ndef migrar_unidade_legacy(unidade: Dict[str, Any]) -> Dict[str, Any]:\n    \"\"\"Converte unidade legado (Input/Output \u00fanicos) para inputs/outputs em lista.\n\n    A migra\u00e7\u00e3o \u00e9 idempotente: pode ser executada m\u00faltiplas vezes sem duplica\u00e7\u00e3o.\n    \"\"\"\n    if not isinstance(unidade, dict):\n        return unidade\n\n    if \"inputs\" not in unidade or not isinstance(unidade.get(\"inputs\"), list):\n        unidade[\"inputs\"] = []\n    if \"outputs\" not in unidade or not isinstance(unidade.get(\"outputs\"), list):\n        unidade[\"outputs\"] = []\n\n    if not unidade[\"inputs\"] and (\"Input\" in unidade or \"MassaInput\" in unidade):\n        unidade[\"inputs\"] = [\n            {\n                \"produto_id\": str(unidade.get(\"Input\", \"\") or \"\").strip(),\n                \"quantidade\": float(unidade.get(\"MassaInput\", 0.0) or 0.0),\n                \"unidade\": \"t\",\n            }\n        ]\n\n    if not unidade[\"outputs\"] and (\"Output\" in unidade or \"MassaOutput\" in unidade):\n        unidade[\"outputs\"] = [\n            {\n                \"produto_id\": str(unidade.get(\"Output\", \"\") or \"\").strip(),\n                \"quantidade\": float(unidade.get(\"MassaOutput\", 0.0) or 0.0),\n                \"unidade\": \"t\",\n            }\n        ]\n\n    # Re-sincroniza campos legados para manter compatibilidade com c\u00f3digo antigo.\n    if unidade.get(\"inputs\"):\n        unidade[\"Input\"] = str(unidade[\"inputs\"][0].get(\"produto_id\", \"\") or \"\")\n        unidade[\"MassaInput\"] = float(\n            sum(float(i.get(\"quantidade\", 0.0) or 0.0) for i in unidade[\"inputs\"])\n        )\n    if unidade.get(\"outputs\"):\n        unidade[\"Output\"] = str(unidade[\"outputs\"][0].get(\"produto_id\", \"\") or \"\")\n        unidade[\"MassaOutput\"] = float(\n            sum(float(o.get(\"quantidade\", 0.0) or 0.0) for o in unidade[\"outputs\"])\n        )\n\n    return unidade\n\n\ndef migrate_database_payload(data: Dict[str, Any]) -> tuple[Dict[str, Any], bool]:\n    \"\"\"Migra payload completo para schema com suporte a inputs/outputs.\"\"\"\n    if not isinstance(data, dict):\n        return data, False\n\n    changed = False\n    unidades = data.get(\"unidades\", [])\n    if isinstance(unidades, list):\n        for idx, unidade in enumerate(unidades):\n            before = json.dumps(unidade, ensure_ascii=False, sort_keys=True)\n            unidades[idx] = migrar_unidade_legacy(unidade)\n            after = json.dumps(unidades[idx], ensure_ascii=False, sort_keys=True)\n            if before != after:\n                changed = True\n\n    schema_version = str(data.get(\"schema_version\", \"\") or \"\")\n    if schema_version != \"1.3.0\":\n        data[\"schema_version\"] = \"1.3.0\"\n        changed = True\n\n    return data, changed\n\n\ndef _to_jsonable(value: Any) -> Any:\n    \"\"\"Converte objetos arbitr\u00e1rios para tipos serializ\u00e1veis em JSON.\"\"\"\n    if value is None or isinstance(value, (str, int, float, bool)):\n        return value\n\n    if isinstance(value, datetime):\n        return value.isoformat()\n\n    if isinstance(value, dict):\n        return {str(k): _to_jsonable(v) for k, v in value.items()}\n\n    if isinstance(value, (list, tuple, set)):\n        return [_to_jsonable(v) for v in value]\n\n    if hasattr(value, \"to_dict\"):\n        try:\n            return _to_jsonable(value.to_dict())\n        except Exception:\n            pass\n\n    if hasattr(value, \"__dict__\"):\n        try:\n            return _to_jsonable(vars(value))\n        except Exception:\n            pass\n\n    return str(value)\n\n\ndef _atomic_write_json(filepath: str, payload: Any) -> None:\n    \"\"\"Escreve JSON de forma at\u00f4mica para evitar arquivos corrompidos.\"\"\"\n    directory = os.path.dirname(filepath)\n    os.makedirs(directory, exist_ok=True)\n\n    content = json.dumps(payload, indent=2, ensure_ascii=False)\n\n    fd, tmp_path = tempfile.mkstemp(prefix=\".tmp_db_\", suffix=\".json\", dir=directory)\n    try:\n        with os.fdopen(fd, \"w\", encoding=\"utf-8\") as f:\n            f.write(content)\n            f.flush()\n            os.fsync(f.fileno())\n        os.replace(tmp_path, filepath)\n    finally:\n        if os.path.exists(tmp_path):\n            try:\n                os.remove(tmp_path)\n            except OSError:\n                pass\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  JSON LOADER\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\n@st.cache_data(ttl=300, show_spinner=False)\ndef load_fatores_emissao(filepath: str) -> List[Dict[str, Any]]:\n    \"\"\"Carrega fatores de emiss\u00e3o do JSON com cache.\n\n    Args:\n        filepath: Caminho absoluto do arquivo JSON.\n\n    Returns:\n        Lista de dicts com os fatores de emiss\u00e3o.\n    \"\"\"\n    if not os.path.exists(filepath):\n        logger.warning(\"Arquivo de fatores n\u00e3o encontrado: %s\", filepath)\n        return []\n    try:\n        with open(filepath, \"r\", encoding=\"utf-8\") as f:\n            data = json.load(f)\n        logger.info(\"Carregados %d fatores de emiss\u00e3o de %s\", len(data), filepath)\n        return data\n    except Exception as exc:\n        logger.error(\"Erro ao carregar fatores: %s\", exc)\n        return []\n\n\ndef load_database(filepath: str) -> Dict[str, Any]:\n    \"\"\"Carrega o banco de dados JSON master.\n\n    Args:\n        filepath: Caminho do arquivo database.json.\n\n    Returns:\n        Dict com toda a estrutura do banco.\n    \"\"\"\n    if not os.path.exists(filepath):\n        logger.info(\"Database n\u00e3o encontrado em %s, retornando vazio.\", filepath)\n        from core.validation.schema import create_empty_database\n        return create_empty_database()\n    try:\n        with open(filepath, \"r\", encoding=\"utf-8\") as f:\n            data = json.load(f)\n\n        data, changed = migrate_database_payload(data)\n        if changed:\n            data[\"updated_at\"] = datetime.now().isoformat()\n            _atomic_write_json(filepath, data)\n            logger.info(\"Database migrado para schema 1.3.0 em %s\", filepath)\n\n        logger.info(\"Database carregado de %s\", filepath)\n        return data\n    except Exception as exc:\n        logger.error(\"Erro ao carregar database: %s\", exc)\n        from core.validation.schema import create_empty_database\n        return create_empty_database()\n\n\ndef save_database(filepath: str, data: Dict[str, Any]) -> bool:\n    \"\"\"Salva o banco de dados JSON.\n\n    Args:\n        filepath: Caminho do arquivo de sa\u00edda.\n        data: Dados a salvar.\n\n    Returns:\n        True se salvou com sucesso.\n    \"\"\"\n    try:\n        payload = _to_jsonable(dict(data))\n        payload[\"updated_at\"] = datetime.now().isoformat()\n        _atomic_write_json(filepath, payload)\n        logger.info(\"Database salvo em %s\", filepath)\n        return True\n    except Exception as exc:\n        logger.error(\"Erro ao salvar database: %s\", exc)\n        return False\n\n\ndef save_fatores_emissao(filepath: str, fatores: List[Dict[str, Any]]) -> bool:\n    \"\"\"Salva fatores de emiss\u00e3o em arquivo JSON.\n\n    Args:\n        filepath: Caminho do arquivo.\n        fatores: Lista de fatores.\n\n    Returns:\n        True se salvou com sucesso.\n    \"\"\"\n    try:\n        payload = _to_jsonable(fatores)\n        _atomic_write_json(filepath, payload)\n        # Invalidar cache\n        load_fatores_emissao.clear()\n        logger.info(\"Fatores salvos em %s (%d registros)\", filepath, len(payload))\n        return True\n    except Exception as exc:\n        logger.error(\"Erro ao salvar fatores: %s\", exc)\n        return False\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  EXPORTA\u00c7\u00c3O DO ESTADO ATUAL PARA JSON DB\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef export_session_to_database(ano: Optional[int] = None) -> Dict[str, Any]:\n    \"\"\"Exporta o estado atual do session_state para o formato do JSON DB.\n\n    Args:\n        ano: Ano a registrar nos metadados (usa ano ativo se None).\n\n    Returns:\n        Dict no formato do schema do banco.\n    \"\"\"\n    from core.validation.schema import SCHEMA_VERSION\n\n    unidades = st.session_state.get(\"unidades\", [])\n    conexoes = st.session_state.get(\"conexoes\", [])\n    tecnologias = st.session_state.get(\"tecnologias_alternativas\", [])\n    fatores = st.session_state.get(\"fatores_emissao\", [])\n\n    unidades_dict = []\n    for u in unidades:\n        if hasattr(u, \"to_dict\"):\n            unidades_dict.append(_to_jsonable(u.to_dict()))\n        elif isinstance(u, dict):\n            unidades_dict.append(_to_jsonable(u))\n        else:\n            unidades_dict.append(_to_jsonable(u))\n\n    conexoes_dict = []\n    for c in conexoes:\n        if hasattr(c, \"to_dict\"):\n            conexoes_dict.append(_to_jsonable(c.to_dict()))\n        elif isinstance(c, dict):\n            conexoes_dict.append(_to_jsonable(c))\n        else:\n            conexoes_dict.append(_to_jsonable(c))\n\n    tecnologias_dict = []\n    for t in tecnologias:\n        if hasattr(t, \"to_dict\"):\n            tecnologias_dict.append(_to_jsonable(t.to_dict()))\n        elif isinstance(t, dict):\n            tecnologias_dict.append(_to_jsonable(t))\n        else:\n            tecnologias_dict.append(_to_jsonable(t))\n\n    # Descobrir anos dos registros\n    anos = set()\n    for u in unidades_dict:\n        try:\n            anos.add(int(u.get(\"Periodo\", 0)))\n        except (ValueError, TypeError):\n            pass\n    if ano:\n        anos.add(ano)\n    if not anos:\n        anos.add(datetime.now().year)\n\n    return {\n        \"schema_version\": SCHEMA_VERSION,\n        \"created_at\": datetime.now().isoformat(),\n        \"updated_at\": datetime.now().isoformat(),\n        \"source\": \"session_export\",\n        \"anos_disponiveis\": sorted(anos),\n        \"fatores_emissao\": _to_jsonable(fatores),\n        \"unidades\": unidades_dict,\n        \"conexoes\": conexoes_dict,\n        \"tecnologias\": tecnologias_dict,\n    }\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  FILTROS POR ANO\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef filtrar_unidades_por_ano(\n    unidades: List[Any],\n    ano: int,\n) -> List[Any]:\n    \"\"\"Filtra unidades pelo campo Periodo/ano.\n\n    Args:\n        unidades: Lista de objetos UnidadeProdutiva ou dicts.\n        ano: Ano para filtrar.\n\n    Returns:\n        Lista filtrada.\n    \"\"\"\n    resultado = []\n    for u in unidades:\n        periodo = getattr(u, \"Periodo\", None) if hasattr(u, \"Periodo\") else u.get(\"Periodo\")\n        try:\n            if int(periodo) == ano:\n                resultado.append(u)\n        except (ValueError, TypeError):\n            # Se n\u00e3o for parseable como int, incluir mesmo assim\n            resultado.append(u)\n    return resultado\n", "core/io/local_storage.py": "\"\"\"\nPersist\u00eancia local via localStorage do browser (apenas no modo standalone/Pyodide).\n\nNo ambiente desktop (Python normal), todas as fun\u00e7\u00f5es s\u00e3o no-ops silenciosos,\nde modo que o c\u00f3digo de neg\u00f3cio n\u00e3o precisa verificar o ambiente antes de chamar.\n\nUso:\n    from core.io.local_storage import ls_save, ls_load, ls_delete\n\n    # Salvar (serializa para JSON automaticamente)\n    ls_save(\"cmp_session_admin\", {\"unidades\": [...], ...})\n\n    # Carregar (retorna dict ou None se a chave n\u00e3o existir)\n    data = ls_load(\"cmp_session_admin\")\n\n    # Remover\n    ls_delete(\"cmp_session_admin\")\n\nLimita\u00e7\u00f5es do localStorage:\n  - Capacidade: ~5 MB por origin (file:/// conta como origin \u00fanica)\n  - Tipos: apenas strings \u2014 os dados s\u00e3o serializados/desserializados via JSON\n  - Escopo: persiste entre tabs e recarregamentos no mesmo browser/perfil\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport logging\nimport sys\nfrom typing import Any, Optional\n\nlogger = logging.getLogger(__name__)\n\n\ndef _is_pyodide() -> bool:\n    \"\"\"Retorna True quando o c\u00f3digo est\u00e1 rodando dentro do Pyodide (standalone HTML).\"\"\"\n    return \"pyodide\" in sys.modules or \"js\" in sys.modules\n\n\ndef ls_save(key: str, data: Any) -> bool:\n    \"\"\"Persiste *data* no localStorage do browser sob *key*.\n\n    Args:\n        key: Chave \u00fanica de armazenamento (ex.: \"cmp_session_admin\").\n        data: Qualquer objeto serializ\u00e1vel em JSON (dict, list, str, etc.).\n\n    Returns:\n        True se a opera\u00e7\u00e3o foi bem-sucedida, False caso contr\u00e1rio\n        (ambiente n\u00e3o-Pyodide, quota excedida, etc.).\n    \"\"\"\n    if not _is_pyodide():\n        return False\n    try:\n        import js  # type: ignore[import]  # dispon\u00edvel apenas no Pyodide\n        payload = json.dumps(data, ensure_ascii=False, default=str)\n        js.window.localStorage.setItem(key, payload)\n        logger.debug(\"localStorage: salvo key='%s' (%d bytes)\", key, len(payload))\n        return True\n    except Exception as exc:\n        logger.warning(\"localStorage: falha ao salvar key='%s': %s\", key, exc)\n        return False\n\n\ndef ls_load(key: str) -> Optional[Any]:\n    \"\"\"L\u00ea e desserializa o valor armazenado em *key*.\n\n    Args:\n        key: Chave a ser lida.\n\n    Returns:\n        O objeto Python desserializado, ou ``None`` se a chave n\u00e3o existir\n        ou ocorrer qualquer erro.\n    \"\"\"\n    if not _is_pyodide():\n        return None\n    try:\n        import js  # type: ignore[import]\n        raw = js.window.localStorage.getItem(key)\n        if raw is None:\n            return None\n        result = json.loads(str(raw))\n        logger.debug(\"localStorage: carregado key='%s'\", key)\n        return result\n    except Exception as exc:\n        logger.warning(\"localStorage: falha ao carregar key='%s': %s\", key, exc)\n        return None\n\n\ndef ls_delete(key: str) -> None:\n    \"\"\"Remove *key* do localStorage (no-op silencioso fora do Pyodide).\n\n    Args:\n        key: Chave a ser removida.\n    \"\"\"\n    if not _is_pyodide():\n        return\n    try:\n        import js  # type: ignore[import]\n        js.window.localStorage.removeItem(key)\n        logger.debug(\"localStorage: removido key='%s'\", key)\n    except Exception as exc:\n        logger.warning(\"localStorage: falha ao remover key='%s': %s\", key, exc)\n\n\ndef ls_session_key(usuario: str) -> str:\n    \"\"\"Retorna a chave padr\u00e3o de sess\u00e3o para um usu\u00e1rio.\"\"\"\n    safe = str(usuario).strip().lower().replace(\" \", \"_\")\n    return f\"cmp_session_{safe}\"\n", "core/io/__init__.py": "\"\"\"M\u00f3dulos de leitura/escrita (JSON, Excel).\"\"\"\n", "core/validation/relational.py": "\"\"\"\nModelo relacional e valida\u00e7\u00e3o de integridade referencial.\n\nDefine chaves prim\u00e1rias, chaves estrangeiras e regras de integridade\nentre as entidades do banco de dados (Unidades, Conex\u00f5es, Tecnologias,\nFatores de Emiss\u00e3o).\n\nDiagrama Relacional (ERD):\n\n  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510       \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n  \u2502   Tecnologia     \u2502       \u2502   FatorEmissao           \u2502\n  \u2502\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2502       \u2502\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2502\n  \u2502 PK: id           \u2502       \u2502 PK: (consumivel, escopo, \u2502\n  \u2502    nome           \u2502       \u2502      ano)               \u2502\n  \u2502    insumos[]      \u2502       \u2502    grupo_consumivel      \u2502\n  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518       \u2502    fator_emissao         \u2502\n           \u2502 0..N            \u2502    kgCO2e_unid           \u2502\n           \u2502                 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n           \u2502                              \u2502 0..N\n  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510            \u2502\n  \u2502   Unidade                \u2502            \u2502\n  \u2502\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2502            \u2502\n  \u2502 PK: (ID_ELO, Periodo)   \u2502\u25c4\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n  \u2502    Nome                  \u2502  Consumiveis[].nome \u2192 FatorEmissao.consumivel\n  \u2502    Localizacao           \u2502\n  \u2502    Input, MassaInput     \u2502\n  \u2502    Output, MassaOutput   \u2502\n  \u2502 FK: Tecnologia \u2192 Tec.id \u2502\n  \u2502    Consumiveis[]         \u2502\n  \u2502    ConsumoEspecifico[]   \u2502\n  \u2502    TaxacaoFronteira      \u2502\n  \u2502    TaxacaoLocal          \u2502\n  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n         \u2502      \u2502\n         \u2502 0..N \u2502 0..N\n  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n  \u2502   Conexao                \u2502\n  \u2502\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2502\n  \u2502 PK: (origem, destino,    \u2502\n  \u2502      periodo)            \u2502\n  \u2502 FK: origem  \u2192 Unidade.ID \u2502\n  \u2502 FK: destino \u2192 Unidade.ID \u2502\n  \u2502    massa                 \u2502\n  \u2502    label                 \u2502\n  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\"\"\"\nfrom __future__ import annotations\n\nimport logging\nfrom dataclasses import dataclass, field\nfrom enum import Enum\nfrom typing import Any, Dict, List, Optional, Set, Tuple\n\nlogger = logging.getLogger(__name__)\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  MODELO RELACIONAL \u2014 Defini\u00e7\u00e3o de Chaves\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nclass Entidade(str, Enum):\n    UNIDADE = \"unidade\"\n    CONEXAO = \"conexao\"\n    TECNOLOGIA = \"tecnologia\"\n    FATOR_EMISSAO = \"fator_emissao\"\n\n\n# Chaves prim\u00e1rias por entidade\nPRIMARY_KEYS: Dict[Entidade, List[str]] = {\n    Entidade.UNIDADE: [\"ID_ELO\", \"Periodo\"],\n    Entidade.CONEXAO: [\"origem\", \"destino\", \"periodo\"],\n    Entidade.TECNOLOGIA: [\"id\"],\n    Entidade.FATOR_EMISSAO: [\"consumivel\", \"escopo\", \"ano\"],\n}\n\n# Campos de PK que podem ser nulos/vazios (campo global/opcional)\nPK_NULLABLE_FIELDS: Dict[Entidade, set] = {\n    Entidade.FATOR_EMISSAO: {\"ano\"},  # ano \u00e9 opcional \u2014 fator global quando vazio\n}\n\n# Chaves estrangeiras: (entidade_origem, campo, entidade_destino, campo_destino)\n@dataclass\nclass ForeignKey:\n    \"\"\"Define uma chave estrangeira entre entidades.\"\"\"\n    source_entity: Entidade\n    source_field: str\n    target_entity: Entidade\n    target_field: str\n    nullable: bool = False\n    description: str = \"\"\n\nFOREIGN_KEYS: List[ForeignKey] = [\n    ForeignKey(\n        source_entity=Entidade.CONEXAO,\n        source_field=\"origem\",\n        target_entity=Entidade.UNIDADE,\n        target_field=\"ID_ELO\",\n        nullable=False,\n        description=\"Conex\u00e3o.origem referencia Unidade.ID_ELO\",\n    ),\n    ForeignKey(\n        source_entity=Entidade.CONEXAO,\n        source_field=\"destino\",\n        target_entity=Entidade.UNIDADE,\n        target_field=\"ID_ELO\",\n        nullable=False,\n        description=\"Conex\u00e3o.destino referencia Unidade.ID_ELO\",\n    ),\n    ForeignKey(\n        source_entity=Entidade.UNIDADE,\n        source_field=\"Tecnologia\",\n        target_entity=Entidade.TECNOLOGIA,\n        target_field=\"id\",\n        nullable=True,\n        description=\"Unidade.Tecnologia referencia Tecnologia.id\",\n    ),\n]\n\n# Regras de dom\u00ednio por campo (tipo, min, max, pattern, etc.)\n@dataclass\nclass DomainRule:\n    \"\"\"Regra de dom\u00ednio para um campo.\"\"\"\n    field: str\n    entity: Entidade\n    rule_type: str  # \"range\", \"positive\", \"non_empty\", \"enum\", \"length_match\"\n    params: Dict[str, Any] = field(default_factory=dict)\n    message: str = \"\"\n\nDOMAIN_RULES: List[DomainRule] = [\n    DomainRule(\"MassaInput\", Entidade.UNIDADE, \"positive\",\n               message=\"MassaInput deve ser \u2265 0\"),\n    DomainRule(\"MassaOutput\", Entidade.UNIDADE, \"positive\",\n               message=\"MassaOutput deve ser \u2265 0\"),\n    DomainRule(\"massa\", Entidade.CONEXAO, \"positive\",\n               message=\"Massa da conex\u00e3o deve ser \u2265 0\"),\n    DomainRule(\"fator_emissao\", Entidade.FATOR_EMISSAO, \"positive\",\n               message=\"Fator de emiss\u00e3o deve ser \u2265 0\"),\n    DomainRule(\"Consumiveis\", Entidade.UNIDADE, \"length_match\",\n               params={\"other_field\": \"ConsumoEspecifico\"},\n               message=\"Consumiveis e ConsumoEspecifico devem ter o mesmo comprimento\"),\n]\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  SEVERIDADE E RESULTADO\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nclass Severidade(str, Enum):\n    ERROR = \"error\"\n    WARNING = \"warning\"\n    INFO = \"info\"\n\n\n@dataclass\nclass RelationalIssue:\n    \"\"\"Uma inconsist\u00eancia relacional encontrada.\"\"\"\n    severidade: Severidade\n    entidade: str\n    indice: int\n    campo: str\n    mensagem: str\n    pk_value: str = \"\"       # Valor da PK do registro com problema\n    fk_reference: str = \"\"   # Refer\u00eancia FK que falhou\n    rule_type: str = \"\"      # \"pk_duplicate\", \"fk_missing\", \"fk_orphan\", etc.\n\n    def __str__(self) -> str:\n        prefix = {\n            Severidade.ERROR: \"\u274c\",\n            Severidade.WARNING: \"\u26a0\ufe0f\",\n            Severidade.INFO: \"\u2139\ufe0f\",\n        }.get(self.severidade, \"?\")\n        pk_info = f\" [PK={self.pk_value}]\" if self.pk_value else \"\"\n        return f\"{prefix} {self.entidade}[{self.indice}].{self.campo}{pk_info}: {self.mensagem}\"\n\n\n@dataclass\nclass RelationalReport:\n    \"\"\"Resultado completo da valida\u00e7\u00e3o relacional.\"\"\"\n    issues: List[RelationalIssue] = field(default_factory=list)\n    stats: Dict[str, int] = field(default_factory=dict)\n\n    @property\n    def errors(self) -> List[RelationalIssue]:\n        return [i for i in self.issues if i.severidade == Severidade.ERROR]\n\n    @property\n    def warnings(self) -> List[RelationalIssue]:\n        return [i for i in self.issues if i.severidade == Severidade.WARNING]\n\n    @property\n    def info(self) -> List[RelationalIssue]:\n        return [i for i in self.issues if i.severidade == Severidade.INFO]\n\n    @property\n    def is_valid(self) -> bool:\n        return len(self.errors) == 0\n\n    @property\n    def has_warnings(self) -> bool:\n        return len(self.warnings) > 0\n\n    def add(self, issue: RelationalIssue) -> None:\n        self.issues.append(issue)\n\n    def summary(self) -> str:\n        \"\"\"Gera resumo textual do relat\u00f3rio.\"\"\"\n        lines = [\n            f\"Valida\u00e7\u00e3o Relacional: {'\u2705 OK' if self.is_valid else '\u274c Falhou'}\",\n        ]\n        if self.stats:\n            counts = \", \".join(f\"{k}: {v}\" for k, v in self.stats.items())\n            lines.append(f\"Registros: {counts}\")\n        lines.append(\n            f\"Erros: {len(self.errors)}, \"\n            f\"Avisos: {len(self.warnings)}, \"\n            f\"Info: {len(self.info)}\"\n        )\n        for issue in self.errors[:15]:\n            lines.append(f\"  {issue}\")\n        if len(self.errors) > 15:\n            lines.append(f\"  ... e mais {len(self.errors) - 15} erro(s)\")\n        for issue in self.warnings[:10]:\n            lines.append(f\"  {issue}\")\n        if len(self.warnings) > 10:\n            lines.append(f\"  ... e mais {len(self.warnings) - 10} aviso(s)\")\n        return \"\\n\".join(lines)\n\n    def to_dataframe_rows(self) -> List[Dict[str, str]]:\n        \"\"\"Converte issues em linhas para exibi\u00e7\u00e3o em tabela.\"\"\"\n        rows = []\n        for i in self.issues:\n            icon = {\"error\": \"\u274c\", \"warning\": \"\u26a0\ufe0f\", \"info\": \"\u2139\ufe0f\"}.get(i.severidade.value, \"\")\n            rows.append({\n                \"Sev.\": icon,\n                \"Entidade\": i.entidade,\n                \"\u00cdndice\": i.indice,\n                \"Campo\": i.campo,\n                \"PK\": i.pk_value,\n                \"Tipo\": i.rule_type,\n                \"Mensagem\": i.mensagem,\n            })\n        return rows\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  FUN\u00c7\u00d5ES DE VALIDA\u00c7\u00c3O RELACIONAL\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef _extract_pk(reg: Dict[str, Any], pk_fields: List[str]) -> Tuple:\n    \"\"\"Extrai a chave prim\u00e1ria composta de um registro.\"\"\"\n    return tuple(str(reg.get(f, \"\")) for f in pk_fields)\n\n\ndef _pk_display(pk: Tuple, pk_fields: List[str]) -> str:\n    \"\"\"Formata PK para exibi\u00e7\u00e3o leg\u00edvel.\"\"\"\n    parts = [f\"{f}={v}\" for f, v in zip(pk_fields, pk)]\n    return \"(\" + \", \".join(parts) + \")\"\n\n\ndef validar_chaves_primarias(\n    data: Dict[str, Any],\n    report: RelationalReport,\n) -> Dict[Entidade, Set[Tuple]]:\n    \"\"\"Valida unicidade de chaves prim\u00e1rias para todas as entidades.\n\n    Returns:\n        Dicion\u00e1rio mapeando cada entidade ao conjunto de PKs v\u00e1lidas.\n    \"\"\"\n    entity_map = {\n        Entidade.UNIDADE: (\"unidades\", \"unidade\"),\n        Entidade.CONEXAO: (\"conexoes\", \"conexao\"),\n        Entidade.TECNOLOGIA: (\"tecnologias\", \"tecnologia\"),\n        Entidade.FATOR_EMISSAO: (\"fatores_emissao\", \"fator_emissao\"),\n    }\n\n    pk_sets: Dict[Entidade, Set[Tuple]] = {}\n\n    for entity, (collection_key, entity_name) in entity_map.items():\n        records = data.get(collection_key, [])\n        pk_fields = PRIMARY_KEYS[entity]\n        seen: Dict[Tuple, int] = {}\n        valid_pks: Set[Tuple] = set()\n\n        report.stats[entity_name] = len(records)\n\n        for idx, reg in enumerate(records):\n            pk = _extract_pk(reg, pk_fields)\n\n            # Verificar campos da PK n\u00e3o vazios (exceto os marcados como nullable)\n            nullable = PK_NULLABLE_FIELDS.get(entity, set())\n            empty_fields = [\n                f for f, v in zip(pk_fields, pk)\n                if (not v or v == \"None\") and f not in nullable\n            ]\n            if empty_fields:\n                report.add(RelationalIssue(\n                    severidade=Severidade.ERROR,\n                    entidade=entity_name,\n                    indice=idx,\n                    campo=\",\".join(empty_fields),\n                    mensagem=f\"Campo(s) de chave prim\u00e1ria vazio(s): {empty_fields}\",\n                    pk_value=_pk_display(pk, pk_fields),\n                    rule_type=\"pk_empty\",\n                ))\n                continue\n\n            if pk in seen:\n                report.add(RelationalIssue(\n                    severidade=Severidade.ERROR,\n                    entidade=entity_name,\n                    indice=idx,\n                    campo=\"/\".join(pk_fields),\n                    mensagem=(\n                        f\"Chave prim\u00e1ria duplicada: {_pk_display(pk, pk_fields)} \"\n                        f\"(conflito com \u00edndice {seen[pk]})\"\n                    ),\n                    pk_value=_pk_display(pk, pk_fields),\n                    rule_type=\"pk_duplicate\",\n                ))\n            else:\n                seen[pk] = idx\n                valid_pks.add(pk)\n\n        pk_sets[entity] = valid_pks\n\n    return pk_sets\n\n\ndef validar_chaves_estrangeiras(\n    data: Dict[str, Any],\n    pk_sets: Dict[Entidade, Set[Tuple]],\n    report: RelationalReport,\n) -> None:\n    \"\"\"Valida integridade referencial das FKs.\"\"\"\n    entity_collections = {\n        Entidade.UNIDADE: \"unidades\",\n        Entidade.CONEXAO: \"conexoes\",\n        Entidade.TECNOLOGIA: \"tecnologias\",\n        Entidade.FATOR_EMISSAO: \"fatores_emissao\",\n    }\n\n    # Construir \u00edndices de lookup por campo individual\n    # Ex: {Entidade.UNIDADE: {\"ID_ELO\": {\"U001\", \"U002\", ...}}}\n    field_indexes: Dict[Entidade, Dict[str, Set[str]]] = {}\n    for entity in Entidade:\n        collection = data.get(entity_collections.get(entity, \"\"), [])\n        field_indexes[entity] = {}\n        for reg in collection:\n            for fld in PRIMARY_KEYS.get(entity, []):\n                if fld not in field_indexes[entity]:\n                    field_indexes[entity][fld] = set()\n                val = str(reg.get(fld, \"\"))\n                if val and val != \"None\":\n                    field_indexes[entity][fld].add(val)\n\n    # Validar cada FK definida\n    for fk in FOREIGN_KEYS:\n        src_collection = entity_collections.get(fk.source_entity, \"\")\n        src_name = fk.source_entity.value\n        records = data.get(src_collection, [])\n        target_values = field_indexes.get(fk.target_entity, {}).get(fk.target_field, set())\n\n        for idx, reg in enumerate(records):\n            val = reg.get(fk.source_field)\n\n            # Pular se nullable e vazio\n            if fk.nullable and (val is None or str(val).strip() == \"\" or str(val) == \"None\"):\n                continue\n\n            if val is None or str(val).strip() == \"\":\n                if not fk.nullable:\n                    pk_fields = PRIMARY_KEYS[fk.source_entity]\n                    pk = _extract_pk(reg, pk_fields)\n                    report.add(RelationalIssue(\n                        severidade=Severidade.ERROR,\n                        entidade=src_name,\n                        indice=idx,\n                        campo=fk.source_field,\n                        mensagem=f\"FK obrigat\u00f3ria vazia: {fk.description}\",\n                        pk_value=_pk_display(pk, pk_fields),\n                        rule_type=\"fk_null\",\n                    ))\n                continue\n\n            ref = str(val).strip()\n            if ref not in target_values:\n                pk_fields = PRIMARY_KEYS[fk.source_entity]\n                pk = _extract_pk(reg, pk_fields)\n                report.add(RelationalIssue(\n                    severidade=Severidade.ERROR,\n                    entidade=src_name,\n                    indice=idx,\n                    campo=fk.source_field,\n                    mensagem=(\n                        f\"Refer\u00eancia inexistente: '{ref}' n\u00e3o encontrado em \"\n                        f\"{fk.target_entity.value}.{fk.target_field}. \"\n                        f\"({fk.description})\"\n                    ),\n                    pk_value=_pk_display(pk, pk_fields),\n                    fk_reference=ref,\n                    rule_type=\"fk_missing\",\n                ))\n\n\ndef validar_periodo_consistencia(\n    data: Dict[str, Any],\n    report: RelationalReport,\n) -> None:\n    \"\"\"Valida que o periodo da conex\u00e3o \u00e9 consistente com os periodos das\n    unidades referenciadas (origem e destino).\"\"\"\n    unidades = data.get(\"unidades\", [])\n    conexoes = data.get(\"conexoes\", [])\n\n    # Indexar periodos por ID_ELO\n    # Uma unidade pode existir em m\u00faltiplos per\u00edodos\n    periodos_por_id: Dict[str, Set[str]] = {}\n    for u in unidades:\n        id_elo = str(u.get(\"ID_ELO\", \"\"))\n        periodo = str(u.get(\"Periodo\", \"\"))\n        if id_elo:\n            periodos_por_id.setdefault(id_elo, set()).add(periodo)\n\n    for idx, c in enumerate(conexoes):\n        periodo_conn = str(c.get(\"periodo\", \"\"))\n        origem = str(c.get(\"origem\", \"\"))\n        destino = str(c.get(\"destino\", \"\"))\n\n        if not periodo_conn:\n            # Conex\u00e3o sem per\u00edodo definido \u2014 avisar\n            report.add(RelationalIssue(\n                severidade=Severidade.WARNING,\n                entidade=\"conexao\",\n                indice=idx,\n                campo=\"periodo\",\n                mensagem=f\"Conex\u00e3o {origem} \u2192 {destino} sem per\u00edodo definido.\",\n                pk_value=f\"({origem}, {destino}, '')\",\n                rule_type=\"periodo_vazio\",\n            ))\n            continue\n\n        # Verificar se origem existe no per\u00edodo da conex\u00e3o\n        if origem in periodos_por_id:\n            if periodo_conn not in periodos_por_id[origem]:\n                periodos_disp = \", \".join(sorted(periodos_por_id[origem]))\n                report.add(RelationalIssue(\n                    severidade=Severidade.WARNING,\n                    entidade=\"conexao\",\n                    indice=idx,\n                    campo=\"periodo/origem\",\n                    mensagem=(\n                        f\"Unidade '{origem}' n\u00e3o existe no per\u00edodo '{periodo_conn}'. \"\n                        f\"Per\u00edodos dispon\u00edveis: [{periodos_disp}]\"\n                    ),\n                    pk_value=f\"({origem}, {destino}, {periodo_conn})\",\n                    rule_type=\"periodo_inconsistente\",\n                ))\n\n        # Verificar se destino existe no per\u00edodo da conex\u00e3o\n        if destino in periodos_por_id:\n            if periodo_conn not in periodos_por_id[destino]:\n                periodos_disp = \", \".join(sorted(periodos_por_id[destino]))\n                report.add(RelationalIssue(\n                    severidade=Severidade.WARNING,\n                    entidade=\"conexao\",\n                    indice=idx,\n                    campo=\"periodo/destino\",\n                    mensagem=(\n                        f\"Unidade '{destino}' n\u00e3o existe no per\u00edodo '{periodo_conn}'. \"\n                        f\"Per\u00edodos dispon\u00edveis: [{periodos_disp}]\"\n                    ),\n                    pk_value=f\"({origem}, {destino}, {periodo_conn})\",\n                    rule_type=\"periodo_inconsistente\",\n                ))\n\n\ndef validar_consumiveis_fatores(\n    data: Dict[str, Any],\n    report: RelationalReport,\n) -> None:\n    \"\"\"Valida que os consum\u00edveis referenciados nas unidades existem nos\n    fatores de emiss\u00e3o.\"\"\"\n    fatores = data.get(\"fatores_emissao\", [])\n    unidades = data.get(\"unidades\", [])\n\n    # Coletar todos os consum\u00edveis dispon\u00edveis\n    consumiveis_disponiveis: Set[str] = set()\n    for f in fatores:\n        c = f.get(\"consumivel\", \"\")\n        if c:\n            consumiveis_disponiveis.add(str(c).strip().upper())\n\n    for idx, u in enumerate(unidades):\n        consumiveis = u.get(\"Consumiveis\", [])\n        id_elo = str(u.get(\"ID_ELO\", \"\"))\n        periodo = str(u.get(\"Periodo\", \"\"))\n\n        for ci, cons in enumerate(consumiveis):\n            nome = cons.get(\"nome\", \"\") if isinstance(cons, dict) else str(cons)\n            if nome and nome.strip().upper() not in consumiveis_disponiveis:\n                report.add(RelationalIssue(\n                    severidade=Severidade.WARNING,\n                    entidade=\"unidade\",\n                    indice=idx,\n                    campo=f\"Consumiveis[{ci}].nome\",\n                    mensagem=(\n                        f\"Consum\u00edvel '{nome}' da unidade '{id_elo}' \"\n                        f\"n\u00e3o encontrado nos fatores de emiss\u00e3o.\"\n                    ),\n                    pk_value=f\"(ID_ELO={id_elo}, Periodo={periodo})\",\n                    fk_reference=nome,\n                    rule_type=\"consumivel_sem_fator\",\n                ))\n\n\ndef validar_regras_dominio(\n    data: Dict[str, Any],\n    report: RelationalReport,\n) -> None:\n    \"\"\"Valida regras de dom\u00ednio (ranges, tipos, consist\u00eancia l\u00f3gica).\"\"\"\n    entity_collections = {\n        Entidade.UNIDADE: \"unidades\",\n        Entidade.CONEXAO: \"conexoes\",\n        Entidade.TECNOLOGIA: \"tecnologias\",\n        Entidade.FATOR_EMISSAO: \"fatores_emissao\",\n    }\n\n    for rule in DOMAIN_RULES:\n        collection = data.get(entity_collections.get(rule.entity, \"\"), [])\n        for idx, reg in enumerate(collection):\n            val = reg.get(rule.field)\n            pk_fields = PRIMARY_KEYS[rule.entity]\n            pk = _extract_pk(reg, pk_fields)\n\n            if rule.rule_type == \"positive\":\n                if isinstance(val, (int, float)) and val < 0:\n                    report.add(RelationalIssue(\n                        severidade=Severidade.ERROR,\n                        entidade=rule.entity.value,\n                        indice=idx,\n                        campo=rule.field,\n                        mensagem=f\"{rule.message} (valor: {val})\",\n                        pk_value=_pk_display(pk, pk_fields),\n                        rule_type=\"domain_positive\",\n                    ))\n\n            elif rule.rule_type == \"length_match\":\n                other = rule.params.get(\"other_field\", \"\")\n                val_other = reg.get(other, [])\n                if isinstance(val, list) and isinstance(val_other, list):\n                    if len(val) != len(val_other):\n                        report.add(RelationalIssue(\n                            severidade=Severidade.ERROR,\n                            entidade=rule.entity.value,\n                            indice=idx,\n                            campo=f\"{rule.field}/{other}\",\n                            mensagem=(\n                                f\"{rule.message}: \"\n                                f\"{len(val)} vs {len(val_other)}\"\n                            ),\n                            pk_value=_pk_display(pk, pk_fields),\n                            rule_type=\"domain_length_match\",\n                        ))\n\n\ndef validar_orfaos(\n    data: Dict[str, Any],\n    report: RelationalReport,\n) -> None:\n    \"\"\"Identifica registros \u00f3rf\u00e3os \u2014 unidades sem conex\u00f5es (isoladas).\"\"\"\n    unidades = data.get(\"unidades\", [])\n    conexoes = data.get(\"conexoes\", [])\n\n    # IDs referenciados em conex\u00f5es\n    ids_conectados: Set[str] = set()\n    for c in conexoes:\n        ids_conectados.add(str(c.get(\"origem\", \"\")))\n        ids_conectados.add(str(c.get(\"destino\", \"\")))\n\n    for idx, u in enumerate(unidades):\n        id_elo = str(u.get(\"ID_ELO\", \"\"))\n        periodo = str(u.get(\"Periodo\", \"\"))\n        if id_elo and id_elo not in ids_conectados:\n            report.add(RelationalIssue(\n                severidade=Severidade.INFO,\n                entidade=\"unidade\",\n                indice=idx,\n                campo=\"ID_ELO\",\n                mensagem=f\"Unidade '{id_elo}' n\u00e3o possui conex\u00f5es (isolada no grafo).\",\n                pk_value=f\"(ID_ELO={id_elo}, Periodo={periodo})\",\n                rule_type=\"orfao\",\n            ))\n\n    # Tecnologias n\u00e3o utilizadas\n    tecnologias = data.get(\"tecnologias\", [])\n    tec_usadas: Set[str] = set()\n    for u in unidades:\n        t = u.get(\"Tecnologia\")\n        if t and str(t) != \"None\":\n            tec_usadas.add(str(t))\n    for idx, t in enumerate(tecnologias):\n        tid = str(t.get(\"id\", \"\"))\n        if tid and tid not in tec_usadas:\n            report.add(RelationalIssue(\n                severidade=Severidade.INFO,\n                entidade=\"tecnologia\",\n                indice=idx,\n                campo=\"id\",\n                mensagem=f\"Tecnologia '{tid}' n\u00e3o est\u00e1 atribu\u00edda a nenhuma unidade.\",\n                pk_value=f\"(id={tid})\",\n                rule_type=\"orfao\",\n            ))\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  VALIDA\u00c7\u00c3O COMPLETA\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef validar_integridade_relacional(\n    data: Dict[str, Any],\n    *,\n    incluir_orfaos: bool = True,\n    incluir_consumiveis: bool = True,\n) -> RelationalReport:\n    \"\"\"Executa valida\u00e7\u00e3o relacional completa dos dados.\n\n    Verifica:\n    1. Unicidade de chaves prim\u00e1rias\n    2. Integridade referencial (FK \u2192 PK)\n    3. Consist\u00eancia de per\u00edodo entre conex\u00f5es e unidades\n    4. Consum\u00edveis referenciados existem nos fatores\n    5. Regras de dom\u00ednio (ranges, tipos)\n    6. Registros \u00f3rf\u00e3os (unidades sem conex\u00e3o, tecnologias sem uso)\n\n    Args:\n        data: Dicion\u00e1rio no formato do schema do banco de dados.\n        incluir_orfaos: Se True, reporta registros \u00f3rf\u00e3os (info).\n        incluir_consumiveis: Se True, valida consum\u00edveis vs fatores.\n\n    Returns:\n        RelationalReport com todas as inconsist\u00eancias encontradas.\n    \"\"\"\n    report = RelationalReport()\n\n    # 1. Chaves prim\u00e1rias\n    pk_sets = validar_chaves_primarias(data, report)\n\n    # 2. Chaves estrangeiras\n    validar_chaves_estrangeiras(data, pk_sets, report)\n\n    # 3. Consist\u00eancia de per\u00edodo\n    validar_periodo_consistencia(data, report)\n\n    # 4. Consum\u00edveis \u00d7 Fatores\n    if incluir_consumiveis:\n        validar_consumiveis_fatores(data, report)\n\n    # 5. Regras de dom\u00ednio\n    validar_regras_dominio(data, report)\n\n    # 6. \u00d3rf\u00e3os\n    if incluir_orfaos:\n        validar_orfaos(data, report)\n\n    return report\n\n\ndef formatar_relatorio_markdown(report: RelationalReport) -> str:\n    \"\"\"Formata o relat\u00f3rio como Markdown para exibi\u00e7\u00e3o em Streamlit.\"\"\"\n    lines = []\n\n    if report.is_valid and not report.has_warnings:\n        lines.append(\"### \u2705 Valida\u00e7\u00e3o Relacional \u2014 OK\")\n        lines.append(\"\")\n        lines.append(\"Nenhuma inconsist\u00eancia encontrada nos dados.\")\n    elif report.is_valid:\n        lines.append(\"### \u26a0\ufe0f Valida\u00e7\u00e3o Relacional \u2014 OK com Avisos\")\n    else:\n        lines.append(\"### \u274c Valida\u00e7\u00e3o Relacional \u2014 Inconsist\u00eancias Encontradas\")\n\n    # Stats\n    if report.stats:\n        lines.append(\"\")\n        lines.append(\"**Registros analisados:**\")\n        for entity, count in report.stats.items():\n            lines.append(f\"- {entity.title()}: {count}\")\n\n    # Errors\n    if report.errors:\n        lines.append(\"\")\n        lines.append(f\"#### Erros ({len(report.errors)})\")\n        lines.append(\"\")\n        lines.append(\"| # | Entidade | Campo | PK | Tipo | Mensagem |\")\n        lines.append(\"|---|----------|-------|----|------|----------|\")\n        for i, e in enumerate(report.errors, 1):\n            lines.append(\n                f\"| {i} | {e.entidade} [{e.indice}] | `{e.campo}` | \"\n                f\"`{e.pk_value}` | {e.rule_type} | {e.mensagem} |\"\n            )\n\n    # Warnings\n    if report.warnings:\n        lines.append(\"\")\n        lines.append(f\"#### Avisos ({len(report.warnings)})\")\n        lines.append(\"\")\n        lines.append(\"| # | Entidade | Campo | PK | Tipo | Mensagem |\")\n        lines.append(\"|---|----------|-------|----|------|----------|\")\n        for i, w in enumerate(report.warnings, 1):\n            lines.append(\n                f\"| {i} | {w.entidade} [{w.indice}] | `{w.campo}` | \"\n                f\"`{w.pk_value}` | {w.rule_type} | {w.mensagem} |\"\n            )\n\n    # Info\n    if report.info:\n        lines.append(\"\")\n        lines.append(f\"#### Informa\u00e7\u00f5es ({len(report.info)})\")\n        lines.append(\"\")\n        for inf in report.info:\n            lines.append(f\"- \u2139\ufe0f {inf}\")\n\n    return \"\\n\".join(lines)\n", "core/validation/schema.py": "\"\"\"\nSchema e valida\u00e7\u00e3o do banco de dados JSON.\n\nDefine a estrutura can\u00f4nica, valida dados importados e gera relat\u00f3rios\nde inconsist\u00eancias.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport logging\nimport os\nfrom dataclasses import dataclass, field, asdict\nfrom datetime import datetime\nfrom typing import Any, Dict, List, Optional, Tuple\n\nlogger = logging.getLogger(__name__)\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  SCHEMA \u2014 estrutura can\u00f4nica do JSON DB\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\nSCHEMA_VERSION = \"1.3.0\"\n\n# Campos obrigat\u00f3rios por entidade\nREQUIRED_FIELDS = {\n    \"unidade\": [\n        \"ID_ELO\", \"Nome\", \"Localizacao\", \"Periodo\",\n        \"Consumiveis\", \"ConsumoEspecifico\",\n    ],\n    \"conexao\": [\"origem\", \"destino\"],\n    \"tecnologia\": [\"id\", \"nome\", \"insumos\"],\n    \"fator_emissao\": [\n        \"grupo_consumivel\", \"consumivel\", \"escopo\",\n        \"fator_emissao\", \"kgCO2e_unid\",\n    ],\n}\n\n# Campos opcionais reconhecidos por entidade\nOPTIONAL_FIELDS = {\n    \"fator_emissao\": [\"ano\", \"data_importacao\"],\n}\n\n# Tipos esperados por campo\nFIELD_TYPES = {\n    \"ID_ELO\": str,\n    \"Nome\": str,\n    \"Localizacao\": str,\n    \"Periodo\": str,\n    \"Input\": str,\n    \"MassaInput\": (int, float),\n    \"Output\": str,\n    \"MassaOutput\": (int, float),\n    \"inputs\": list,\n    \"outputs\": list,\n    \"Consumiveis\": list,\n    \"ConsumoEspecifico\": list,\n    \"TaxacaoFronteira\": bool,\n    \"TaxacaoLocal\": bool,\n    \"origem\": str,\n    \"destino\": str,\n    \"massa\": (int, float),\n    \"periodo\": str,\n    \"fator_emissao\": (int, float),\n    \"escopo\": str,\n    \"ano\": int,\n}\n\n\n@dataclass\nclass ValidationError:\n    \"\"\"Um erro de valida\u00e7\u00e3o encontrado.\"\"\"\n    entidade: str\n    indice: int\n    campo: str\n    mensagem: str\n    severidade: str = \"error\"  # \"error\" | \"warning\"\n\n    def __str__(self) -> str:\n        return f\"[{self.severidade.upper()}] {self.entidade}[{self.indice}].{self.campo}: {self.mensagem}\"\n\n\n@dataclass\nclass ValidationReport:\n    \"\"\"Resultado de uma valida\u00e7\u00e3o completa.\"\"\"\n    erros: List[ValidationError] = field(default_factory=list)\n    avisos: List[ValidationError] = field(default_factory=list)\n    total_registros: int = 0\n    registros_validos: int = 0\n\n    @property\n    def is_valid(self) -> bool:\n        return len(self.erros) == 0\n\n    def summary(self) -> str:\n        lines = [\n            f\"Valida\u00e7\u00e3o: {'\u2705 OK' if self.is_valid else '\u274c Falhou'}\",\n            f\"Registros: {self.registros_validos}/{self.total_registros} v\u00e1lidos\",\n            f\"Erros: {len(self.erros)}, Avisos: {len(self.avisos)}\",\n        ]\n        for e in self.erros[:10]:\n            lines.append(f\"  \u274c {e}\")\n        for w in self.avisos[:5]:\n            lines.append(f\"  \u26a0\ufe0f {w}\")\n        if len(self.erros) > 10:\n            lines.append(f\"  ... e mais {len(self.erros) - 10} erro(s)\")\n        return \"\\n\".join(lines)\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n#  FUN\u00c7\u00d5ES DE VALIDA\u00c7\u00c3O\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\ndef validar_entidade(\n    entidade: str,\n    dados: List[Dict[str, Any]],\n    report: Optional[ValidationReport] = None,\n) -> ValidationReport:\n    \"\"\"Valida uma lista de registros de uma entidade.\n\n    Args:\n        entidade: Nome da entidade (ex: \"unidade\", \"conexao\").\n        dados: Lista de dicts representando os registros.\n        report: Relat\u00f3rio existente para acumular (ou cria novo).\n\n    Returns:\n        ValidationReport atualizado.\n    \"\"\"\n    if report is None:\n        report = ValidationReport()\n\n    required = REQUIRED_FIELDS.get(entidade, [])\n    report.total_registros += len(dados)\n\n    for idx, reg in enumerate(dados):\n        erros_antes = len(report.erros)\n\n        # Verificar campos obrigat\u00f3rios\n        for campo in required:\n            if campo not in reg or reg[campo] is None:\n                report.erros.append(ValidationError(\n                    entidade=entidade, indice=idx, campo=campo,\n                    mensagem=f\"Campo obrigat\u00f3rio ausente.\",\n                ))\n            elif campo in FIELD_TYPES:\n                tipo_esperado = FIELD_TYPES[campo]\n                if not isinstance(reg[campo], tipo_esperado):\n                    report.avisos.append(ValidationError(\n                        entidade=entidade, indice=idx, campo=campo,\n                        mensagem=f\"Tipo inesperado: {type(reg[campo]).__name__} (esperado {tipo_esperado})\",\n                        severidade=\"warning\",\n                    ))\n\n        # Valida\u00e7\u00f5es espec\u00edficas por entidade\n        if entidade == \"unidade\":\n            _validar_unidade(reg, idx, report)\n        elif entidade == \"fator_emissao\":\n            _validar_fator(reg, idx, report)\n\n        if len(report.erros) == erros_antes:\n            report.registros_validos += 1\n\n    return report\n\n\ndef _validar_unidade(reg: Dict, idx: int, report: ValidationReport) -> None:\n    \"\"\"Valida\u00e7\u00f5es espec\u00edficas de unidade produtiva.\"\"\"\n    inputs = reg.get(\"inputs\", []) if isinstance(reg.get(\"inputs\", []), list) else []\n    outputs = reg.get(\"outputs\", []) if isinstance(reg.get(\"outputs\", []), list) else []\n\n    # Compatibilidade com legado (campos \u00fanicos)\n    if not inputs and (reg.get(\"Input\") is not None or reg.get(\"MassaInput\") is not None):\n        inputs = [{\n            \"produto_id\": reg.get(\"Input\", \"\"),\n            \"quantidade\": reg.get(\"MassaInput\", 0.0),\n            \"unidade\": \"t\",\n        }]\n\n    if not outputs and (reg.get(\"Output\") is not None or reg.get(\"MassaOutput\") is not None):\n        outputs = [{\n            \"produto_id\": reg.get(\"Output\", \"\"),\n            \"quantidade\": reg.get(\"MassaOutput\", 0.0),\n            \"unidade\": \"t\",\n        }]\n\n    if not inputs:\n        report.erros.append(ValidationError(\n            entidade=\"unidade\", indice=idx, campo=\"inputs\",\n            mensagem=\"A unidade deve possuir ao menos 1 input.\",\n        ))\n\n    if not outputs:\n        report.erros.append(ValidationError(\n            entidade=\"unidade\", indice=idx, campo=\"outputs\",\n            mensagem=\"A unidade deve possuir ao menos 1 output.\",\n        ))\n\n    for i, item in enumerate(inputs):\n        if not isinstance(item, dict):\n            report.erros.append(ValidationError(\n                entidade=\"unidade\", indice=idx, campo=f\"inputs[{i}]\",\n                mensagem=\"Item de input inv\u00e1lido (esperado objeto).\",\n            ))\n            continue\n        produto = str(item.get(\"produto_id\", \"\") or \"\").strip()\n        if not produto:\n            report.erros.append(ValidationError(\n                entidade=\"unidade\", indice=idx, campo=f\"inputs[{i}].produto_id\",\n                mensagem=\"produto_id obrigat\u00f3rio em input.\",\n            ))\n        try:\n            qtd = float(item.get(\"quantidade\", 0.0) or 0.0)\n        except (TypeError, ValueError):\n            qtd = -1.0\n        if qtd <= 0:\n            report.erros.append(ValidationError(\n                entidade=\"unidade\", indice=idx, campo=f\"inputs[{i}].quantidade\",\n                mensagem=\"Quantidade de input deve ser > 0.\",\n            ))\n\n    for i, item in enumerate(outputs):\n        if not isinstance(item, dict):\n            report.erros.append(ValidationError(\n                entidade=\"unidade\", indice=idx, campo=f\"outputs[{i}]\",\n                mensagem=\"Item de output inv\u00e1lido (esperado objeto).\",\n            ))\n            continue\n        produto = str(item.get(\"produto_id\", \"\") or \"\").strip()\n        if not produto:\n            report.erros.append(ValidationError(\n                entidade=\"unidade\", indice=idx, campo=f\"outputs[{i}].produto_id\",\n                mensagem=\"produto_id obrigat\u00f3rio em output.\",\n            ))\n        try:\n            qtd = float(item.get(\"quantidade\", 0.0) or 0.0)\n        except (TypeError, ValueError):\n            qtd = -1.0\n        if qtd <= 0:\n            report.erros.append(ValidationError(\n                entidade=\"unidade\", indice=idx, campo=f\"outputs[{i}].quantidade\",\n                mensagem=\"Quantidade de output deve ser > 0.\",\n            ))\n\n    # Massa positiva\n    for campo in (\"MassaInput\", \"MassaOutput\"):\n        val = reg.get(campo, 0)\n        if isinstance(val, (int, float)) and val < 0:\n            report.erros.append(ValidationError(\n                entidade=\"unidade\", indice=idx, campo=campo,\n                mensagem=f\"Massa n\u00e3o pode ser negativa ({val}).\",\n            ))\n\n    # Consum\u00edveis e ConsumoEspecifico devem ter mesmo tamanho\n    cons = reg.get(\"Consumiveis\", [])\n    ce = reg.get(\"ConsumoEspecifico\", [])\n    if len(cons) != len(ce):\n        report.erros.append(ValidationError(\n            entidade=\"unidade\", indice=idx, campo=\"Consumiveis/ConsumoEspecifico\",\n            mensagem=f\"Tamanhos divergem: {len(cons)} consum\u00edveis vs {len(ce)} consumos espec\u00edficos.\",\n        ))\n\n    # Validar campo Periodo com parser\n    periodo = reg.get(\"Periodo\", \"\")\n    if periodo:\n        try:\n            from core.periodos import parse_periodo\n            parse_periodo(str(periodo))\n        except Exception as exc:\n            report.avisos.append(ValidationError(\n                entidade=\"unidade\", indice=idx, campo=\"Periodo\",\n                mensagem=f\"Per\u00edodo inv\u00e1lido: {exc}\",\n                severidade=\"warning\",\n            ))\n\n\ndef _validar_fator(reg: Dict, idx: int, report: ValidationReport) -> None:\n    \"\"\"Valida\u00e7\u00f5es espec\u00edficas de fator de emiss\u00e3o.\"\"\"\n    fator = reg.get(\"fator_emissao\", 0)\n    if isinstance(fator, (int, float)) and fator < 0:\n        report.avisos.append(ValidationError(\n            entidade=\"fator_emissao\", indice=idx, campo=\"fator_emissao\",\n            mensagem=f\"Fator de emiss\u00e3o negativo ({fator}).\",\n            severidade=\"warning\",\n        ))\n\n\ndef validar_database(data: Dict[str, Any]) -> ValidationReport:\n    \"\"\"Valida um database completo (todas as entidades).\"\"\"\n    report = ValidationReport()\n\n    # Metadados\n    if \"schema_version\" not in data:\n        report.avisos.append(ValidationError(\n            entidade=\"metadata\", indice=0, campo=\"schema_version\",\n            mensagem=\"Campo schema_version ausente.\",\n            severidade=\"warning\",\n        ))\n\n    # Entidades\n    for entidade in (\"unidades\", \"conexoes\", \"tecnologias\", \"fatores_emissao\"):\n        registros = data.get(entidade, [])\n        nome_singular = entidade.rstrip(\"s\").rstrip(\"e\")\n        if entidade == \"fatores_emissao\":\n            nome_singular = \"fator_emissao\"\n        elif entidade == \"conexoes\":\n            nome_singular = \"conexao\"\n        elif entidade == \"unidades\":\n            nome_singular = \"unidade\"\n        elif entidade == \"tecnologias\":\n            nome_singular = \"tecnologia\"\n        validar_entidade(nome_singular, registros, report)\n\n    # Verificar integridade referencial\n    _validar_referencias(data, report)\n\n    # Validar exist\u00eancia de produto e fator para produto+ano\n    _validar_produtos_e_fatores(data, report)\n\n    # Verificar unicidade de chaves\n    _validar_unicidade(data, report)\n\n    return report\n\n\ndef _validar_produtos_e_fatores(data: Dict[str, Any], report: ValidationReport) -> None:\n    \"\"\"Valida produtos dos inputs/outputs e fator existente por produto+ano.\"\"\"\n    fatores = data.get(\"fatores_emissao\", [])\n    produtos_fatores = {\n        str(f.get(\"consumivel\", \"\") or \"\").strip().upper()\n        for f in fatores\n        if str(f.get(\"consumivel\", \"\") or \"\").strip()\n    }\n\n    fator_keys = set()\n    fator_global = set()\n    for f in fatores:\n        produto = str(f.get(\"consumivel\", \"\") or \"\").strip().upper()\n        escopo = str(f.get(\"escopo\", \"\") or \"\").strip().upper()\n        ano = f.get(\"ano\", None)\n        if not produto or not escopo:\n            continue\n        if ano is None or str(ano).strip() == \"\":\n            fator_global.add((produto, escopo))\n        else:\n            try:\n                fator_keys.add((produto, escopo, int(ano)))\n            except (TypeError, ValueError):\n                continue\n\n    for idx, reg in enumerate(data.get(\"unidades\", [])):\n        try:\n            ano = int(float(str(reg.get(\"Periodo\", \"\")).strip()))\n        except (TypeError, ValueError):\n            ano = None\n\n        inputs = reg.get(\"inputs\", []) if isinstance(reg.get(\"inputs\", []), list) else []\n        outputs = reg.get(\"outputs\", []) if isinstance(reg.get(\"outputs\", []), list) else []\n\n        if not inputs and reg.get(\"Input\"):\n            inputs = [{\"produto_id\": reg.get(\"Input\", \"\")}]\n        if not outputs and reg.get(\"Output\"):\n            outputs = [{\"produto_id\": reg.get(\"Output\", \"\")}]\n\n        for i, item in enumerate(inputs):\n            produto = str(item.get(\"produto_id\", \"\") or \"\").strip().upper()\n            if not produto:\n                continue\n            if produto not in produtos_fatores:\n                report.avisos.append(ValidationError(\n                    entidade=\"unidade\", indice=idx, campo=f\"inputs[{i}].produto_id\",\n                    mensagem=f\"Produto '{produto}' n\u00e3o existe na base de fatores.\",\n                    severidade=\"warning\",\n                ))\n                continue\n\n            has_factor = False\n            for esc in (\"1\", \"2\", \"3\"):\n                scope_key = f\"SCOPE {esc}\"\n                if ano is not None and (produto, scope_key, ano) in fator_keys:\n                    has_factor = True\n                    break\n                if (produto, scope_key) in fator_global:\n                    has_factor = True\n                    break\n\n            if not has_factor:\n                report.avisos.append(ValidationError(\n                    entidade=\"unidade\", indice=idx, campo=f\"inputs[{i}]\",\n                    mensagem=(\n                        f\"Fator inexistente para produto '{produto}' no ano {ano}.\"\n                    ),\n                    severidade=\"warning\",\n                ))\n\n        for i, item in enumerate(outputs):\n            produto = str(item.get(\"produto_id\", \"\") or \"\").strip().upper()\n            if produto and produto not in produtos_fatores:\n                report.avisos.append(ValidationError(\n                    entidade=\"unidade\", indice=idx, campo=f\"outputs[{i}].produto_id\",\n                    mensagem=f\"Produto de output '{produto}' n\u00e3o encontrado na base de fatores.\",\n                    severidade=\"warning\",\n                ))\n\n\ndef _validar_referencias(data: Dict[str, Any], report: ValidationReport) -> None:\n    \"\"\"Verifica que as conex\u00f5es referenciam unidades existentes.\"\"\"\n    ids_unidades = {u.get(\"ID_ELO\") for u in data.get(\"unidades\", [])}\n    ids_tecnologias = {t.get(\"id\") for t in data.get(\"tecnologias\", [])}\n\n    for idx, conn in enumerate(data.get(\"conexoes\", [])):\n        for campo in (\"origem\", \"destino\"):\n            ref = conn.get(campo)\n            if ref and ref not in ids_unidades:\n                report.erros.append(ValidationError(\n                    entidade=\"conexao\", indice=idx, campo=campo,\n                    mensagem=f\"Refer\u00eancia para unidade inexistente: '{ref}'.\",\n                ))\n\n    for idx, u in enumerate(data.get(\"unidades\", [])):\n        tec_id = u.get(\"Tecnologia\")\n        if tec_id and isinstance(tec_id, str) and tec_id not in ids_tecnologias:\n            report.avisos.append(ValidationError(\n                entidade=\"unidade\", indice=idx, campo=\"Tecnologia\",\n                mensagem=f\"Refer\u00eancia para tecnologia inexistente: '{tec_id}'.\",\n                severidade=\"warning\",\n            ))\n\n\ndef _validar_unicidade(data: Dict[str, A
