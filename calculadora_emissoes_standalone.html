           else 0\n                )\n            )\n            if novo_modelo != st.session_state.get(\"modelo_selecionado\"):\n                st.session_state.modelo_selecionado = novo_modelo\n            \n            # Limpar hist\u00f3rico\n            if st.button(\"Limpar Conversa\", use_container_width=True):\n                st.session_state.chat_history = []\n                st.rerun()\n            \n            # Remover API key\n            if st.button(\"Remover API Key\", use_container_width=True):\n                del st.session_state.openrouter_api_key\n                st.rerun()\n            \n            st.divider()\n            \n            # Mostrar contexto do processo\n            self._render_contexto_sidebar()\n        \n        # Inicializar hist\u00f3rico de chat\n        if \"chat_history\" not in st.session_state:\n            st.session_state.chat_history = []\n        \n        # Exibir hist\u00f3rico de mensagens\n        for msg in st.session_state.chat_history:\n            with st.chat_message(msg[\"role\"]):\n                st.markdown(msg[\"content\"])\n        \n        # Input do usu\u00e1rio\n        if prompt := st.chat_input(\"Digite sua pergunta sobre o processo industrial...\"):\n            # Adicionar mensagem do usu\u00e1rio ao hist\u00f3rico\n            st.session_state.chat_history.append({\n                \"role\": \"user\",\n                \"content\": prompt\n            })\n            \n            # Exibir mensagem do usu\u00e1rio\n            with st.chat_message(\"user\"):\n                st.markdown(prompt)\n            \n            # Gerar resposta do assistente\n            with st.chat_message(\"assistant\"):\n                with st.spinner(\"Pensando...\"):\n                    resposta = self._gerar_resposta(prompt)\n                    st.markdown(resposta)\n            \n            # Adicionar resposta ao hist\u00f3rico\n            st.session_state.chat_history.append({\n                \"role\": \"assistant\",\n                \"content\": resposta\n            })\n            \n            st.rerun()\n    \n    def _render_contexto_sidebar(self):\n        \"\"\"Renderiza informa\u00e7\u00f5es de contexto na sidebar\"\"\"\n        st.markdown(\"### Contexto do Processo\")\n        \n        unidades = st.session_state.get(\"unidades\", [])\n        fatores = st.session_state.get(\"fatores_emissao\", [])\n        \n        if unidades:\n            st.metric(\"Unidades Produtivas\", len(unidades))\n            \n            _mu   = get_default_mass_unit_from_session(st.session_state)\n            _lbl  = co2e_label(_mu)\n            _int  = co2e_intensity_label(_mu)\n            # Calcular emiss\u00e3o total\n            emissao_total = sum(\n                getattr(u, 'IntensidadeEmissao', 0) * getattr(u, 'MassaOutput', 0) \n                for u in unidades\n            )\n            st.metric(\"Emiss\u00e3o Total\", f\"{convert_co2e(emissao_total, _mu):.2f} {_lbl}\")\n            \n            # Intensidade m\u00e9dia\n            if unidades:\n                intensidade_media = sum(\n                    getattr(u, 'IntensidadeEmissao', 0) for u in unidades\n                ) / len(unidades)\n                st.metric(\"Intensidade M\u00e9dia\", f\"{convert_co2e(intensidade_media, 't'):.3f} {_int}\")\n        else:\n            st.info(\"Nenhuma unidade cadastrada ainda.\")\n        \n        if fatores:\n            st.metric(\"Fatores de Emiss\u00e3o\", len(fatores))\n        \n        # Op\u00e7\u00e3o de incluir dados detalhados\n        if st.checkbox(\"\ud83d\udccb Incluir dados detalhados no contexto\", value=True):\n            st.session_state.incluir_contexto_detalhado = True\n        else:\n            st.session_state.incluir_contexto_detalhado = False\n    \n    def _preparar_contexto_sistema(self) -> str:\n        \"\"\"Prepara o contexto do sistema com informa\u00e7\u00f5es do processo\"\"\"\n        contexto = \"\"\"Voc\u00ea \u00e9 um assistente especializado em an\u00e1lise de emiss\u00f5es de carbono e processos industriais. \n        \nVoc\u00ea est\u00e1 auxiliando um usu\u00e1rio que utiliza uma Calculadora de Emiss\u00f5es de Carbono - CMP, uma ferramenta para an\u00e1lise de emiss\u00f5es de GEE em cadeias produtivas.\n\nSuas capacidades incluem:\n- Analisar dados de emiss\u00f5es por escopo (1, 2, 3)\n- Sugerir melhorias e tecnologias alternativas\n- Explicar c\u00e1lculos de intensidade de emiss\u00e3o e pegada de carbono\n- Interpretar fluxos de massa e energia\n- Recomendar boas pr\u00e1ticas de redu\u00e7\u00e3o de emiss\u00f5es\n\n\"\"\"\n        \n        # Adicionar contexto detalhado se solicitado\n        if st.session_state.get(\"incluir_contexto_detalhado\", True):\n            unidades = st.session_state.get(\"unidades\", [])\n            fatores = st.session_state.get(\"fatores_emissao\", [])\n            \n            if unidades:\n                contexto += f\"\\n**PROCESSO ATUAL:**\\n\"\n                contexto += f\"- Total de unidades produtivas: {len(unidades)}\\n\"\n                \n                for i, u in enumerate(unidades[:5], 1):  # Limitar a 5 unidades para n\u00e3o exceder tokens\n                    _mu_ctx  = get_default_mass_unit_from_session(st.session_state)\n                    _lbl_ctx = co2e_label(_mu_ctx)\n                    _int_ctx = co2e_intensity_label(_mu_ctx)\n                    contexto += f\"\\n{i}. {getattr(u, 'Nome', 'Unidade')}:\\n\"\n                    contexto += f\"   - Localiza\u00e7\u00e3o: {getattr(u, 'Localizacao', 'N/A')}\\n\"\n                    contexto += f\"   - Massa Output: {getattr(u, 'MassaOutput', 0):.2f} t\\n\"\n                    contexto += f\"   - Intensidade Emiss\u00e3o: {convert_co2e(getattr(u, 'IntensidadeEmissao', 0), 't'):.3f} {_int_ctx}\\n\"\n                    contexto += f\"   - Pegada Total: {convert_co2e(getattr(u, 'Pegada', 0) * getattr(u, 'MassaOutput', 0), _mu_ctx):.2f} {_lbl_ctx}\\n\"\n                    \n                    # Consum\u00edveis\n                    consumiveis = getattr(u, 'Consumiveis', [])\n                    if consumiveis:\n                        contexto += f\"   - Consum\u00edveis: {', '.join([c.get('nome', 'N/A') for c in consumiveis[:3]])}\\n\"\n                \n                if len(unidades) > 5:\n                    contexto += f\"\\n... e mais {len(unidades) - 5} unidades.\\n\"\n            \n            if fatores:\n                contexto += f\"\\n**FATORES DE EMISS\u00c3O DISPON\u00cdVEIS:** {len(fatores)} fatores cadastrados\\n\"\n                # Listar alguns fatores\n                for f in fatores[:5]:\n                    contexto += f\"- {f.get('consumivel', 'N/A')}: {f.get('fator_emissao', 0):.3f} kgCO\u2082e/{f.get('kgCO2e_unid', 'unid')} (Escopo {f.get('escopo', 'N/A')})\\n\"\n        \n        contexto += \"\\nResponda de forma clara, t\u00e9cnica quando necess\u00e1rio, mas acess\u00edvel. Seja proativo em sugerir melhorias e an\u00e1lises.\"\n        \n        return contexto\n    \n    def _gerar_resposta(self, pergunta: str) -> str:\n        \"\"\"Gera resposta usando a API da OpenRouter\"\"\"\n        try:\n            # Preparar mensagens\n            mensagens = [\n                {\n                    \"role\": \"system\",\n                    \"content\": self._preparar_contexto_sistema()\n                }\n            ]\n            \n            # Adicionar hist\u00f3rico recente (\u00faltimas 10 mensagens para n\u00e3o exceder limite)\n            historico_recente = st.session_state.chat_history[-10:]\n            for msg in historico_recente:\n                mensagens.append({\n                    \"role\": msg[\"role\"],\n                    \"content\": msg[\"content\"]\n                })\n            \n            # Adicionar pergunta atual\n            mensagens.append({\n                \"role\": \"user\",\n                \"content\": pergunta\n            })\n            \n            # Fazer requisi\u00e7\u00e3o \u00e0 API\n            headers = {\n                \"Authorization\": f\"Bearer {st.session_state.openrouter_api_key}\",\n                \"Content-Type\": \"application/json\"\n            }\n            \n            payload = {\n                \"model\": st.session_state.get(\"modelo_selecionado\", self.modelos_disponiveis[0]),\n                \"messages\": mensagens,\n                \"temperature\": 0.7,\n                \"max_tokens\": 1000\n            }\n            \n            response = requests.post(\n                self.openrouter_url,\n                headers=headers,\n                json=payload,\n                timeout=30\n            )\n            \n            if response.status_code == 200:\n                result = response.json()\n                return result[\"choices\"][0][\"message\"][\"content\"]\n            else:\n                erro = response.json() if response.text else {\"error\": \"Erro desconhecido\"}\n                return f\"\u274c Erro ao gerar resposta: {response.status_code}\\n\\n{erro}\"\n        \n        except requests.exceptions.Timeout:\n            return \"\u23f1\ufe0f A requisi\u00e7\u00e3o demorou muito. Tente novamente.\"\n        except requests.exceptions.RequestException as e:\n            return f\"\u274c Erro de conex\u00e3o: {str(e)}\"\n        except Exception as e:\n            return f\"\u274c Erro inesperado: {str(e)}\"\n", "tabs/FatoresEmissao.py": "import streamlit as st\nimport pandas as pd\nimport json\nimport os\nimport sys\nfrom datetime import datetime\nfrom io import BytesIO\n\n# Ensure core is importable\n_root_dir = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\nif _root_dir not in sys.path:\n    sys.path.insert(0, _root_dir)\n\nfrom core.context import AppContext\nfrom core.io.json_io import load_fatores_emissao, save_fatores_emissao\nfrom core.units import co2e_label\nfrom core.periodos import parse_periodo, PeriodoError\n\n\ndef _normalizar_ano_fator(val):\n    if val is None or str(val).strip() == \"\" or str(val).strip().lower() in (\"nan\", \"none\"):\n        return None\n    try:\n        return int(float(val))\n    except (ValueError, TypeError):\n        return None\n\n\ndef _explodir_anos_fator(ano_val, periodo_val):\n    \"\"\"Resolve anos de um fator a partir de Ano (num\u00e9rico) ou Periodo (texto).\n\n    Retorna lista de anos (int) ou [None] para fator global.\n    \"\"\"\n    ano_norm = _normalizar_ano_fator(ano_val)\n    if ano_norm is not None:\n        return [ano_norm]\n\n    periodo_txt = \"\" if periodo_val is None else str(periodo_val).strip()\n    if not periodo_txt or periodo_txt.lower() in (\"nan\", \"none\"):\n        return [None]\n\n    try:\n        anos = parse_periodo(periodo_txt)\n        return [int(a) for a in anos]\n    except PeriodoError:\n        return []\n\nclass FatoresEmissaoTab:\n    \"\"\"Classe para gerenciar a aba de Fatores de Emiss\u00e3o no Streamlit.\"\"\"\n\n    def __init__(self):\n        ctx = AppContext.get()\n        self.CAMINHO_JSON = ctx.fatores_path()\n\n    def _render(self):\n        self._inicializar_fatores()\n        self._render_tabela_com_filtros()\n        self._render_exportacao_base()\n        self._render_importacao_planilha()\n        self._render_adicao_manual()\n\n    def _inicializar_fatores(self):\n        if \"fatores_emissao\" not in st.session_state:\n            fatores = load_fatores_emissao(self.CAMINHO_JSON)\n            st.session_state.fatores_emissao = fatores\n\n    def _render_importacao_planilha(self):\n        with st.expander(\"\ud83d\udce5 Importar Fatores de Emiss\u00e3o (.xlsx)\"):\n            uploaded_file = st.file_uploader(\"Selecione o arquivo Excel\", type=[\"xlsx\"])\n            acao_duplicado = st.radio(\"Se o fator j\u00e1 existir:\", [\"Substituir\", \"Descartar\"], horizontal=True)\n\n            if uploaded_file and st.button(\"\ud83d\udcc4 Importar Planilha\"):\n                try:\n                    df_importado = pd.read_excel(uploaded_file, engine=\"calamine\")\n                    df_importado.columns = [c.replace(\" *\", \"\").replace(\"*\", \"\").strip() for c in df_importado.columns]\n                    col_map = {\n                        \"Grupo_Consumivel\": \"grupo_consumivel\",\n                        \"Consumivel\": \"consumivel\",\n                        \"Escopo\": \"escopo\",\n                        \"Ano\": \"ano\",\n                        \"Periodo\": \"periodo\",\n                        \"Fator_Emissao\": \"fator_emissao\",\n                        \"kgCO2e_Unid\": \"kgCO2e_unid\",\n                    }\n                    df_importado = df_importado.rename(columns={k: v for k, v in col_map.items() if k in df_importado.columns})\n                    if \"ano\" not in df_importado.columns:\n                        df_importado[\"ano\"] = None\n                    if \"periodo\" not in df_importado.columns:\n                        df_importado[\"periodo\"] = None\n\n                    required = [\"grupo_consumivel\", \"consumivel\", \"escopo\", \"fator_emissao\", \"kgCO2e_unid\"]\n                    faltantes = [c for c in required if c not in df_importado.columns]\n                    if faltantes:\n                        st.error(f\"Colunas obrigat\u00f3rias ausentes na planilha: {', '.join(faltantes)}\")\n                        return\n\n                    df_importado = df_importado.dropna(how=\"all\")\n                    df_importado = df_importado[df_importado[\"consumivel\"].notna()]\n                    df_importado[\"data_importacao\"] = datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n\n                    self._processar_importacao(df_importado, acao_duplicado)\n                    st.rerun()\n                except Exception as e:\n                    st.error(f\"Erro ao importar: {e}\")\n\n    def _processar_importacao(self, df_importado, acao_duplicado):\n        fatores_existentes = pd.DataFrame(st.session_state.fatores_emissao)\n        if \"ano\" not in fatores_existentes.columns:\n            fatores_existentes[\"ano\"] = None\n        fatores_existentes[\"ano\"] = fatores_existentes[\"ano\"].apply(_normalizar_ano_fator)\n        novos_fatores = []\n        periodos_invalidos = 0\n\n        for _, row in df_importado.iterrows():\n            anos_explodidos = _explodir_anos_fator(row.get(\"ano\"), row.get(\"periodo\"))\n            if not anos_explodidos:\n                periodos_invalidos += 1\n                continue\n\n            for ano_item in anos_explodidos:\n                if not fatores_existentes.empty:\n                    mask = (\n                        (fatores_existentes[\"grupo_consumivel\"] == row[\"grupo_consumivel\"]) &\n                        (fatores_existentes[\"consumivel\"] == row[\"consumivel\"]) &\n                        (fatores_existentes[\"escopo\"] == row[\"escopo\"]) &\n                        (fatores_existentes[\"ano\"].fillna(-1) == (ano_item if ano_item is not None else -1))\n                    )\n                    if mask.any():\n                        if acao_duplicado == \"Substituir\":\n                            fatores_existentes.loc[mask, [\"fator_emissao\", \"kgCO2e_unid\", \"ano\", \"data_importacao\"]] = (\n                                row[\"fator_emissao\"], row[\"kgCO2e_unid\"], ano_item, row[\"data_importacao\"]\n                            )\n                        continue\n\n                novo = {\n                    \"grupo_consumivel\": row[\"grupo_consumivel\"],\n                    \"consumivel\": row[\"consumivel\"],\n                    \"escopo\": row[\"escopo\"],\n                    \"fator_emissao\": row[\"fator_emissao\"],\n                    \"kgCO2e_unid\": row[\"kgCO2e_unid\"],\n                    \"data_importacao\": row[\"data_importacao\"],\n                }\n                if ano_item is not None:\n                    novo[\"ano\"] = int(ano_item)\n                novos_fatores.append(novo)\n\n        st.session_state.fatores_emissao = fatores_existentes.to_dict(orient=\"records\") + novos_fatores\n\n        save_fatores_emissao(self.CAMINHO_JSON, st.session_state.fatores_emissao)\n\n        if periodos_invalidos:\n            st.warning(\n                f\"{periodos_invalidos} registro(s) ignorado(s) por per\u00edodo inv\u00e1lido. \"\n                \"Use formatos como 2023, 2020-2024 ou 2020-2024, 2026.\"\n            )\n        st.success(f\"Importa\u00e7\u00e3o conclu\u00edda. {len(novos_fatores)} novo(s) fator(es) adicionados ap\u00f3s explos\u00e3o de per\u00edodo.\")\n\n    def _render_tabela_com_filtros(self):\n        df_fatores = pd.DataFrame(st.session_state.fatores_emissao)\n        if df_fatores.empty:\n            st.info(\"Nenhum fator de emiss\u00e3o registrado.\")\n            return\n\n        # Garantir vis\u00e3o completa e ordenada das colunas\n        for col in [\"grupo_consumivel\", \"consumivel\", \"escopo\", \"ano\", \"fator_emissao\", \"kgCO2e_unid\", \"data_importacao\"]:\n            if col not in df_fatores.columns:\n                df_fatores[col] = None\n        df_fatores[\"ano\"] = df_fatores[\"ano\"].apply(_normalizar_ano_fator)\n        df_fatores[\"periodo\"] = df_fatores[\"ano\"].apply(\n            lambda a: \"Global\" if _normalizar_ano_fator(a) is None else str(_normalizar_ano_fator(a))\n        )\n        colunas_visao = [\n            \"grupo_consumivel\", \"consumivel\", \"escopo\", \"ano\", \"periodo\",\n            \"fator_emissao\", \"kgCO2e_unid\", \"data_importacao\"\n        ]\n        df_fatores = df_fatores[colunas_visao]\n\n        st.sidebar.header(\"\ud83d\udd0d Filtros\")\n        grupo = st.sidebar.selectbox(\"Grupo do Consum\u00edvel\", [\"Todos\"] + sorted(df_fatores[\"grupo_consumivel\"].unique()))\n        escopo = st.sidebar.selectbox(\"Escopo\", [\"Todos\"] + sorted(df_fatores[\"escopo\"].unique()))\n        anos_disponiveis = sorted({\n            \"Global\" if _normalizar_ano_fator(a) is None else str(_normalizar_ano_fator(a))\n            for a in df_fatores.get(\"ano\", pd.Series(dtype=object)).tolist()\n        })\n        ano = st.sidebar.selectbox(\"Per\u00edodo (ano)\", [\"Todos\"] + anos_disponiveis)\n        busca = st.sidebar.text_input(\"Buscar por Consum\u00edvel\")\n\n        df_filtrado = df_fatores.copy()\n        if grupo != \"Todos\":\n            df_filtrado = df_filtrado[df_filtrado[\"grupo_consumivel\"] == grupo]\n        if escopo != \"Todos\":\n            df_filtrado = df_filtrado[df_filtrado[\"escopo\"] == escopo]\n        if ano != \"Todos\":\n            if ano == \"Global\":\n                df_filtrado = df_filtrado[df_filtrado.get(\"ano\", pd.Series(dtype=object)).apply(_normalizar_ano_fator).isna()]\n            else:\n                df_filtrado = df_filtrado[df_filtrado.get(\"ano\", pd.Series(dtype=object)).apply(_normalizar_ano_fator) == int(ano)]\n        if busca:\n            df_filtrado = df_filtrado[df_filtrado[\"consumivel\"].str.contains(busca, case=False)]\n\n        st.subheader(\"Fator de Emiss\u00e3o\")\n        df_editado = st.data_editor(\n            df_filtrado,\n            use_container_width=True,\n            num_rows=\"fixed\",\n            key=\"editor_fatores\",\n            disabled=[\"periodo\"],\n        )\n\n        if not df_editado.equals(df_filtrado):\n            if st.button(\"\ud83d\udcbe **Salvar Altera\u00e7\u00f5es**\", type=\"primary\"):\n                # i from iterrows() is already the original list position (index label\n                # inherited from df_filtrado), so use it directly \u2014 positional lookup\n                # via ids_originais[i] would fail when i > len(filtered)-1.\n                for i, row in df_editado.iterrows():\n                    row_dict = row.to_dict()\n                    row_dict[\"ano\"] = _normalizar_ano_fator(row_dict.get(\"ano\"))\n                    row_dict.pop(\"periodo\", None)\n                    st.session_state.fatores_emissao[i] = row_dict\n\n                save_fatores_emissao(self.CAMINHO_JSON, st.session_state.fatores_emissao)\n\n                st.success(\"Fatores de emiss\u00e3o atualizados com sucesso!\")\n\n    def _render_exportacao_base(self):\n        with st.expander(\"\ud83d\udce4 Exportar Base Atual de Fatores de Emiss\u00e3o\"):\n            fatores = st.session_state.get(\"fatores_emissao\", [])\n            if not fatores:\n                st.info(\"N\u00e3o h\u00e1 fatores para exportar.\")\n                return\n\n            col1, col2 = st.columns(2)\n\n            with col1:\n                json_bytes = json.dumps(fatores, ensure_ascii=False, indent=2).encode(\"utf-8\")\n                st.download_button(\n                    \"\u2b07\ufe0f Baixar JSON\",\n                    data=json_bytes,\n                    file_name=\"fatores_emissao_atual.json\",\n                    mime=\"application/json\",\n                    use_container_width=True,\n                    key=\"download_fatores_json\",\n                )\n\n            with col2:\n                df = pd.DataFrame(fatores)\n                if \"ano\" in df.columns:\n                    df[\"periodo\"] = df[\"ano\"].apply(lambda a: \"Global\" if _normalizar_ano_fator(a) is None else str(_normalizar_ano_fator(a)))\n                output = BytesIO()\n                with pd.ExcelWriter(output, engine=\"openpyxl\") as writer:\n                    df.to_excel(writer, index=False, sheet_name=\"Fatores_Emissao\")\n                output.seek(0)\n                st.download_button(\n                    \"\u2b07\ufe0f Baixar Excel\",\n                    data=output.getvalue(),\n                    file_name=\"fatores_emissao_atual.xlsx\",\n                    mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n                    use_container_width=True,\n                    key=\"download_fatores_excel\",\n                )\n\n        with st.expander(\"\ud83d\uddd1\ufe0f Apagar Base de Fatores de Emiss\u00e3o\"):\n            total = len(st.session_state.get(\"fatores_emissao\", []))\n            if total == 0:\n                st.info(\"A base j\u00e1 est\u00e1 vazia.\")\n                return\n\n            st.warning(\n                f\"Esta a\u00e7\u00e3o remover\u00e1 todos os {total} fator(es) de emiss\u00e3o da base atual.\"\n            )\n            confirmar = st.checkbox(\n                \"Confirmo que desejo apagar todos os fatores de emiss\u00e3o\",\n                key=\"confirmar_apagar_todos_fatores\",\n            )\n            if st.button(\n                \"\ud83d\uddd1\ufe0f Apagar todos os fatores\",\n                type=\"secondary\",\n                use_container_width=True,\n                key=\"apagar_todos_fatores_btn\",\n                disabled=not confirmar,\n            ):\n                st.session_state.fatores_emissao = []\n                save_fatores_emissao(self.CAMINHO_JSON, st.session_state.fatores_emissao)\n                st.success(\"Base de fatores de emiss\u00e3o apagada com sucesso.\")\n                st.rerun()\n\n    def _render_adicao_manual(self):\n        with st.expander(\"Adicionar Fator de Emiss\u00e3o Manualmente\"):\n            with st.form(\"form_manual_fator\"):\n                col1, col2 = st.columns(2)\n                with col1:\n                    grupo = st.text_input(\"Grupo do Consum\u00edvel*\", placeholder=\"Ex: Combust\u00edveis\")\n                    consumivel = st.text_input(\"Nome do Consum\u00edvel*\", placeholder=\"Ex: Diesel\")\n                    escopo = st.selectbox(\"Escopo*\", [\"1\", \"2\", \"3\"])\n                with col2:\n                    fator_emissao = st.number_input(f\"Fator de Emiss\u00e3o ({co2e_label('kg')})\", step=0.001, format=\"%.6f\")\n                    unidade = st.text_input(\"Unidade de consumo*\", placeholder=\"Ex: litro\")\n                    periodo = st.text_input(\"Per\u00edodo (opcional)\", placeholder=\"Ex: 2023 ou 2020-2024, 2026\")\n\n                if st.form_submit_button(\"Adicionar Fator\"):\n                    if not all([grupo, consumivel, escopo, unidade]) or fator_emissao <= 0:\n                        st.error(\"Preencha todos os campos obrigat\u00f3rios com valores v\u00e1lidos.\")\n                    else:\n                        anos_explodidos = _explodir_anos_fator(None, periodo)\n                        if not anos_explodidos:\n                            st.warning(\"Per\u00edodo inv\u00e1lido. Use formatos como 2023, 2020-2024 ou 2020-2024, 2026.\")\n                            return\n\n                        base = {\n                            \"grupo_consumivel\": grupo.strip(),\n                            \"consumivel\": consumivel.strip(),\n                            \"escopo\": escopo,\n                            \"fator_emissao\": fator_emissao,\n                            \"kgCO2e_unid\": unidade.strip(),\n                            \"data_importacao\": datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n                        }\n\n                        adicionados = 0\n                        duplicados = 0\n                        for ano_item in anos_explodidos:\n                            novo_fator = dict(base)\n                            if ano_item is not None:\n                                novo_fator[\"ano\"] = int(ano_item)\n\n                            ja_existe = any(\n                                f[\"grupo_consumivel\"] == novo_fator[\"grupo_consumivel\"] and\n                                f[\"consumivel\"] == novo_fator[\"consumivel\"] and\n                                f[\"escopo\"] == novo_fator[\"escopo\"] and\n                                _normalizar_ano_fator(f.get(\"ano\")) == _normalizar_ano_fator(novo_fator.get(\"ano\"))\n                                for f in st.session_state.fatores_emissao\n                            )\n\n                            if ja_existe:\n                                duplicados += 1\n                                continue\n\n                            st.session_state.fatores_emissao.append(novo_fator)\n                            adicionados += 1\n\n                        save_fatores_emissao(self.CAMINHO_JSON, st.session_state.fatores_emissao)\n\n                        if duplicados:\n                            st.warning(f\"{duplicados} registro(s) j\u00e1 existiam e foram descartados.\")\n                        st.success(f\"{adicionados} fator(es) adicionado(s) com sucesso ap\u00f3s explos\u00e3o do per\u00edodo.\")\n                        st.rerun()\n", "tabs/Fluxo.py": "import streamlit as st\nfrom config import CANVAS_CONFIG\nfrom utils import UtilsUI\nimport base64\nfrom io import BytesIO\ntry:\n    import plotly.graph_objects as go\n    PLOTLY_AVAILABLE = True\nexcept ImportError:\n    PLOTLY_AVAILABLE = False\n\nclass FluxoTab:\n    \"\"\"Classe para gerenciar o diagrama de fluxo de unidades produtivas e suas conex\u00f5es\"\"\"\n\n    def __init__(self):\n        self.utils_ui = UtilsUI()\n\n    def _render(self):\n        if not PLOTLY_AVAILABLE:\n            st.error(\"A aba de fluxo requer o pacote 'plotly', que n\u00e3o est\u00e1 dispon\u00edvel no ambiente.\")\n            st.info(\"No Streamlit Cloud, verifique o requirements.txt publicado no branch main e reinicie a aplica\u00e7\u00e3o.\")\n            return\n\n        if not st.session_state.canvas_opened_once:\n            st.session_state.refresh_canvas = True\n            st.session_state.canvas_opened_once = True\n\n        self.utils_ui.ec.propagar_pegada(st.session_state.unidades, st.session_state.edges)\n        self._render_layout_settings()\n        \n        self._render_graph()\n        self._render_selection_controls()\n\n    def _render_layout_settings(self):\n        with st.sidebar:\n            st.markdown(\"### Diagrama de Fluxo\")\n            # Modo Editor de Fluxo\n            if not st.session_state.modo_selecao:\n                if st.button(\"Ativar Modo Editor\", use_container_width=True, type=\"secondary\", key=\"activate_editor\"):\n                    self._set_selection_mode(True, True)\n            else:\n                st.info(\"**Modo de sele\u00e7\u00e3o ativo**\\n\\nClique em dois n\u00f3s no diagrama para criar uma conex\u00e3o entre eles.\")\n                if st.button(\"Desativar Modo Editor\", use_container_width=True, type=\"secondary\", key=\"deactivate_editor\"):\n                    self._set_selection_mode(False, False)\n            \n            st.markdown(\"---\")\n            \n            # Controles de exporta\u00e7\u00e3o\n            with st.expander(\"\ud83d\udce4 Exportar\"):\n                st.markdown(\"#### Exportar Fluxo\")\n                \n                st.markdown(\"#### Exportar Dados\")\n                \n                # Bot\u00e3o para JSON\n                if st.button(\"Gerar JSON\", use_container_width=True, type=\"secondary\", key=\"export_json_sidebar\"):\n                    json_data = self.utils_ui.db.export_to_json()\n                    st.download_button(\n                        label=\"\u2b07\ufe0f Baixar JSON\",\n                        data=json_data,\n                        file_name=\"fluxo_emissao.json\",\n                        mime=\"application/json\",\n                        key=\"download_json_sidebar\",\n                        use_container_width=True\n                    )\n\n            # Configura\u00e7\u00f5es do Layout\n            with st.expander(\"\u2699\ufe0f Configura\u00e7\u00f5es\"):\n                st.slider(\"Espa\u00e7amento vertical (Y)\", 100, 600, 200, step=50, key=\"esp_y\")\n                st.slider(\"Espa\u00e7amento horizontal (X)\", 100, 600, 300, step=50, key=\"esp_x\")\n                \n                st.markdown(\"---\")\n                st.markdown(\"#### Tamanho do Canvas\")\n                \n                if \"canvas_zoom\" not in st.session_state:\n                    st.session_state.canvas_zoom = 1.0\n                \n                zoom_value = st.slider(\n                    \"Multiplicador\", \n                    min_value=0.5, \n                    max_value=2.0, \n                    value=st.session_state.canvas_zoom,\n                    step=0.1,\n                    key=\"zoom_slider\"\n                )\n                \n                col1, col2, col3 = st.columns(3)\n                with col1:\n                    if st.button(\"\u2796\", use_container_width=True):\n                        st.session_state.canvas_zoom = max(0.5, st.session_state.canvas_zoom - 0.1)\n                        st.rerun()\n                with col2:\n                    if st.button(\"\ud83d\udd04\", use_container_width=True):\n                        st.session_state.canvas_zoom = 1.0\n                        st.rerun()\n                with col3:\n                    if st.button(\"\u2795\", use_container_width=True):\n                        st.session_state.canvas_zoom = min(2.0, st.session_state.canvas_zoom + 0.1)\n                        st.rerun()\n                \n                st.session_state.canvas_zoom = zoom_value\n\n\n    def _export_to_pdf(self):\n        \"\"\"Exporta o diagrama de fluxo para PDF com visualiza\u00e7\u00e3o gr\u00e1fica\"\"\"\n        try:\n            from reportlab.lib.pagesizes import A4, landscape\n            from reportlab.pdfgen import canvas as pdf_canvas\n            from reportlab.lib.units import cm\n            from reportlab.lib import colors\n            from datetime import datetime\n            \n            # Criar buffer para o PDF\n            buffer = BytesIO()\n            \n            # Criar canvas PDF em modo paisagem\n            c = pdf_canvas.Canvas(buffer, pagesize=landscape(A4))\n            width, height = landscape(A4)\n            \n            # ========== P\u00c1GINA 1: DIAGRAMA VISUAL ==========\n            # T\u00edtulo\n            c.setFont(\"Helvetica-Bold\", 18)\n            c.drawString(2*cm, height - 2*cm, \"Diagrama de Fluxo de Emiss\u00f5es\")\n            \n            # Data\n            c.setFont(\"Helvetica\", 10)\n            c.drawString(2*cm, height - 2.8*cm, f\"Gerado em: {datetime.now().strftime('%d/%m/%Y %H:%M')}\")\n            \n            # Linha separadora\n            c.line(2*cm, height - 3.2*cm, width - 2*cm, height - 3.2*cm)\n            \n            # Desenhar o grafo visualmente\n            c.setFont(\"Helvetica-Bold\", 14)\n            c.drawString(2*cm, height - 4*cm, \"Visualiza\u00e7\u00e3o do Fluxo:\")\n            \n            # Calcular posi\u00e7\u00f5es dos n\u00f3s\n            posicoes = self._organize_nodes(\n                st.session_state.unidades,\n                st.session_state.edges,\n                st.session_state.esp_x,\n                st.session_state.esp_y\n            )\n            \n            # Normalizar posi\u00e7\u00f5es para caber no PDF\n            self._draw_flow_diagram(c, posicoes, width, height)\n            \n            # Nova p\u00e1gina para detalhes\n            c.showPage()\n            \n            # ========== P\u00c1GINA 2+: DETALHES DAS UNIDADES ==========\n            c.setFont(\"Helvetica-Bold\", 16)\n            c.drawString(2*cm, height - 2*cm, \"Detalhes das Unidades Produtivas\")\n            \n            c.setFont(\"Helvetica\", 10)\n            c.drawString(2*cm, height - 2.8*cm, f\"Total de unidades: {len(st.session_state.unidades)}\")\n            c.line(2*cm, height - 3.2*cm, width - 2*cm, height - 3.2*cm)\n            \n            # Informa\u00e7\u00f5es das unidades\n            y_position = height - 4*cm\n            c.setFont(\"Helvetica-Bold\", 12)\n            c.drawString(2*cm, y_position, \"Lista de Unidades:\")\n            y_position -= 0.8*cm\n            \n            for unidade in st.session_state.unidades:\n                # Calcular altura necess\u00e1ria para a unidade\n                tecnologia = unidade.Tecnologia if hasattr(unidade, 'Tecnologia') and unidade.Tecnologia else None\n                num_insumos = len(tecnologia.insumos) if tecnologia else 0\n                box_height = 3.5*cm + (num_insumos * 0.4*cm)  # altura base + altura dos insumos\n                \n                # Nova p\u00e1gina se n\u00e3o houver espa\u00e7o\n                if y_position < (box_height + 2*cm):\n                    c.showPage()\n                    y_position = height - 2*cm\n                \n                # Box de destaque para cada unidade\n                c.setStrokeColor(colors.HexColor(\"#0066cc\"))\n                c.setLineWidth(0.5)\n                c.rect(2*cm, y_position - box_height, width - 4*cm, box_height, stroke=1, fill=0)\n                \n                # Cabe\u00e7alho da unidade\n                c.setFillColor(colors.black)\n                c.setFont(\"Helvetica-Bold\", 10)\n                y_text = y_position - 0.5*cm\n                c.drawString(2.2*cm, y_text, f\"\ud83d\udccc {unidade.ID_ELO} - {unidade.Nome}\")\n                \n                # Informa\u00e7\u00f5es b\u00e1sicas\n                c.setFont(\"Helvetica\", 8)\n                y_text -= 0.4*cm\n                c.drawString(2.5*cm, y_text, f\"Local: {unidade.Localizacao} | Per\u00edodo: {unidade.Periodo}\")\n                \n                y_text -= 0.4*cm\n                c.drawString(2.5*cm, y_text, \n                            f\"Entrada: {unidade.Input} ({unidade.MassaInput:.2f} t) \u2192 \"\n                            f\"Sa\u00edda: {unidade.Output} ({unidade.MassaOutput:.2f} t)\")\n                \n                y_text -= 0.4*cm\n                c.drawString(2.5*cm, y_text, \n                            f\"Intensidade: {unidade.IntensidadeEmissao:.4f} tCO2e/t | \"\n                            f\"Pegada: {unidade.Pegada:.2f} tCO2e | \"\n                            f\"Emissao Total: {unidade.IntensidadeEmissao * unidade.MassaOutput:.2f} tCO2e\")\n                \n                # Informa\u00e7\u00f5es de taxa\u00e7\u00e3o\n                y_text -= 0.4*cm\n                taxacao_info = []\n                if hasattr(unidade, 'TaxacaoFronteira') and unidade.TaxacaoFronteira:\n                    taxacao_info.append(\"Taxa\u00e7\u00e3o na Fronteira\")\n                if hasattr(unidade, 'TaxacaoLocal') and unidade.TaxacaoLocal:\n                    taxacao_info.append(\"Taxa\u00e7\u00e3o Local\")\n                if taxacao_info:\n                    c.setFont(\"Helvetica-Bold\", 8)\n                    c.setFillColor(colors.HexColor(\"#cc0000\"))\n                    c.drawString(2.5*cm, y_text, f\"\u26a0 {' | '.join(taxacao_info)}\")\n                    c.setFillColor(colors.black)\n                    y_text -= 0.4*cm\n                \n                # Tecnologia\n                y_text -= 0.5*cm\n                c.setFont(\"Helvetica-Bold\", 9)\n                c.setFillColor(colors.HexColor(\"#0066cc\"))\n                if tecnologia:\n                    c.drawString(2.5*cm, y_text, f\"\ud83d\udd27 Tecnologia: {tecnologia.nome} (ID: {tecnologia.id})\")\n                else:\n                    c.drawString(2.5*cm, y_text, \"\ud83d\udd27 Tecnologia: N\u00e3o especificada\")\n                c.setFillColor(colors.black)\n                \n                # Insumos e fatores\n                if tecnologia and tecnologia.insumos:\n                    y_text -= 0.5*cm\n                    c.setFont(\"Helvetica-Bold\", 8)\n                    c.drawString(2.7*cm, y_text, \"Insumos e Fatores:\")\n                    \n                    c.setFont(\"Helvetica\", 7)\n                    for insumo in tecnologia.insumos:\n                        y_text -= 0.35*cm\n                        nome_insumo = insumo['nome']\n                        fator_consumo = insumo['fator_consumo']\n                        \n                        # Buscar fator de emiss\u00e3o\n                        fator_emissao = 0.0\n                        escopo = \"N/A\"\n                        if 'fatores_emissao' in st.session_state:\n                            for f in st.session_state.fatores_emissao:\n                                if f.get('consumivel') == nome_insumo:\n                                    fator_emissao = f.get('fator_emissao', 0.0)\n                                    escopo = f.get('escopo', 'N/A')\n                                    break\n                        \n                        # Calcular emiss\u00e3o do insumo\n                        emissao_insumo = fator_consumo * fator_emissao * unidade.MassaOutput\n                        \n                        c.drawString(3*cm, y_text, \n                                    f\"\u2022 {nome_insumo}: \"\n                                    f\"Consumo={fator_consumo:.3f} t/t | \"\n                                    f\"Fator Emissao={fator_emissao:.4f} tCO2e/t | \"\n                                    f\"Escopo {escopo} | \"\n                                    f\"Emissao={emissao_insumo:.2f} tCO2e\")\n                \n                y_position -= (box_height + 0.5*cm)\n            \n            # Conex\u00f5es\n            if y_position < 6*cm:\n                c.showPage()\n                y_position = height - 2*cm\n            \n            y_position -= 1*cm\n            c.setFont(\"Helvetica-Bold\", 12)\n            c.drawString(2*cm, y_position, f\"Conex\u00f5es do Fluxo ({len(st.session_state.edges)} conex\u00f5es):\")\n            y_position -= 0.8*cm\n            \n            c.setFont(\"Helvetica\", 9)\n            for i, edge in enumerate(st.session_state.edges, 1):\n                if y_position < 2*cm:\n                    c.showPage()\n                    y_position = height - 2*cm\n                    c.setFont(\"Helvetica\", 9)\n                \n                # Desenhar seta\n                c.setStrokeColor(colors.HexColor(\"#666666\"))\n                c.setLineWidth(1)\n                c.line(2.3*cm, y_position + 0.1*cm, 2.7*cm, y_position + 0.1*cm)\n                # Ponta da seta\n                c.line(2.7*cm, y_position + 0.1*cm, 2.6*cm, y_position + 0.2*cm)\n                c.line(2.7*cm, y_position + 0.1*cm, 2.6*cm, y_position)\n                \n                c.setFillColor(colors.black)\n                c.drawString(3*cm, y_position, f\"{i}. {edge['source']} \u2192 {edge['target']}\")\n                y_position -= 0.5*cm\n            \n            # Finalizar PDF\n            c.save()\n            \n            # Preparar para download\n            buffer.seek(0)\n            pdf_bytes = buffer.getvalue()\n            \n            st.download_button(\n                label=\"\u2b07\ufe0f Download PDF\",\n                data=pdf_bytes,\n                file_name=f\"fluxo_emissoes_{datetime.now().strftime('%Y%m%d_%H%M%S')}.pdf\",\n                mime=\"application/pdf\",\n                key=\"download_pdf_flow\"\n            )\n            \n            st.success(\"\u2705 PDF gerado com sucesso! Inclui diagrama visual e detalhes completos.\")\n            \n        except Exception as e:\n            st.error(f\"Erro ao gerar PDF: {str(e)}\")\n            import traceback\n            st.error(traceback.format_exc())\n    \n    def _draw_flow_diagram(self, c, posicoes, page_width, page_height):\n        \"\"\"Desenha o diagrama de fluxo no PDF\"\"\"\n        from reportlab.lib import colors\n        from reportlab.lib.units import cm\n        \n        # \u00c1rea dispon\u00edvel para o diagrama (deixando margens)\n        margin = 2*cm\n        diagram_width = page_width - 4*cm\n        diagram_height = page_height - 6*cm  # espa\u00e7o para t\u00edtulo\n        diagram_y_start = 4.5*cm\n        \n        # Encontrar limites das posi\u00e7\u00f5es\n        if not posicoes:\n            c.drawString(margin, page_height - 5*cm, \"Nenhum n\u00f3 para exibir\")\n            return\n        \n        x_coords = [pos[\"x\"] for pos in posicoes.values()]\n        y_coords = [pos[\"y\"] for pos in posicoes.values()]\n        \n        min_x, max_x = min(x_coords), max(x_coords)\n        min_y, max_y = min(y_coords), max(y_coords)\n        \n        # Calcular escala para normalizar\n        x_range = max_x - min_x if max_x != min_x else 1\n        y_range = max_y - min_y if max_y != min_y else 1\n        \n        scale_x = diagram_width / x_range * 0.8  # 80% para deixar margem\n        scale_y = diagram_height / y_range * 0.8\n        scale = min(scale_x, scale_y)  # usar menor escala para manter propor\u00e7\u00e3o\n        \n        # Fun\u00e7\u00e3o para normalizar coordenadas\n        def normalize_pos(x, y):\n            norm_x = margin + diagram_width/2 + (x - (min_x + max_x)/2) * scale\n            norm_y = diagram_y_start + diagram_height/2 + (y - (min_y + max_y)/2) * scale\n            return norm_x, norm_y\n        \n        # Desenhar conex\u00f5es primeiro (para ficarem atr\u00e1s dos n\u00f3s)\n        c.setStrokeColor(colors.HexColor(\"#666666\"))\n        c.setLineWidth(1.5)\n        for edge in st.session_state.edges:\n            source_id = edge['source']\n            target_id = edge['target']\n            \n            if source_id in posicoes and target_id in posicoes:\n                x1, y1 = normalize_pos(posicoes[source_id][\"x\"], posicoes[source_id][\"y\"])\n                x2, y2 = normalize_pos(posicoes[target_id][\"x\"], posicoes[target_id][\"y\"])\n                \n                # Desenhar linha\n                c.line(x1, y1, x2, y2)\n                \n                # Desenhar ponta da seta\n                import math\n                arrow_size = 0.3*cm\n                angle = math.atan2(y2 - y1, x2 - x1)\n                \n                # Pontos da seta\n                p1_x = x2 - arrow_size * math.cos(angle - math.pi/6)\n                p1_y = y2 - arrow_size * math.sin(angle - math.pi/6)\n                p2_x = x2 - arrow_size * math.cos(angle + math.pi/6)\n                p2_y = y2 - arrow_size * math.sin(angle + math.pi/6)\n                \n                c.line(x2, y2, p1_x, p1_y)\n                c.line(x2, y2, p2_x, p2_y)\n        \n        # Desenhar n\u00f3s\n        node_size = 0.8*cm\n        c.setFont(\"Helvetica\", 7)\n        \n        for unidade in st.session_state.unidades:\n            if unidade.ID_ELO in posicoes:\n                x, y = normalize_pos(posicoes[unidade.ID_ELO][\"x\"], posicoes[unidade.ID_ELO][\"y\"])\n                \n                # Cor do n\u00f3 baseada em taxa\u00e7\u00e3o\n                if unidade.TaxacaoFronteira:\n                    fill_color = colors.HexColor(\"#ffebee\")\n                    border_color = colors.HexColor(\"#cc0000\")\n                else:\n                    fill_color = colors.HexColor(\"#e6f7ff\")\n                    border_color = colors.HexColor(\"#0066cc\")\n                \n                # Desenhar ret\u00e2ngulo do n\u00f3\n                c.setFillColor(fill_color)\n                c.setStrokeColor(border_color)\n                c.setLineWidth(1.5)\n                c.rect(x - node_size, y - node_size/2, node_size*2, node_size, stroke=1, fill=1)\n                \n                # Texto do n\u00f3 (ID)\n                c.setFillColor(colors.black)\n                text_width = c.stringWidth(unidade.ID_ELO, \"Helvetica\", 7)\n                c.drawString(x - text_width/2, y - 0.15*cm, unidade.ID_ELO)\n        \n        # Legenda\n        legend_y = diagram_y_start - 0.8*cm\n        c.setFont(\"Helvetica\", 8)\n        c.drawString(margin, legend_y, \"Legenda:\")\n        \n        # Azul - sem taxa\u00e7\u00e3o\n        c.setFillColor(colors.HexColor(\"#e6f7ff\"))\n        c.setStrokeColor(colors.HexColor(\"#0066cc\"))\n        c.rect(margin + 1.5*cm, legend_y - 0.2*cm, 0.5*cm, 0.3*cm, stroke=1, fill=1)\n        c.setFillColor(colors.black)\n        c.drawString(margin + 2.2*cm, legend_y, \"Sem taxa\u00e7\u00e3o na fronteira\")\n        \n        # Vermelho - com taxa\u00e7\u00e3o\n        c.setFillColor(colors.HexColor(\"#ffebee\"))\n        c.setStrokeColor(colors.HexColor(\"#cc0000\"))\n        c.rect(margin + 6*cm, legend_y - 0.2*cm, 0.5*cm, 0.3*cm, stroke=1, fill=1)\n        c.setFillColor(colors.black)\n        c.drawString(margin + 6.7*cm, legend_y, \"Com taxa\u00e7\u00e3o na fronteira\")\n\n    def _render_selection_controls(self):\n        self._render_selection_feedback()\n\n        if st.session_state.selected_edge:\n            origem, destino = st.session_state.selected_edge['source'], st.session_state.selected_edge['target']\n            st.error(f\"Fluxo selecionado para exclus\u00e3o: {origem} \u2192 {destino}\")\n            if st.button(\"\ud83d\uddd1\ufe0f Excluir Fluxo Selecionado\", type=\"primary\"):\n                self._confirm_edge_deletion(origem, destino)\n\n    def _set_selection_mode(self, modo_selecao, modo_exclusao):\n        st.session_state.modo_selecao = modo_selecao\n        st.session_state.modo_exclusao_fluxo = modo_exclusao\n        st.session_state.selected_nodes = []\n        st.session_state.selected_edge = None\n        st.rerun()\n\n    def _render_selection_feedback(self):\n        if st.session_state.modo_selecao:\n            if len(st.session_state.selected_nodes) == 1:\n                self._render_edicao_unidade(st.session_state.selected_nodes[0])\n            elif len(st.session_state.selected_nodes) == 2:\n                self._render_connection_confirmation()\n        elif st.session_state.modo_exclusao_fluxo:\n            st.warning(\"**Modo de exclus\u00e3o ativo**\\nSelecione o fluxo que deseja excluir no diagrama\")\n\n    def _render_edicao_unidade(self, unidade_id):\n        unidade = self.utils_ui.db.get_unidade_by_id(unidade_id)\n        if not unidade:\n            st.error(\"Unidade n\u00e3o encontrada.\")\n            return\n\n        self.utils_ui.render_edit_form(\n            unidade=unidade,\n            fatores_emissao=st.session_state.fatores_emissao,\n            callback_salvar=self.utils_ui._salvar_ou_atualizar_unidade\n        )\n\n    def _render_connection_confirmation(self):\n        origem, destino = st.session_state.selected_nodes\n        col1, col2, col3 = st.columns([3, 1, 1])\n        with col1:\n            st.warning(f\"Deseja criar conex\u00e3o {origem} \u2192 {destino}?\")\n        with col2:\n            if st.button(\"\u2705 Confirmar\", type=\"primary\", use_container_width=True):\n                self._create_connection(origem, destino)\n        with col3:\n            if st.button(\"\u274c Cancelar\", type=\"secondary\", use_container_width=True):\n                st.session_state.selected_nodes = []\n                st.rerun()\n\n    def _create_connection(self, origem, destino):\n        if self._validate_connection(origem, destino):\n            self.utils_ui.db.add_edge(origem, destino)\n            st.session_state.edges = self.utils_ui.db.get_edges_for_graph()\n            st.success(f\"Conex\u00e3o criada: {origem} \u2192 {destino}\")\n            self._set_selection_mode(False, False)\n            st.rerun()\n\n    def _validate_connection(self, origem, destino):\n        if origem == destino:\n            st.error(\"N\u00e3o \u00e9 poss\u00edvel conectar um n\u00f3 a ele mesmo!\")\n            return False\n        if any(e['source'] == origem and e['target'] == destino for e in st.session_state.edges):\n            st.error(\"Esta conex\u00e3o j\u00e1 existe!\")\n            return False\n        if self._creates_cycle(origem, destino, st.session_state.edges):\n            st.error(\"Esta conex\u00e3o criaria um ciclo no grafo!\")\n            return False\n\n        destino_unidade = self.utils_ui.db.get_unidade_by_id(destino)\n        pais_ids = [e['source'] for e in st.session_state.edges if e['target'] == destino] + [origem]\n        pais = [self.utils_ui.db.get_unidade_by_id(pid) for pid in pais_ids]\n        massa_total = sum(p.MassaOutput for p in pais if p)\n\n        if massa_total > destino_unidade.MassaInput + 0.001:\n            st.error(f\"Soma das massas de sa\u00edda dos pais ({massa_total:.2f}) excede a massa de entrada do destino ({destino_unidade.MassaInput:.2f})\")\n            return False\n        return True\n\n    def _confirm_edge_deletion(self, origem_id, destino_id):\n        try:\n            self.utils_ui.db.remove_edge(origem_id, destino_id)\n            st.session_state.edges = self.utils_ui.db.get_edges_for_graph()\n            st.success(f\"Fluxo removido: {origem_id} \u2192 {destino_id}\")\n            st.session_state.selected_edge = None\n            st.rerun()\n        except Exception as e:\n            st.error(f\"Erro ao remover fluxo: {e}\")\n\n    def _render_graph(self):\n        try:\n            if not st.session_state.unidades:\n                st.info(\"Adicione unidades para visualizar o diagrama\")\n                return\n\n            posicoes = self._organize_nodes(\n                st.session_state.unidades,\n                st.session_state.edges,\n                st.session_state.esp_x,\n                st.session_state.esp_y\n            )\n            \n            zoom = st.session_state.get(\"canvas_zoom\", 1.0)\n            fig = go.Figure()\n\n            # Desenhar arestas primeiro (atr\u00e1s dos n\u00f3s)\n            for edge in st.session_state.edges:\n                source_id = edge[\"source\"]\n                target_id = edge[\"target\"]\n                if source_id in posicoes and target_id in posicoes:\n                    x0, y0 = posicoes[source_id][\"x\"], posicoes[source_id][\"y\"]\n                    x1, y1 = posicoes[target_id][\"x\"], posicoes[target_id][\"y\"]\n                    fig.add_trace(\n                        go.Scatter(\n                            x=[x0, x1],\n                            y=[y0, y1],\n                            mode=\"lines\",\n                            line=dict(color=\"#666666\", width=2),\n                            hoverinfo=\"text\",\n                            text=[f\"{source_id} -> {target_id}\", f\"{source_id} -> {target_id}\"],\n                            showlegend=False,\n                        )\n                    )\n\n            # Desenhar n\u00f3s\n            node_x, node_y, labels, marker_colors, border_colors = [], [], [], [], []\n            for u in st.session_state.unidades:\n                if u.ID_ELO not in posicoes:\n                    continue\n                node_x.append(posicoes[u.ID_ELO][\"x\"])\n                node_y.append(posicoes[u.ID_ELO][\"y\"])\n                labels.append(self._get_node_label(u).replace(\"\\n\", \"<br>\"))\n                marker_colors.append(\"#e6f7ff\" if not u.TaxacaoFronteira else \"#ffebee\")\n                border_colors.append(\"#0066cc\" if not u.TaxacaoFronteira else \"#cc0000\")\n\n            fig.add_trace(\n                go.Scatter(\n                    x=node_x,\n                    y=node_y,\n                    mode=\"markers+text\",\n                    text=[u.ID_ELO for u in st.session_state.unidades if u.ID_ELO in posicoes],\n                    textposition=\"middle center\",\n                    hoverinfo=\"text\",\n                    hovertext=labels,\n                    marker=dict(\n                        size=40,\n                        color=marker_colors,\n                        line=dict(color=border_colors, width=2),\n                        symbol=\"square\",\n                    ),\n                    showlegend=False,\n                )\n            )\n\n            fig.update_layout(\n                width=int(CANVAS_CONFIG[\"width\"] * zoom),\n                height=int(CANVAS_CONFIG[\"height\"] * zoom),\n                margin=dict(l=20, r=20, t=20, b=20),\n                paper_bgcolor=\"#ffffff\",\n                plot_bgcolor=\"#ffffff\",\n                xaxis=dict(showgrid=False, zeroline=False, showticklabels=False),\n                yaxis=dict(showgrid=False, zeroline=False, showticklabels=False),\n            )\n\n            st.plotly_chart(fig, use_container_width=True, config={\"displayModeBar\": False})\n\n            if st.session_state.modo_selecao or st.session_state.modo_exclusao_fluxo:\n                st.info(\"A sele\u00e7\u00e3o direta pelo diagrama foi desativada com a remo\u00e7\u00e3o do m\u00f3dulo streamlit_agraph.\")\n        except Exception as e:\n            st.error(f\"Erro ao renderizar o diagrama: {e}\")\n\n    def _organize_nodes(self, unidades, conexoes, espacamento_x, espacamento_y):\n        ordem = self.utils_ui.ec.determinar_ordem_fluxo(unidades, conexoes)\n        camada_por_no = {}\n        for node in ordem:\n            pais = [c['source'] for c in conexoes if c['target'] == node]\n            camada_por_no[node] = 0 if not pais else max([camada_por_no.get(p, 0) for p in pais]) + 1\n\n        posicoes = {}\n        for node, camada in camada_por_no.items():\n            nos_na_camada = [n for n, c in camada_por_no.items() if c == camada]\n            index = nos_na_camada.index(node)\n            x = camada * espacamento_x\n            y = index * espacamento_y - (len(nos_na_camada) * espacamento_y) / 2\n            posicoes[node] = {\"x\": x, \"y\": y}\n        return posicoes\n\n    def _get_node_label(self, unidade):\n        consumos = \"\\n\".join([\n            f\"\ud83d\udee2\ufe0f {c['nome']}: {e:.2f} t\"\n            for c, e in zip(unidade.Consumiveis, unidade.ConsumoEspecifico)\n        ]) if unidade.Consumiveis and unidade.ConsumoEspecifico else \"-\"\n\n        return (\n            f\"\ud83d\udccc {unidade.ID_ELO}  {unidade.Nome}\\n\"\n            f\"{unidade.Localizacao} | {unidade.Periodo}\\n\"\n            f\"{unidade.Input} ({unidade.MassaInput:.2f} t)\\n\"\n            f\"{unidade.Output} ({unidade.MassaOutput:.2f} t)\\n\"\n            f\"Insumos\\n{consumos}\\n\"\n            f\"Int. Emiss\u00e3o: {unidade.IntensidadeEmissao:.2f} tCO\u2082/t\\n\"\n            f\"Pegada Total: {unidade.Pegada:.2f} tCO\u2082\"\n        )\n\n    def _creates_cycle(self, origem, destino, edges):\n        \"\"\"Verifica se uma conex\u00e3o criaria um ciclo no grafo\"\"\"\n        grafo = {e['source']: [] for e in edges}\n        for e in edges:\n            grafo[e['source']].append(e['target'])\n        \n        grafo[origem] = grafo.get(origem, []) + [destino]\n        visitado = set()\n\n        def dfs(v, caminho):\n            \"\"\"Busca em profundidade para detectar ciclos\"\"\"\n            if v in caminho:\n                return True\n            caminho.add(v)\n            for vizinho in grafo.get(v, []):\n                if dfs(vizinho, caminho.copy()):\n                    return True\n            return False\n\n        return dfs(origem, set())", "tabs/FluxoPlotly.py": "import streamlit as st\nimport plotly.graph_objects as go\nimport networkx as nx\nimport math\nfrom config import CANVAS_CONFIG\nfrom utils import UtilsUI\nfrom core.io.excel_io import exportar_sessao_excel\nfrom core.context import AppContext\nfrom core.units import normalize_unit, co2e_label, co2e_intensity_label, convert_co2e, get_default_mass_unit_from_session, convert_mass\nfrom calculations import EmissionCalculator\nimport base64\nfrom io import BytesIO\n\n\n# \u2500\u2500\u2500 Paleta de cores \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nCOLORS = {\n    \"node_default\":   \"#3B82F6\",   # azul\n    \"node_selected\":  \"#10B981\",   # verde\n    \"node_taxacao\":   \"#EF4444\",   # vermelho\n    \"node_border\":    \"#1E3A5F\",\n    \"edge_default\":   \"#94A3B8\",\n    \"edge_selected\":  \"#F59E0B\",\n    \"edge_arrow\":     \"#64748B\",\n    \"bg\":             \"#F8FAFC\",\n    \"card_bg\":        \"rgba(255,255,255,0.92)\",\n    \"text_primary\":   \"#1E293B\",\n    \"text_secondary\": \"#64748B\",\n    \"accent\":         \"#6366F1\",\n}\n\n\nclass FluxoTab:\n    \"\"\"Diagrama de fluxo interativo usando Plotly \u2013 vers\u00e3o aprimorada.\"\"\"\n\n    def __init__(self):\n        self.utils_ui = UtilsUI()\n\n    def _on_painel_dropdown_change(self):\n        \"\"\"Sincroniza sele\u00e7\u00e3o do dropdown com o grafo e abre edi\u00e7\u00e3o.\"\"\"\n        label = st.session_state.get(\"busca_unidade_painel\")\n        if not label:\n            return\n        unidade_id = label.split(\"\u2013\")[0].strip()\n        st.session_state.selected_nodes = [unidade_id]\n        st.session_state.selected_edge = None\n        st.session_state.unidade_editando_fluxo = unidade_id\n\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    #  RENDER PRINCIPAL\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    def _render(self):\n        if not st.session_state.canvas_opened_once:\n            st.session_state.refresh_canvas = True\n            st.session_state.canvas_opened_once = True\n\n        # Garantir estados\n        _defaults = {\n            \"selected_nodes\": [],\n            \"selected_edges\": [],\n            \"selected_edge\": None,\n            \"unidade_editando_fluxo\": None,\n            \"confirmar_exclusao\": False,\n            \"nodes_para_excluir\": [],\n            \"_criar_fluxo_nodes\": [],\n            \"_open_criar_fluxo_dialog\": False,\n        }\n        for k, v in _defaults.items():\n            if k not in st.session_state:\n                st.session_state[k] = v\n\n        # Filtrar unidades e edges pelo ano ativo\n        ctx = AppContext.get()\n        ano_str = str(ctx.ano_ativo)\n        todas_unidades = st.session_state.unidades\n        todos_edges = st.session_state.edges\n\n        unidades_filtradas = [u for u in todas_unidades if str(u.Periodo) == ano_str]\n        ids_filtrados = {u.ID_ELO for u in unidades_filtradas}\n        edges_filtrados = [\n            e for e in todos_edges\n            if e.get(\"periodo\", \"\") == ano_str\n            or (not e.get(\"periodo\") and e[\"source\"] in ids_filtrados and e[\"target\"] in ids_filtrados)\n        ]\n\n        st.session_state[\"_fluxo_unidades\"] = unidades_filtradas\n        st.session_state[\"_fluxo_edges\"] = edges_filtrados\n\n        self.utils_ui.ec.propagar_pegada(todas_unidades, todos_edges)\n        self._render_sidebar(unidades_filtradas, edges_filtrados)\n        self._render_kpi_bar(unidades_filtradas, edges_filtrados)\n\n        col_graph, col_panel = st.columns([5, 2])\n        with col_graph:\n            live_sel = self._render_graph()  # retorna {\"nodes\": [...], \"edges\": [...]}\n        with col_panel:\n            with st.container(height=735, border=False):\n                self._render_selection_panel(live_sel)\n\n        self._render_interaction_panel()\n\n        if st.session_state.confirmar_exclusao:\n            self._render_confirm_delete_dialog()\n\n        if st.session_state.get(\"_open_criar_fluxo_dialog\"):\n            self._render_criar_fluxo_dialog()\n\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    #  SIDEBAR\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    def _render_sidebar(self, unidades_filtradas, edges_filtrados):\n        with st.sidebar:\n            st.markdown(\"### Diagrama de Fluxo\")\n\n            # \u2500\u2500 Filtro de ano \u2500\u2500\n            ctx = AppContext.get()\n            ctx.refresh_anos()\n            anos = ctx.anos_disponiveis\n\n            ano_filtro = st.selectbox(\n                \"\ud83d\udcc5 Ano\",\n                options=anos,\n                index=anos.index(ctx.ano_ativo) if ctx.ano_ativo in anos else 0,\n                key=\"_fluxo_ano_filtro\",\n                help=\"O diagrama exibe apenas unidades do ano selecionado.\",\n            )\n            if ano_filtro and ano_filtro != ctx.ano_ativo:\n                ctx.set_ano(ano_filtro)\n                st.rerun()\n\n            # \u2500\u2500 Busca e preview de unidades \u2500\u2500\n            self._render_sidebar_unit_search()\n\n            # \u2500\u2500 Exportar \u2500\u2500\n            st.markdown(\"---\")\n            with st.expander(\"\ud83d\udce4 Exportar\"):\n                if st.button(\"Gerar JSON\", use_container_width=True, key=\"exp_json\"):\n                    json_data = self.utils_ui.db.export_to_json()\n                    st.download_button(\n                        \"\u2b07\ufe0f Baixar JSON\", data=json_data,\n                        file_name=\"fluxo_emissao.json\",\n                        mime=\"application/json\", key=\"dl_json\",\n                        use_container_width=True,\n                    )\n\n                st.markdown(\"---\")\n\n                _ctx = AppContext.get()\n                if st.button(\"Gerar Excel\", use_container_width=True, key=\"exp_xlsx\"):\n                    try:\n                        xlsx_data = exportar_sessao_excel(\n                            unidades=list(st.session_state.get(\"unidades\", [])),\n                            conexoes=list(st.session_state.get(\"conexoes\", [])),\n                            tecnologias=list(st.session_state.get(\"tecnologias_alternativas\", [])),\n                            fatores_emissao=list(st.session_state.get(\"fatores_emissao\", [])),\n                            ano=_ctx.ano_ativo,\n                            massa_unidade=normalize_unit(st.session_state.get(\"mass_unit\", \"t\")),\n                        )\n                        st.download_button(\n                            \"\u2b07\ufe0f Baixar Excel\", data=xlsx_data,\n                            file_name=f\"sessao_emissoes_{_ctx.ano_ativo}.xlsx\",\n                            mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\",\n                            key=\"dl_xlsx\",\n                            use_container_width=True,\n                        )\n                    except Exception as e:\n                        st.error(f\"Erro ao gerar Excel: {e}\")\n\n            # \u2500\u2500 Layout \u2500\u2500\n            with st.expander(\"\u2699\ufe0f Layout\"):\n                st.slider(\"Espa\u00e7amento horizontal\", 150, 800, 350, 50, key=\"esp_x\")\n                st.slider(\"Espa\u00e7amento vertical\", 100, 500, 200, 50, key=\"esp_y\")\n                st.selectbox(\n                    \"Algoritmo de layout\",\n                    [\"Hier\u00e1rquico (Sugiyama)\", \"\u00c1rvore simples\", \"For\u00e7as (Spring)\"],\n                    index=0, key=\"layout_algo\",\n                )\n                st.caption(\"O layout Sugiyama minimiza cruzamentos de arestas.\")\n\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    #  LAYOUT / POSICIONAMENTO\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    def _build_nx_graph(self):\n        \"\"\"Constr\u00f3i o grafo NetworkX a partir do estado (filtrado por ano).\"\"\"\n        G = nx.DiGraph()\n        unidades = st.session_state.get(\"_fluxo_unidades\", st.session_state.unidades)\n        edges = st.session_state.get(\"_fluxo_edges\", st.session_state.edges)\n        for u in unidades:\n            G.add_node(u.ID_ELO)\n        for e in edges:\n            G.add_edge(e[\"source\"], e[\"target\"], massa=e.get(\"massa\", 0))\n        return G\n\n    def _organize_nodes(self, unidades, edges, esp_x, esp_y):\n        \"\"\"\n        Algoritmo Sugiyama simplificado:\n         1. Atribui\u00e7\u00e3o de camadas por longest-path\n         2. Ordena\u00e7\u00e3o dos n\u00f3s dentro de cada camada (minimizar cruzamentos com barycenter)\n         3. Posicionamento vertical centralizado\n        \"\"\"\n        algo = st.session_state.get(\"layout_algo\", \"Hier\u00e1rquico (Sugiyama)\")\n\n        G = self._build_nx_graph()\n\n        if algo == \"For\u00e7as (Spring)\" and len(G.nodes) > 0:\n            return self._layout_spring(G, esp_x, esp_y)\n\n        # \u2500\u2500 1. Atribui\u00e7\u00e3o de camadas (longest incoming path) \u2500\u2500\n        topo_order = []\n        in_degree = dict(G.in_degree())\n        queue = [n for n in G.nodes if in_degree.get(n, 0) == 0]\n        visited = set()\n        while queue:\n            n = queue.pop(0)\n            if n in visited:\n                continue\n            visited.add(n)\n            topo_order.append(n)\n            for succ in G.successors(n):\n                in_degree[succ] -= 1\n                if in_degree[succ] == 0:\n                    queue.append(succ)\n\n        # N\u00f3s sem conex\u00f5es (ilhados)\n        for u in unidades:\n            if u.ID_ELO not in visited:\n                topo_order.append(u.ID_ELO)\n\n        layer_of = {}\n        for node in topo_order:\n            preds = list(G.predecessors(node))\n            if not preds:\n                layer_of[node] = 0\n            else:\n                layer_of[node] = max(layer_of.get(p, 0) for p in preds) + 1\n\n        # \u2500\u2500 2. Agrupar n\u00f3s por camada \u2500\u2500\n        layers = {}\n        for node, layer in layer_of.items():\n            layers.setdefault(layer, []).append(node)\n\n        # \u2500\u2500 3. Barycenter ordering \u2013 m\u00faltiplas passadas para minimizar cruzamentos \u2500\u2500\n        sorted_layers = sorted(layers.keys())\n        for _pass in range(4):  # 4 passadas (forward + backward)\n            # Forward\n            for i in range(1, len(sorted_layers)):\n                layer_idx = sorted_layers[i]\n                prev_layer = sorted_layers[i - 1]\n                prev_positions = {n: idx for idx, n in enumerate(layers[prev_layer])}\n\n                def bary_fwd(node, _pp=prev_positions):\n                    preds = [p for p in G.predecessors(node) if p in _pp]\n                    if not preds:\n                        return float('inf')\n                    return sum(_pp[p] for p in preds) / len(preds)\n\n                layers[layer_idx].sort(key=bary_fwd)\n\n            # Backward\n            for i in range(len(sorted_layers) - 2, -1, -1):\n                layer_idx = sorted_layers[i]\n                next_layer = sorted_layers[i + 1]\n                next_positions = {n: idx for idx, n in enumerate(layers[next_layer])}\n\n                def bary_bwd(node, _np=next_positions):\n                    succs = [s for s in G.successors(node) if s in _np]\n                    if not succs:\n                        return float('inf')\n                    return sum(_np[s] for s in succs) / len(succs)\n\n                layers[layer_idx].sort(key=bary_bwd)\n\n        # \u2500\u2500 4. Posicionamento com centraliza\u00e7\u00e3o vertical \u2500\u2500\n        posicoes = {}\n        max_layer_size = max(len(v) for v in layers.values()) if layers else 1\n\n        for layer_idx in sorted_layers:\n            nodes = layers[layer_idx]\n            n_nodes = len(nodes)\n            total_height = (n_nodes - 1) * esp_y\n            start_y = -total_height / 2\n\n            for i, node in enumerate(nodes):\n                x = layer_idx * esp_x\n                y = start_y + i * esp_y\n                posicoes[node] = {\"x\": x, \"y\": y}\n\n        # \u2500\u2500 5. Refinamento: centralizar pais sobre filhos \u2500\u2500\n        for _ref in range(2):\n            for layer_idx in sorted_layers:\n                for node in layers[layer_idx]:\n                    children = list(G.successors(node))\n                    if children:\n                        child_ys = [posicoes[c][\"y\"] for c in children if c in posicoes]\n                        if child_ys:\n                            ideal_y = sum(child_ys) / len(child_ys)\n                            # Mover suavemente em dire\u00e7\u00e3o ao ideal\n                            posicoes[node][\"y\"] = (posicoes[node][\"y\"] + ideal_y) / 2\n\n        return posicoes\n\n    def _layout_spring(self, G, esp_x, esp_y):\n        \"\"\"Layout baseado em for\u00e7as (spring) para grafos n\u00e3o-hier\u00e1rquicos.\"\"\"\n        if len(G.nodes) == 0:\n            return {}\n        pos = nx.spring_layout(G, k=esp_x / 100, iterations=80, seed=42)\n        posicoes = {}\n        for node, (x, y) in pos.items():\n            posicoes[node] = {\"x\": x * esp_x * 2, \"y\": y * esp_y * 2}\n        return posicoes\n\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    #  SIDEBAR \u2013 busca e preview de unidades\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    def _render_sidebar_unit_search(self):\n        \"\"\"Se\u00e7\u00e3o da sidebar: busca, sele\u00e7\u00e3o e preview de unidades.\"\"\"\n        st.markdown(\"---\")\n        st.markdown(\"#### \ud83d\udd0d Unidades\")\n\n        if not st.session_state.unidades:\n            st.caption(\"Nenhuma unidade cadastrada.\")\n            return\n\n        opcoes = {}\n        lista = []\n        for u in st.session_state.unidades:\n            label = f\"{u.ID_ELO} \u2013 {u.Nome}\"\n            opcoes[label] = u.ID_ELO\n            lista.append(label)\n\n        # Sincronizar dropdown com sele\u00e7\u00e3o do grafo (1 n\u00f3 selecionado)\n        if len(st.session_state.selected_nodes) == 1:\n            nid = st.session_state.selected_nodes[0]\n            target_label = next((lbl for lbl in lista if opcoes[lbl] == nid), None)\n            if target_label and st.session_state.get(\"busca_unidade_painel\") != target_label:\n                st.session_state[\"busca_unidade_painel\"] = target_label\n\n        default_idx = 0\n        current_label = st.session_state.get(\"busca_unidade_painel\")\n        if current_label in lista:\n            default_idx = lista.index(current_label)\n\n        sel_label = st.selectbox(\n            \"Unidade:\",\n            lista,\n            index=default_idx,\n            key=\"busca_unidade_painel\",\n            on_change=self._on_painel_dropdown_change,\n            label_visibility=\"collapsed\",\n        )\n\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    #  KPI BAR + TOOLBAR\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    def _render_kpi_bar(self, unidades_filtradas, edges_filtrados):\n        \"\"\"Faixa de KPIs do ano ativo: unidades, fluxos, emiss\u00e3o, intensidade m\u00e9dia.\"\"\"\n        if not unidades_filtradas:\n            return\n        ctx = AppContext.get()\n        _mu = normalize_unit(st.session_state.get(\"mass_unit\", \"t\"))\n        sel_nodes = st.session_state.get(\"selected_nodes\")\n        ids_sel = set(sel_nodes) if sel_nodes else None\n        totais = EmissionCalculator.calcular_totais_display(\n            unidades_filtradas, mass_unit=_mu, ids_selecionados=ids_sel\n        )\n        n_taxacao = sum(1 for u in unidades_filtradas if u.TaxacaoFronteira or u.TaxacaoLocal)\n\n        c1, c2, c3, c4, c5 = st.columns(5)\n        c1.metric(\"\ud83d\udcc5 Ano\", ctx.ano_ativo)\n        c2.metric(\"\ud83c\udfed Unidades\", len(unidades_filtradas))\n        c3.metric(\"\ud83d\udd17 Fluxos\", len(edges_filtrados))\n        c4.metric(\n            \"\ud83c\udf0d Emiss\u00e3o total\",\n            f\"{totais['total']:,.1f} {totais['co2e_lbl']}\",\n            help=\"Soma de emiss\u00f5es pr\u00f3prias \u00d7 output (unidades vis\u00edveis; filtra sele\u00e7\u00e3o se ativa)\",\n        )\n        c5.metric(\n            \"\u26a1 Intensidade m\u00e9dia\",\n            f\"{totais['intensidade_media']:.4f} {totais['int_lbl']}\",\n            help=\"M\u00e9dia aritm\u00e9tica da intensidade de emiss\u00e3o entre as unidades vis\u00edveis\",\n        )\n        if n_taxacao:\n            st.warning(\n                f\"\u26a0\ufe0f {n_taxacao} unidade(s) com taxa\u00e7\u00e3o ativa (fronteira ou local)\",\n                icon=\"\u26a0\ufe0f\",\n            )\n        st.divider()\n\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    #  CRIA\u00c7\u00c3O DO GR\u00c1FICO PLOTLY\n    # \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n    def _render_graph(self):\n        \"\"\"Renderiza o gr\u00e1fico Plotly e retorna a sele\u00e7\u00e3o live parseada.\n\n        Returns:\n            dict com chaves \"nodes\" (list[str]) e \"edges\" (list[dict]).\n            Se n\u00e3o houver sele\u00e7\u00e3o nova, retorna listas vazias.\n        \"\"\"\n        empty_sel = {\"nodes\": [], \"edges\": []}\n\n        unidades = st.session_state.get(\"_fluxo_unidades\", st.session_state.unidades)\n        edges = st.session_state.get(\"_fluxo_edges\", st.session_state.edges)\n\n        if not unidades:\n            ctx = AppContext.get()\n            st.info(f\"Nenhuma unidade encontrada para o ano **{ctx.ano_ativo}**. \"\n                    \"Adicione unidades ou selecione outro ano.\")\n            return empty_sel\n\n        posicoes = self._organize_nodes(\n            unidades,\n            edges,\n            st.session_state.get(\"esp_x\", 350),\n            st.session_state.get(\"esp_y\", 200),\n        )\n\n        fig = self._create_figure(posicoes)\n\n        config = {\n            \"displayModeBar\": True,\n            \"displaylogo\": False,\n            \"modeBarButtonsToRemove\": [\"autoScale2d\"],\n            \"scrollZoom\": True,\n            \"toImageButtonOptions\": {\n                \"format\": \"png\",\n                \"filename\": \"diagrama_fluxo\",\n                \"height\": 900,\n                \"width\": 1400,\n                \"scale\": 2,\n            },\n        }\n\n        event = st.plotly_chart(\n            fig,\n            use_container_width=True,\n            config=config,\n            key=\"flow_diagram\",\n            on_select=\"rerun\",\n            selection_mode=(\"points\", \"box\", \"lasso\"),\n        )\n\n        # Parsear evento Plotly \u2192 sele\u00e7\u00e3o live\n        live_sel = self._parse_plotly_event(event)\n\n        # Sincronizar session_s
